<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kubernetes Failure Semantics — Results</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0f1115;
    --bg-elev: #161922;
    --bg-elev2: #1e2230;
    --fg: #e6e9ef;
    --fg-dim: #9aa3b2;
    --fg-faint: #5a6273;
    --accent: #7aa2f7;
    --accent-dim: #3b4a6b;
    --ok: #9ece6a;
    --warn: #e0af68;
    --err: #f7768e;
    --na: #565f72;
    --border: #262b38;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    background: var(--bg-elev); display: flex; gap: 20px; align-items: baseline;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
  header .meta { color: var(--fg-dim); font-size: 12px; }

  .layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 60px); }
  nav { border-right: 1px solid var(--border); background: var(--bg-elev); padding: 14px 0; overflow-y: auto; }
  nav .group { padding: 4px 18px 4px; color: var(--fg-faint); text-transform: uppercase;
    font-size: 11px; letter-spacing: 0.8px; margin-top: 10px; }
  nav button {
    display: block; width: 100%; text-align: left; padding: 7px 18px;
    background: transparent; border: none; color: var(--fg); cursor: pointer;
    font: inherit; border-left: 3px solid transparent;
  }
  nav button:hover { background: var(--bg-elev2); }
  nav button.active { background: var(--bg-elev2); border-left-color: var(--accent); color: var(--fg); }
  nav .sub { padding-left: 36px; font-size: 13px; color: var(--fg-dim); }
  nav .sub.active { color: var(--fg); }

  main { padding: 24px 28px; overflow-x: auto; }
  h2 { margin: 0 0 4px 0; font-size: 20px; font-weight: 600; }
  h3 { margin: 24px 0 10px 0; font-size: 15px; font-weight: 600; color: var(--fg-dim);
    text-transform: uppercase; letter-spacing: 0.6px; }
  .crumb { color: var(--fg-dim); font-size: 12px; margin-bottom: 18px; }
  .crumb span { color: var(--fg-faint); }

  table.heatmap { border-collapse: separate; border-spacing: 4px; margin-top: 6px; }
  table.heatmap th, table.heatmap td {
    padding: 8px 12px; min-width: 86px; text-align: center; border-radius: 4px;
    font-size: 12px; font-weight: 500;
  }
  table.heatmap th { background: var(--bg-elev); color: var(--fg-dim); font-weight: 500; }
  table.heatmap td.scenario { background: var(--bg-elev); color: var(--fg);
    text-align: left; font-family: ui-monospace, monospace; min-width: 60px; }
  td.v-PRESERVED { background: rgba(158, 206, 106, 0.18); color: var(--ok); }
  td.v-VIOLATED { background: rgba(247, 118, 142, 0.22); color: var(--err); }
  td.v-INSUFFICIENT_DATA { background: rgba(224, 175, 104, 0.16); color: var(--warn); }
  td.v-NO_DATA, td.v-PARSE_ERROR { background: var(--bg-elev); color: var(--na); }
  /* DETECTOR_INVALID: the invariant was already violated in the baseline
     snapshot, so the detector — not the cluster — is what failed. Styled
     apart from VIOLATED because reading one as the other is the mistake the
     calibration gate exists to prevent. */
  td.v-DETECTOR_INVALID { background: rgba(122, 162, 247, 0.16); color: var(--info, #7aa2f7); }
  td.v-FAULT_INEFFECTIVE { background: var(--bg-elev); color: var(--na); font-style: italic; }
  /* NOT_APPLICABLE: this fault class cannot produce the state the invariant
     forbids, so the cell is a question that was never asked. It gets its own
     colour rather than sharing PRESERVED's green — reading the two as the same
     thing is exactly what inflated the preserved column (REVIEW.md M4). It is
     also deliberately NOT the same grey as NO_DATA: "inapplicable" is a
     judgement the checker made, "no data" is the absence of one. */
  td.v-NOT_APPLICABLE { background: rgba(86, 95, 114, 0.22); color: var(--fg-dim);
    border: 1px dashed var(--fg-faint); }
  /* Any verdict this report does not know about. Rendered verbatim and marked,
     never folded into a default bucket: a vocabulary that grows again must show
     up as something a reader can see, not as a silent NO_DATA. */
  td.v-UNRECOGNISED { background: rgba(224, 175, 104, 0.10); color: var(--warn);
    border: 1px dotted var(--warn); }

  .stale-notice { border: 1px solid rgba(247, 118, 142, 0.5);
    background: rgba(247, 118, 142, 0.10); color: var(--fg);
    border-radius: 6px; padding: 12px 14px; margin: 0 0 18px; font-size: 13px;
    line-height: 1.55; }
  .stale-notice b { color: var(--err); }

  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500;
    background: var(--bg-elev2); color: var(--fg-dim); }
  .badge.ok { background: rgba(158, 206, 106, 0.18); color: var(--ok); }
  .badge.err { background: rgba(247, 118, 142, 0.22); color: var(--err); }
  .badge.warn { background: rgba(224, 175, 104, 0.16); color: var(--warn); }
  .badge.na { color: var(--na); }
  .badge.inapplicable { background: rgba(86, 95, 114, 0.22); color: var(--fg-dim);
    border: 1px dashed var(--fg-faint); }
  .badge.info { background: rgba(122, 162, 247, 0.16); color: var(--accent); }
  .badge.unrecognised { background: rgba(224, 175, 104, 0.10); color: var(--warn);
    border: 1px dotted var(--warn); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 0;
    color: var(--fg-dim); font-size: 11px; }
  .legend .badge { cursor: default; }
  .dur { color: var(--fg-dim); font-size: 11px; margin-left: 8px; }
  .dur b { color: var(--fg); font-weight: 500; }
  .na-why { color: var(--fg-dim); font-size: 12px; margin-top: 6px;
    border-left: 2px solid var(--fg-faint); padding-left: 10px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin: 12px 0; max-width: 720px; }
  .card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 14px; }
  .card .n { font-size: 22px; font-weight: 600; }
  .card .lbl { color: var(--fg-dim); font-size: 12px; margin-top: 4px; }

  .invariant-row { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 14px; margin: 8px 0; }
  .invariant-row .head { display: flex; gap: 12px; align-items: center; }
  .invariant-row .id { font-family: ui-monospace, monospace; color: var(--accent); font-weight: 600; }
  .invariant-row .name { color: var(--fg-dim); }
  .invariant-row .grow { flex: 1; }
  .invariant-row pre { margin: 8px 0 0 0; max-height: 240px; overflow: auto;
    background: var(--bg); border: 1px solid var(--border); padding: 8px;
    border-radius: 4px; font-size: 11px; color: var(--fg-dim); white-space: pre-wrap; }

  .timeline { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 20px; }
  .timeline button { background: var(--bg-elev); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 4px; cursor: pointer;
    font: inherit; font-size: 12px; }
  .timeline button:hover { background: var(--bg-elev2); }
  .timeline button.active { border-color: var(--accent); color: var(--accent); }
  .timeline .phase { font-size: 10px; color: var(--fg-faint);
    text-transform: uppercase; margin-right: 4px; align-self: center; }

  .snap-meta { color: var(--fg-dim); font-size: 12px; margin: 8px 0 14px; }
  .snap-meta b { color: var(--fg); font-weight: 500; }
  .snap-meta .sep { color: var(--fg-faint); margin: 0 8px; }

  details.snap-section { margin: 8px 0; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg-elev); }
  details.snap-section > summary { padding: 8px 12px; cursor: pointer; user-select: none;
    color: var(--fg); font-weight: 500; font-size: 13px; }
  details.snap-section > summary:hover { background: var(--bg-elev2); }
  details.snap-section[open] > summary { border-bottom: 1px solid var(--border); }
  details.snap-section .body { padding: 10px 12px; }
  details.snap-section pre { margin: 0; max-height: 480px; overflow: auto; font-size: 11px;
    background: var(--bg); border-radius: 4px; padding: 8px; color: var(--fg-dim); }

  .kv { display: grid; grid-template-columns: 220px 1fr; gap: 4px 14px; margin: 8px 0; }
  .kv .k { color: var(--fg-dim); }
  .kv .v { font-family: ui-monospace, monospace; font-size: 12px; }

  .empty { color: var(--fg-dim); font-style: italic; margin: 14px 0; }

  .ref-intro { color: var(--fg-dim); max-width: 760px; margin: 6px 0 18px; }
  .ref-toolbar { display: flex; gap: 8px; margin: 8px 0 14px; max-width: 880px; }
  .ref-toolbar button { background: var(--bg-elev); border: 1px solid var(--border);
    color: var(--fg); padding: 5px 12px; border-radius: 4px; cursor: pointer;
    font: inherit; font-size: 12px; }
  .ref-toolbar button:hover { background: var(--bg-elev2); border-color: var(--accent-dim); }

  details.ref-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px;
    margin: 10px 0; max-width: 880px; overflow: hidden; }
  details.ref-card > summary {
    padding: 12px 16px; cursor: pointer; user-select: none;
    display: flex; gap: 14px; align-items: baseline; list-style: none;
  }
  details.ref-card > summary::-webkit-details-marker { display: none; }
  details.ref-card > summary::before {
    content: "▶"; color: var(--fg-faint); font-size: 9px;
    transition: transform 0.15s ease; display: inline-block;
    transform: rotate(0deg); flex: 0 0 auto;
  }
  details.ref-card[open] > summary::before { transform: rotate(90deg); }
  details.ref-card > summary:hover { background: var(--bg-elev2); }
  details.ref-card[open] > summary { border-bottom: 1px solid var(--border); }
  details.ref-card .ref-head .id { color: var(--accent); font-weight: 600;
    font-family: ui-monospace, monospace; min-width: 36px; }
  details.ref-card .ref-head .name { font-weight: 600; color: var(--fg); }
  details.ref-card .ref-body { padding: 12px 16px; color: var(--fg-dim); }
  details.ref-card .ref-body p { margin: 4px 0 8px; }
  details.ref-card .ref-body p b { color: var(--fg); font-weight: 500; }
  details.ref-card .kv { grid-template-columns: 180px 1fr; margin-top: 10px; }
  details.ref-card .kv .v.plain { font-family: inherit; color: var(--fg-dim); }

  .recap { margin: 12px 0; padding: 10px 12px; border-radius: 5px;
    background: rgba(122, 162, 247, 0.07); border-left: 3px solid var(--accent-dim);
    color: var(--fg-dim); font-size: 13px; line-height: 1.55; }
  .recap.observed { border-left-color: var(--ok);
    background: rgba(158, 206, 106, 0.06); }
  .recap.hypothesised { border-left-color: var(--warn);
    background: rgba(224, 175, 104, 0.05); }
  .recap-label { display: inline-block; font-size: 10px; letter-spacing: 0.6px;
    text-transform: uppercase; font-weight: 600; padding: 2px 7px; border-radius: 3px;
    margin-right: 8px; background: var(--bg-elev2); color: var(--fg-dim); vertical-align: 2px; }
  .recap.observed .recap-label { background: rgba(158, 206, 106, 0.16); color: var(--ok); }
  .recap.hypothesised .recap-label { background: rgba(224, 175, 104, 0.16); color: var(--warn); }

  details.ref-card .grow { flex: 1; }

  /* ── Findings page ───────────────────────────────────────────────────── */
  .findings-toc {
    display: flex; flex-wrap: wrap; gap: 8px;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 14px; margin: 8px 0 22px;
    max-width: 880px;
  }
  .findings-toc a {
    padding: 4px 10px; border-radius: 4px;
    background: var(--bg-elev2); color: var(--fg-dim);
    font-size: 12px; text-decoration: none;
  }
  .findings-toc a:hover { background: var(--accent-dim); color: var(--fg); }

  main h3[id^="finding-"] {
    margin-top: 32px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  main h3[id^="finding-"]:first-of-type { border-top: none; padding-top: 0; }

  .findings-coverage, .findings-synth {
    border-collapse: collapse; margin: 10px 0 16px; max-width: 880px;
    width: 100%;
  }
  .findings-coverage th, .findings-synth th,
  .findings-coverage td, .findings-synth td {
    padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .findings-coverage th, .findings-synth th {
    background: var(--bg-elev); color: var(--fg-dim); font-weight: 500;
    border-bottom: 1px solid var(--border);
  }
  .findings-coverage td:last-child, .findings-synth td:nth-child(3) {
    text-align: right; font-family: ui-monospace, monospace;
  }
  .findings-synth td:nth-child(2) {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px;
    color: var(--fg-faint);
  }

  .finding-inv {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 6px; padding: 14px 18px; margin: 14px 0; max-width: 880px;
  }
  .finding-inv-head {
    display: flex; gap: 14px; align-items: baseline;
    margin-bottom: 8px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .finding-inv-head .id {
    color: var(--accent); font-weight: 600;
    font-family: ui-monospace, monospace; min-width: 30px;
  }
  .finding-inv-head .id a { color: inherit; }
  .finding-inv-head .name {
    font-weight: 600; color: var(--fg); flex: 1;
  }
  .finding-inv-head .badge em {
    font-style: normal; font-weight: 400; opacity: 0.7;
    margin-left: 4px; font-size: 9px; letter-spacing: 0.3px;
  }
  .finding-inv p { margin: 6px 0; color: var(--fg-dim); font-size: 13px; line-height: 1.6; }
  .finding-inv p b, .finding-inv p strong { color: var(--fg); font-weight: 600; }
  .finding-inv ol, .finding-inv ul {
    margin: 6px 0 6px 0; padding-left: 20px; color: var(--fg-dim); font-size: 13px; line-height: 1.6;
  }
  .finding-inv li { margin: 4px 0; }
  .finding-inv code {
    background: var(--bg); border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 3px; font-size: 11px;
  }

  .incident {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 14px 18px; margin: 14px 0; max-width: 880px;
  }
  .incident .incident-event {
    background: rgba(122, 162, 247, 0.08);
    padding: 10px 14px; border-radius: 5px;
    margin-bottom: 14px; color: var(--fg);
    font-size: 13px; line-height: 1.55;
  }
  .incident p, .incident ol, .incident ul {
    color: var(--fg-dim); font-size: 13px; line-height: 1.6;
  }
  .incident p.do { color: var(--ok); margin-top: 16px; }
  .incident p.dont { color: var(--err); margin-top: 12px; }
  .incident .do-list li { color: var(--fg-dim); }
  .incident .do-list li::marker { color: var(--ok); }
  .incident .dont-list li { color: var(--fg-dim); }
  .incident .dont-list li::marker { color: var(--err); }
  .incident code {
    background: var(--bg); border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 3px; font-size: 11px;
  }

  .caveats { max-width: 880px; color: var(--fg-dim); font-size: 13px; line-height: 1.6; }
  .caveats li { margin: 6px 0; }
  .caveats li b, .caveats li strong { color: var(--fg); font-weight: 600; }
  .muted { color: var(--fg-faint); font-size: 12px; font-style: italic; }
  .badge.paper-badge { background: var(--bg-elev2); color: var(--fg-dim); font-weight: 500; }
  .badge.ext-badge {
    background: rgba(122, 162, 247, 0.18);
    color: var(--accent);
    font-weight: 500;
  }

  .scenario-blurb { color: var(--fg-dim); max-width: 820px; margin: 8px 0 12px; }
  .scenario-blurb a { font-size: 11px; }
  .invariant-row .desc { color: var(--fg-dim); font-size: 12px; margin-top: 4px; }
  .invariant-row .id a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--accent-dim); }
  .invariant-row .id a:hover { border-bottom-color: var(--accent); }

  .run-row { padding: 6px 18px; color: var(--fg-dim); font-size: 12px; }
  .run-row.active { color: var(--fg); }
  .run-row button { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>Kubernetes Failure Semantics — Results</h1>
  <div class="meta" id="hdr-meta"></div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
const DATA = /*__REPORT_DATA__*/null;

// ── Scenario catalogue (paper Table + scenario playbook headers) ─────────────
const CATALOG = {
  s1: {
    name: "Symmetric control-plane partition",
    fault: "network_partition",
    invariants: ["I1","I3"],
    summary: "Isolates one control-plane node (cp1) from its peers and from etcd.",
    description: "iptables rules drop traffic between cp1 and { cp2, cp3, etcd1-3 } in both directions. The isolated node cannot reach a majority of etcd or the other API servers; the remaining two control-plane nodes should still form a working majority. We measure whether a second leader lease holder appears (I1 violation), how long the isolated API server takes to report unhealthy, whether etcd loses quorum, and the recovery trajectory after the partition is lifted.",
    recap: "Observed across 7 snapshots: I1 and I3 held throughout, and I9 confirms the substrate kept quorum — the partitioned cp1 stopped emitting authoritative writes before any duplicate ownership could appear, and the surviving cp2/cp3 re-elected cleanly. I2 also held this time (the only scenario in the sweep where it did): cp2's vantage point onto the cluster IP kept reachability publication consistent. The interesting violations are I5 (4 of 7) and I6 (3 of 7) — controllers continued reconciling against state cp1 could not commit, and the observed etcd revision actually regressed between consecutive snapshots, exposing a watch reset the paper's original I1–I5 frame cannot name. Recovery terminated cleanly (I10 preserved).",
  },
  s2: {
    name: "Asymmetric worker isolation",
    fault: "network_asymmetric",
    invariants: ["I1","I2","I3"],
    summary: "One worker can be reached but cannot send replies (or vice versa).",
    description: "One direction of traffic for a worker is dropped, so the kubelet's heartbeat and a control-plane-initiated probe see opposite states. Tests whether endpoints are correctly republished when the backend is one-way unreachable, and whether the control plane declares the node failed before pods are reconciled away from it.",
    recap: "Observed (May 21 re-run) — the scenario that demonstrates an I1 violation. I1 VIOLATED in 3 snapshots: postgres-stateful-0 ran as a CONTAINER_RUNNING container on worker1 AND worker2 simultaneously, confirmed by node-local crictl on both. The mechanism is precise: worker1 is partitioned (including the API VIP, so the kubelet genuinely stops heartbeating and the node goes NotReady); an operator then force-deletes the stuck postgres-stateful-0 (kubectl delete --force --grace-period=0); the StatefulSet controller, seeing the identity vacated in the API, recreates postgres-stateful-0 on worker2 — while worker1, unable to be reached, keeps the original running. Kubernetes does NOT do this on its own: StatefulSet is at-most-one by design and the pod simply sits Terminating. The I1 violation is operator-induced, not an automatic consequence of the partition — itself a paper-worthy distinction. I2 VIOLATED (12) and I5 VIOLATED (10): endpoints kept publishing worker1's pods while they were unreachable, and controllers kept reconciling against that stale view. I6 VIOLATED (3). I3 PRESERVED, I9 PRESERVED (substrate kept quorum), I10 PRESERVED. Note: an earlier run showed I1 PRESERVED — not because authority held, but because the scenario could not induce dual ownership at all (the partition missed the VIP, the StatefulSet had no storage, and no force-delete was performed); see commit history.",
  },
  s3: {
    name: "etcd write-latency degradation",
    fault: "etcd_latency",
    invariants: ["I5"],
    summary: "Toxiproxy injects latency on the etcd write path.",
    description: "All API-server → etcd writes route through a Toxiproxy in front of each etcd member, with added latency injected as a toxic. Controllers see writes succeed eventually but their observed revisions lag wall-clock time. Tests whether controllers throttle reconciliation under storage lag or amplify it.",
    recap: "Observed across 7 snapshots: I5 VIOLATED 7 of 7 — controllers re-issued reconciliations while their etcd writes were still in flight at the injected 800 ms latency, exactly the amplification pattern the scenario is designed to expose. I2 also 7 of 7 violated: endpoint publication lagged actual workload state during the latency window. I6 3 violations (revision regression on rejoin). I1 held — no dual leaders despite slow writes — and I9 confirms the substrate was healthy throughout; only the latency budget was perturbed. I10 preserved: reconciliation terminated within the post-fault window.",
  },
  s4: {
    name: "Clock skew on control-plane node",
    fault: "clock_skew",
    invariants: ["I1","I3"],
    summary: "Shifts cp1's clock forward/back relative to its peers.",
    description: "date is stepped on cp1 while chrony is paused. Leases, certificate validity, and event ordering all depend on local time; the test asks whether the cluster forms a coherent picture of failure when timestamps disagree.",
    recap: "Observed across 6 snapshots: I1 held — no overlapping lease holders, contradicting the hypothesis that local-clock-based leaseDurationSeconds evaluation would create dual-authority windows. I3 also held. The skew did destabilise the *observer's* view: I2 violated 4 of 6 (endpoint refresh through the skewed apiserver lagged), I5 violated 4 of 6, I6 3 times. I9 confirms quorum stayed intact. The data shows authority is more robust to clock skew than reachability publication is — the latter degrades smoothly with the skew window.",
  },
  s5: {
    name: "API disruption under multiple controllers",
    fault: "network_partition",
    invariants: ["I1","I5"],
    summary: "Multiple controllers race during a flapping API-server outage.",
    description: "API-server reachability is repeatedly blackholed while several controllers (custom operator + built-in) are mid-reconciliation. Measures lease-holder churn and reconciliation amplification.",
    recap: "Hypothesised — not in this sweep (skipped to keep the run under wall-clock budget). The S5 scenario blocks API port 6443 on every control-plane host simultaneously; under our SSH-burst constraints it was the most likely to trip sshd MaxStartups across all observers at once. Worth running once the cluster has fail2ban whitelisting or a serialised burst limiter in place. Until then the predicted I1 violations at lease-flap boundaries and I5 amplification under partial API availability remain hypothesised, not measured.",
  },
  s6: {
    name: "Repeat-run recovery study",
    fault: "network_asymmetric",
    invariants: ["I4"],
    summary: "Same fault N times, comparing the post-fault state across runs.",

// ── Invariant glossary ───────────────────────────────────────────────────────
// I1–I5 are the paper's original invariants (§4). I6, I9, I10 are extended
// invariants implemented by scripts/check-invariants.sh — see commit history
// for the rationale of each. I6/I9/I10 are evaluated against every scenario
// (they are universal substrate/observer properties, not scenario-specific).
const INVARIANTS = {
  I1: {
    name: "Exclusive authority",
    description: "At most one process holds the authoritative role (controller-manager lease, scheduler lease, primary StatefulSet replica) at any wall-clock instant.",
    violation: "Two simultaneous distinct lease holders observed across snapshots, or duplicate StatefulSet pod identities running on different nodes.",
    origin: "paper",
  },
  I2: {
    name: "Reachability publication",
    description: "Endpoints published for a service correspond to backends that can actually serve traffic. Clients reading published endpoints should not be told to talk to a backend that has stopped.",
    violation: "Endpoints list contains addresses of pods that are not Running, or the external probe (cluster-IP HTTP request) returns non-200 while endpoints are listed as Ready.",
    origin: "paper",
  },
  I3: {
    name: "Failure declaration consistency",
    description: "A node declared NotReady by the control plane has actually stopped running its workloads from the node's own perspective. Declaration and reality agree.",
    violation: "Node status shows Ready=False in the API while node-local crictl reports containers in CONTAINER_RUNNING state.",
    origin: "paper",
  },
  I4: {
    name: "Recovery coherence",
    description: "After a fault is removed, the cluster converges to a state that is uniquely determined by the inputs — not dependent on which controller noticed recovery first.",
    violation: "Across repeated runs of the same fault, the post-fault snapshots disagree on lease holder, pod placement, or endpoint membership. Only S6 can evaluate this; single-shot scenarios report INSUFFICIENT_DATA.",
    origin: "paper",
  },
  I5: {
    name: "Observation-action consistency",
    description: "Controllers do not act on observations they can prove are stale. Reconciliation traffic should correlate with state change, not race ahead of it.",
    violation: "etcd revision advances by more than 500 between snapshots without any change in pod state or lease holder (high reconciliation churn on unchanged state), or Warning events claim NodeNotReady while the same snapshot shows Ready=True nodes.",
    origin: "paper",
  },
  I6: {
    name: "Watch progress monotonicity",
    description: "Between consecutive observations, the etcd revision the cluster reports never decreases. A backward revision means a controller (or the API server) has reset its view to an earlier point — e.g. after a watch re-list following compaction, or because a minority etcd partition briefly served stale reads.",
    violation: "Two consecutive snapshots where snapshot[k+1].etcd.current_revision < snapshot[k].etcd.current_revision.",
    origin: "extension",
  },
  I9: {
    name: "Quorum continuity",
    description: "At every observation point, a majority of etcd members are alive and responding to status queries. This is the substrate-side counterpart to I1: it distinguishes 'the cluster lost quorum' (a design failure) from 'the cluster kept quorum but its observers diverged' (the paper's observer-relative result). Without I9 holding, the other invariants' verdicts cannot be attributed to observer-side effects.",
    violation: "At any snapshot, fewer than ⌈n/2⌉+1 etcd members respond to etcdctl endpoint status. Cluster size n is inferred as the maximum members observed across the run.",
    origin: "extension",
  },
  I10: {
    name: "Reconciliation termination",
    description: "After fault removal, the cluster stops emitting new Warning events about the affected workload within the observation window. Asks 'did recovery converge at all?' as opposed to I4's 'did recovery converge to the same place?'. Catches the silent oscillation failure mode where the cluster appears structurally healthy but is still firing reconciliation events forever.",
    violation: "Between the first and last post-fault snapshots, new (involvedObject.name, reason) pairs appear in .control_plane.warning_events — i.e. fresh problems are still being raised. Requires ≥ 2 post-fault snapshots to evaluate.",
    origin: "extension",
  },
};
const INVARIANT_NAMES = Object.fromEntries(Object.entries(INVARIANTS).map(([k,v]) => [k, v.name.toLowerCase()]));
const INVARIANT_IDS = Object.keys(INVARIANTS);
const PHASE_OF = (label) => {
  if (!label) return "?";
  if (label === "pre_fault") return "pre";
  if (label.startsWith("post_fault") || label.startsWith("post_recovery") || label.startsWith("post_convergence")) return "post";
  return "during";
};

// ── App state ────────────────────────────────────────────────────────────────
const state = { view: "overview", scenario: null, run: null, snapshot: null };

// ── Routing via hash ─────────────────────────────────────────────────────────
function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  if (!h) return { view: "overview" };
  const parts = h.split("/");
  if (parts[0] === "scenario" && parts[1]) {
    return { view: "scenario", scenario: parts[1], run: parts[2] || null, snapshot: parts[3] || null };
  }
  if (parts[0] === "reference") {
    return { view: "reference", anchor: parts[1] || null };
  }
  if (parts[0] === "findings") {
    return { view: "findings", anchor: parts[1] || null };
  }
  return { view: "overview" };
}
function setHash(s) {
  let h = "";
  if (s.view === "scenario") {
    h = "#/scenario/" + s.scenario;
    if (s.run) h += "/" + s.run;
    if (s.snapshot) h += "/" + s.snapshot;
  } else if (s.view === "reference") {
    h = "#/reference" + (s.anchor ? "/" + s.anchor : "");
  } else if (s.view === "findings") {
    h = "#/findings" + (s.anchor ? "/" + s.anchor : "");
  } else {
    h = "#/";
  }
  if (location.hash !== h) location.hash = h;
}

// ── Header meta ──────────────────────────────────────────────────────────────
function renderHeader() {
  const el = document.getElementById("hdr-meta");
  const scenarioCount = Object.keys(DATA.scenarios).length;
  el.textContent = `${scenarioCount} scenario${scenarioCount === 1 ? "" : "s"} · generated ${DATA.generated_at}`;
}

// ── Nav ──────────────────────────────────────────────────────────────────────
function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";

  const overviewBtn = document.createElement("button");
  overviewBtn.textContent = "Overview";
  overviewBtn.className = state.view === "overview" ? "active" : "";
  overviewBtn.onclick = () => navigate({ view: "overview" });
  nav.appendChild(overviewBtn);

  const findingsBtn = document.createElement("button");
  findingsBtn.textContent = "Findings";
  findingsBtn.className = state.view === "findings" ? "active" : "";
  findingsBtn.onclick = () => navigate({ view: "findings" });
  nav.appendChild(findingsBtn);

  const refBtn = document.createElement("button");
  refBtn.textContent = "Reference";
  refBtn.className = state.view === "reference" ? "active" : "";
  refBtn.onclick = () => navigate({ view: "reference" });
  nav.appendChild(refBtn);

  const group = document.createElement("div");
  group.className = "group";
  group.textContent = "Scenarios";
  nav.appendChild(group);

  const scenarioIds = Object.keys(CATALOG);
  for (const sc of scenarioIds) {
    const hasData = DATA.scenarios[sc];

    btn.disabled = !hasData;
    btn.style.opacity = hasData ? "1" : "0.4";
    btn.style.cursor = hasData ? "pointer" : "not-allowed";
    btn.className = state.view === "scenario" && state.scenario === sc ? "active" : "";
    btn.innerHTML = `<span class="mono">${sc.toUpperCase()}</span> &nbsp; <span style="color:var(--fg-dim)">${CATALOG[sc].name}</span>`;
    btn.title = CATALOG[sc].name;
    btn.onclick = () => navigate({ view: "scenario", scenario: sc, run: latestRun(sc), snapshot: null });
    nav.appendChild(btn);

    if (state.view === "scenario" && state.scenario === sc && hasData) {
      const runs = Object.keys(DATA.scenarios[sc].runs).sort();
      for (const r of runs) {
        const sub = document.createElement("button");
        sub.className = "sub" + (state.run === r ? " active" : "");
        sub.textContent = r;
        sub.onclick = () => navigate({ view: "scenario", scenario: sc, run: r, snapshot: null });
        nav.appendChild(sub);
      }
    }
  }
}

function latestRun(sc) {
  if (!DATA.scenarios[sc]) return null;
  const runs = Object.keys(DATA.scenarios[sc].runs).sort();
  return runs[runs.length - 1] || null;
}

// ── Navigation ───────────────────────────────────────────────────────────────
function navigate(next) {
  Object.assign(state, { scenario: null, run: null, snapshot: null }, next);
  setHash(state);
  render();
}
window.addEventListener("hashchange", () => {
  const next = parseHash();
  if (next.view === "scenario" && next.scenario && !next.run) next.run = latestRun(next.scenario);
  Object.assign(state, { scenario: null, run: null, snapshot: null }, next);
  render();
});

// ── Verdict helpers ──────────────────────────────────────────────────────────
//
// The vocabulary is a table, and every entry carries its own label, badge class
// and tooltip. Anything NOT in the table is rendered verbatim as UNRECOGNISED
// rather than collapsing into a default bucket: this page used to map every
// unknown verdict to the grey "na" badge, which is how a new verdict can be
// added to the checker and silently read as "no data" in the report.
const VERDICTS = {
  PRESERVED: { label: "PRESERVED", badge: "ok", counted: true,
    tip: "The invariant was evaluated against every snapshot of this run and held in all of them." },
  VIOLATED: { label: "VIOLATED", badge: "err", counted: true,
    tip: "The invariant failed in at least one snapshot. VIOLATED verdicts carry first_violation_ts and duration_s." },
  INSUFFICIENT_DATA: { label: "INSUF", badge: "warn", counted: false,
    tip: "The run carries no evidence either way — too few snapshots, or the fields the check reads were never collected. Excluded from the violation rate." },
  NOT_APPLICABLE: { label: "N/A", badge: "inapplicable", counted: false,
    tip: "This fault class cannot produce the state the invariant forbids, so the cell is a question that was never asked. Reported separately from PRESERVED, and excluded from the violation rate — counting it as preserved is what inflated the preserved column." },
  DETECTOR_INVALID: { label: "INVALID", badge: "info", counted: false,
    tip: "This invariant was already violated in the baseline snapshot, before any fault was injected — the detector is at fault, not the cluster. Excluded from the violation rate." },
  FAULT_INEFFECTIVE: { label: "NO FAULT", badge: "na", counted: false,
    tip: "The run's own efficacy assertion failed: the fault produced no observable change, so every verdict in the run describes an undisturbed cluster. The whole run is excluded from the violation rate." },
  NO_DATA: { label: "NO_DATA", badge: "na", counted: false,
    tip: "The scenario produced no invariant report — it was skipped, or it died mid-run." },
  PARSE_ERROR: { label: "ERROR", badge: "na", counted: false,
    tip: "The invariant report exists but could not be parsed." },
};
const VERDICT_ORDER = ["PRESERVED", "VIOLATED", "INSUFFICIENT_DATA", "NOT_APPLICABLE",
                       "DETECTOR_INVALID", "FAULT_INEFFECTIVE", "NO_DATA", "PARSE_ERROR"];

function verdictInfo(v) {
  return VERDICTS[v] || { label: v, badge: "unrecognised", counted: false, unknown: true,
    tip: "Verdict not known to this report template. Shown verbatim rather than folded into NO_DATA — update the VERDICTS table in scripts/report-template.html." };
}
function verdictLabel(v) { return verdictInfo(v).label; }

function verdictCell(v, extraTip) {
  v = v || "NO_DATA";
  const info = verdictInfo(v);
  const cls = info.unknown ? "UNRECOGNISED" : v;
  const tip = extraTip ? `${info.tip}\n\n${extraTip}` : info.tip;
  return `<td class="v-${cls}" title="${escapeHtml(tip)}">${escapeHtml(info.label)}</td>`;
}
function verdictBadge(v) {
  v = v || "NO_DATA";
  const info = verdictInfo(v);
  return `<span class="badge ${info.badge}" title="${escapeHtml(info.tip)}">${escapeHtml(info.label)}</span>`;
}

// The heatmap legend. Rendered from the same table as the cells, so a verdict
// can never appear in the grid without appearing here.
function verdictLegend() {
  return `<div class="legend">` +
    VERDICT_ORDER.filter(v => v !== "PARSE_ERROR")
      .map(v => `${verdictBadge(v)}`).join("") +
    `<span>Only ${verdictBadge("PRESERVED")} and ${verdictBadge("VIOLATED")} enter the violation rate.</span></div>`;
}

// ── Pull verdicts from a scenario's latest run ───────────────────────────────
function latestVerdicts(sc) {
  const data = DATA.scenarios[sc];
  if (!data) return null;
  const run = latestRun(sc);
  const ir = data.runs[run] && data.runs[run].invariant_report;
  if (!ir || !ir.invariants) return null;
  const out = {};
  for (const inv of ir.invariants) out[inv.invariant] = inv.verdict;
  return out;
}

// The "why" behind each NOT_APPLICABLE cell, so the heatmap tooltip can say
// which fault class ruled the invariant out and on what grounds.
function naReasons(sc) {
  const data = DATA.scenarios[sc];
  if (!data) return {};
  const run = latestRun(sc);
  const ir = data.runs[run] && data.runs[run].invariant_report;
  if (!ir || !ir.invariants) return {};
  const out = {};
  for (const inv of ir.invariants) {
    if (inv.verdict === "NOT_APPLICABLE" && inv.not_applicable) {
      out[inv.invariant] = `${inv.not_applicable.fault_class || "?"}: ${inv.not_applicable.reason || ""}`
        + (inv.measured_verdict ? `\n(measured verdict, kept for the record: ${inv.measured_verdict})` : "");
    }
  }
  return out;
}

// ── Overview view ────────────────────────────────────────────────────────────

  for (const sc of all) {
    const v = latestVerdicts(sc) || {};
    const why = naReasons(sc);
    const has = !!DATA.scenarios[sc];
    const labelCell = has
      ? `<td class="scenario"><a href="#/scenario/${sc}">${sc.toUpperCase()}</a> <span style="color:var(--fg-faint);font-weight:400">${escapeHtml(CATALOG[sc].name)}</span></td>`
      : `<td class="scenario" style="color:var(--fg-faint)">${sc.toUpperCase()} <span style="font-weight:400">${escapeHtml(CATALOG[sc].name)}</span></td>`;
    html += `<tr>${labelCell}`;
    for (const inv of INVARIANT_IDS) {
      html += verdictCell(v[inv], why[inv]);
    }
    html += `</tr>`;
  }
  html += `</tbody></table>`;

  if (DATA.aggregate) {
    html += `<h3>Aggregate report</h3>`;
    html += `<details class="snap-section" open><summary>aggregate_report.json</summary>
              <div class="body"><pre>${escapeHtml(JSON.stringify(DATA.aggregate, null, 2))}</pre></div>
             </details>`;
  } else {
    html += `<p class="empty">No aggregate_report.json yet — run all scenarios or run <code>scripts/aggregate-results.sh ${escapeHtml(DATA.results_path)}</code>.</p>`;
  }

  main.innerHTML = html;
}

// The two fields M4 attaches to every VIOLATED verdict. duration_s is null
// whenever the 1 Hz trace that a duration needs was not recorded — rendered as
// "not measured" with the checker's own reason, never as 0, because 0 would
// assert the violation had no extent.
function violationTiming(inv) {
  if (inv.verdict !== "VIOLATED") return "";
  const bits = [];
  if (inv.first_violation_ts) {
    bits.push(`first violation <b>${escapeHtml(String(inv.first_violation_ts))}</b>` +
      (inv.first_violation_snapshot ? ` (${escapeHtml(String(inv.first_violation_snapshot))})` : ""));
  } else if (inv.first_violation_ts_note) {
    bits.push(`first violation <b>&mdash;</b>`);
  }
  const d = inv.duration || {};
  if (inv.duration_s !== undefined && inv.duration_s !== null) {
    bits.push(`duration <b>${inv.duration_s}s</b>` +
      (d.is_lower_bound ? " (lower bound)" : "") +
      (d.censored ? " (censored)" : ""));
  } else if (inv.duration_s === null) {
    bits.push(`duration <b>not measured</b>`);
  }
  if (!bits.length) return "";
  const tip = [inv.first_violation_ts_note, d.reason, d.source && `source: ${d.source}`,
               d.covers && `covers: ${d.covers}`, d.not_covered && `not covered: ${d.not_covered}`]
              .filter(Boolean).join("\n");
  return `<span class="dur" title="${escapeHtml(tip)}">${bits.join(" &middot; ")}</span>`;
}

// A NOT_APPLICABLE verdict must say why, and must keep the verdict it would
// have had — otherwise "not applicable" is indistinguishable from a shrug.
function notApplicableWhy(inv) {
  if (inv.verdict !== "NOT_APPLICABLE" || !inv.not_applicable) return "";
  const na = inv.not_applicable;
  return `<div class="na-why">Not applicable to <code>${escapeHtml(na.fault_class || "?")}</code>: ` +
    `${escapeHtml(na.reason || "")}` +
    (inv.measured_verdict ? ` <span style="color:var(--fg-faint)">(measured verdict, kept for the record: ${escapeHtml(inv.measured_verdict)})</span>` : "") +
    `</div>`;
}

// ── Scenario view ────────────────────────────────────────────────────────────
function renderScenario() {
  const main = document.getElementById("main");
  const sc = state.scenario;
  const meta = CATALOG[sc] || { name: "(unknown scenario)", fault: "?", invariants: [] };
  const data = DATA.scenarios[sc];

  if (!data) {
    main.innerHTML = `<h2>${sc.toUpperCase()} — ${escapeHtml(meta.name)}</h2>
      <p class="empty">No results yet for ${sc.toUpperCase()}.</p>`;
    return;
  }

  const runs = Object.keys(data.runs).sort();
  if (!state.run || !data.runs[state.run]) state.run = runs[runs.length - 1];
  const run = data.runs[state.run];
  const snapLabels = Object.keys(run.snapshots);

  // Pick a default snapshot
  if (!state.snapshot || !run.snapshots[state.snapshot]) {
    state.snapshot = snapLabels[0] || null;
  }

  let html = `
    <div class="crumb"><a href="#/">Overview</a> <span>›</span> ${sc.toUpperCase()}</div>
    <h2>${sc.toUpperCase()} — ${escapeHtml(meta.name)}</h2>
    ${meta.summary ? `<div class="scenario-blurb">${escapeHtml(meta.summary)} <a href="#/reference/${sc}">full description →</a></div>` : ""}
    <div class="snap-meta">
      <b>Fault:</b> <span class="mono">${escapeHtml(meta.fault)}</span>
      <span class="sep">·</span>
      <b>Run:</b> <span class="mono">${escapeHtml(state.run)}</span>
      <span class="sep">·</span>
      <b>Snapshots:</b> ${snapLabels.length}
    </div>
  `;

  // ── Run selector
  if (runs.length > 1) {
    html += `<h3>Runs</h3><div class="timeline">`;
    for (const r of runs) {
      const active = r === state.run ? "active" : "";
      html += `<button class="${active}" onclick="navigate({view:'scenario',scenario:'${sc}',run:'${r}',snapshot:null})">${escapeHtml(r)}</button>`;
    }
    html += `</div>`;
  }

  // ── Invariant report
  html += `<h3>Invariant verdicts</h3>`;
  const ir = run.invariant_report;
  if (!ir) {
    html += `<p class="empty">No invariant_report.json for this run.</p>`;
  } else if (ir._parse_error) {
    html += `<p class="empty">Invariant report failed to parse: ${escapeHtml(ir._parse_error)}</p>`;
  } else {
    if (ir.summary) {
      // Every bucket the checker emits, each shown on its own. `evaluable` is
      // the only population a rate may be computed over.
      const su = ir.summary;
      const evaluable = su.evaluable !== undefined
        ? su.evaluable : (su.preserved || 0) + (su.violated || 0);
      html += `<div class="badges">
        <span class="badge ok">${su.preserved || 0} preserved</span>
        <span class="badge err">${su.violated || 0} violated</span>
        <span class="badge warn">${su.insufficient_data || 0} insufficient</span>
        <span class="badge inapplicable" title="Invariants this fault class cannot break. Excluded from the rate; not counted as preserved.">${su.not_applicable || 0} not applicable</span>
        <span class="badge info" title="Invariants already violated in the baseline snapshot — disqualified detectors, not findings.">${su.detector_invalid || 0} detector invalid</span>
        <span class="badge">evaluable: ${evaluable}</span>
        <span class="badge">snapshots: ${ir.snapshots_evaluated || 0}</span>
      </div>`;
      if (ir.fault_class) {
        html += `<div class="kv"><div class="k">Fault class</div><div class="v">
          <code>${escapeHtml(ir.fault_class)}</code>
          <span style="color:var(--fg-faint)">(${escapeHtml(ir.fault_class_source || "unknown source")})</span>
        </div></div>`;
      }
      if (ir.run_validity && ir.run_validity !== "OK") {
        html += `<div class="badges"><span class="badge na" title="The run's own efficacy assertion failed — the fault produced no observable change, so these verdicts describe an undisturbed cluster.">run validity: ${escapeHtml(ir.run_validity)}</span></div>`;
      }
    }
    if (ir.divergence_timing) {
      const t = ir.divergence_timing;
      html += `<div class="kv">
        <div class="k">First fault snapshot</div><div class="v">${escapeHtml(String(t.first_fault_snapshot || "—"))}</div>
        <div class="k">First service failure</div><div class="v">${escapeHtml(String(t.first_service_failure_snapshot || "—"))}</div>
      </div>`;
    }
    for (const inv of (ir.invariants || [])) {
      const def = INVARIANTS[inv.invariant];
      html += `<div class="invariant-row">
        <div class="head">
          <div class="id"><a href="#/reference/${inv.invariant}" title="See full definition">${escapeHtml(inv.invariant)}</a></div>
          <div class="name">${escapeHtml(def ? def.name.toLowerCase() : (inv.name || ""))}</div>
          <div class="grow"></div>
          ${verdictBadge(inv.verdict)}
          ${violationTiming(inv)}
        </div>
        ${def ? `<div class="desc">${escapeHtml(def.description)}</div>` : ""}
        ${notApplicableWhy(inv)}`;
      if ((inv.violations && inv.violations.length) || inv.note) {
        html += `<pre>${escapeHtml(JSON.stringify({
          violation_count: inv.violation_count,
          first_violation_snapshot: inv.first_violation_snapshot,
          first_violation_ts: inv.first_violation_ts,
          duration_s: inv.duration_s,
          duration: inv.duration,
          measured_verdict: inv.measured_verdict,
          not_applicable: inv.not_applicable,
          violations: inv.violations,
          note: inv.note,
          distinct_holders: inv.distinct_holders,
          holder_sequence: inv.holder_sequence,
          post_fault_snapshots: inv.post_fault_snapshots,
        }, (k,v) => v === undefined ? undefined : v, 2))}</pre>`;
      }
      html += `</div>`;
    }
  }

  // ── Snapshot timeline
  html += `<h3>Snapshots</h3>`;
  if (!snapLabels.length) {
    html += `<p class="empty">No snapshots recorded.</p>`;
  } else {
    const ordered = orderSnapLabels(snapLabels);
    html += `<div class="timeline">`;
    let lastPhase = null;
    for (const l of ordered) {
      const phase = PHASE_OF(l);
      if (phase !== lastPhase) {
        html += `<span class="phase">${phase}</span>`;
        lastPhase = phase;
      }
      const active = l === state.snapshot ? "active" : "";
      html += `<button class="${active}" onclick="navigate({view:'scenario',scenario:'${sc}',run:'${state.run}',snapshot:'${l}'})">${escapeHtml(l)}</button>`;
    }
    html += `</div>`;

    if (state.snapshot && run.snapshots[state.snapshot]) {
      html += renderSnapshot(run.snapshots[state.snapshot]);
    }
  }

  main.innerHTML = html;
}

function orderSnapLabels(labels) {
  const phaseOrder = { pre: 0, during: 1, post: 2, "?": 3 };
  return [...labels].sort((a, b) => {
    const pa = phaseOrder[PHASE_OF(a)], pb = phaseOrder[PHASE_OF(b)];
    if (pa !== pb) return pa - pb;
    // Try to sort by trailing number when present (t_plus_30 < t_plus_60).
    const na = (a.match(/(\d+)$/) || [])[1];
    const nb = (b.match(/(\d+)$/) || [])[1];
    if (na && nb) return Number(na) - Number(nb);
    return a.localeCompare(b);
  });
}

// ── Snapshot detail ──────────────────────────────────────────────────────────
function renderSnapshot(snap) {
  let html = `<div class="snap-meta">
    <b>Label:</b> <span class="mono">${escapeHtml(snap.snapshot_label || "?")}</span>
    <span class="sep">·</span>
    <b>Timestamp:</b> <span class="mono">${escapeHtml(snap.timestamp || "?")}</span>
    <span class="sep">·</span>
    <b>etcd revision:</b> <span class="mono">${escapeHtml(String(snap.etcd && snap.etcd.current_revision))}</span>
  </div>`;

  const sections = [
    ["External probe", snap.external_probe],
    ["Controller-manager lease", snap.control_plane && snap.control_plane.controller_manager_lease],
    ["Scheduler lease", snap.control_plane && snap.control_plane.scheduler_lease],
    ["Node conditions", snap.control_plane && snap.control_plane.node_conditions],
    ["Pod states", snap.control_plane && snap.control_plane.pod_states],
    ["Endpoint states", snap.control_plane && snap.control_plane.endpoint_states],
    ["Warning events", snap.control_plane && snap.control_plane.warning_events],
    ["etcd member status", snap.etcd && snap.etcd.member_status],
    ["Per-node observations", snap.nodes],
  ];

  for (const [title, value] of sections) {
    if (value == null) continue;
    const isEmpty = Array.isArray(value) ? value.length === 0
                   : typeof value === "object" ? Object.keys(value).length === 0 : false;
    const summary = isEmpty
      ? `${escapeHtml(title)} <span style="color:var(--fg-faint);font-weight:400">(empty)</span>`
      : escapeHtml(title);
    html += `<details class="snap-section"><summary>${summary}</summary>
      <div class="body"><pre>${escapeHtml(JSON.stringify(value, null, 2))}</pre></div>
    </details>`;
  }

  html += `<details class="snap-section"><summary>Raw snapshot JSON</summary>
    <div class="body"><pre>${escapeHtml(JSON.stringify(snap, null, 2))}</pre></div>
  </details>`;

  return html;
}

// ── Util ─────────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function renderReference() {
  const main = document.getElementById("main");
  let html = `
    <h2>Reference</h2>
    <div class="crumb">What each scenario does and what each invariant means. Click a card header to collapse it; cross-links and the toggles in the toolbar work as expected.</div>

    <div class="ref-toolbar">
      <button onclick="refToggleAll(true)">Expand all</button>
      <button onclick="refToggleAll(false)">Collapse all</button>
    </div>

    <h3 id="invariants">Invariants (paper §4)</h3>
    <p class="ref-intro">The five invariants below are evaluated against each snapshot of a scenario run. A scenario's verdict is the conjunction across all its snapshots: <span class="badge ok">PRESERVED</span> if the invariant held in every snapshot, <span class="badge err">VIOLATED</span> if it failed in at least one.</p>
    <p class="ref-intro">Four further verdicts exist so that "held" is not asked to carry work it cannot do. <span class="badge warn">INSUFFICIENT_DATA</span> — the run carries no evidence either way (too few snapshots, or the fields the check reads were never collected). <span class="badge inapplicable">N/A</span> — this fault class cannot produce the state the invariant forbids, so the cell is a question that was never asked; these used to be reported PRESERVED, which inflated the preserved column. <span class="badge info">INVALID</span> — the invariant was already violated in the baseline snapshot, so the detector failed its calibration and the verdict describes the detector, not the cluster. <span class="badge na">NO FAULT</span> — the run's own efficacy assertion failed, so every verdict in it describes an undisturbed cluster. Only PRESERVED and VIOLATED enter the violation rate; the other four are counted and published separately.</p>
    <p class="ref-intro">Every VIOLATED verdict carries <code>first_violation_ts</code> (the timestamp of the first snapshot the violation was observed in) and <code>duration_s</code>. <code>duration_s</code> is measured on the 1 Hz observer trace, on its monotonic <code>t_rel_ms</code> axis, with the same censoring rules the observer-disagreement analysis uses: an episode still open when a truncated trace ends is excluded and reported as censored, one still open at the end of a complete trace is counted as a lower bound. Where no trace was recorded — every run archived before the trace existed — <code>duration_s</code> is <code>null</code> with a reason, never <code>0</code>.</p>
  `;
  for (const [iid, inv] of Object.entries(INVARIANTS)) {
    const isExtension = inv.origin === "extension";
    const usedBy = isExtension
      ? `<span title="Extension invariants are evaluated against every scenario that has snapshot data">all scenarios with snapshot data</span>`

          .filter(([_, sc]) => sc.invariants.includes(iid))

          .join(", ");
    const originBadge = isExtension
      ? `<span class="badge ext-badge" title="Not in the paper's original I1–I5; added by scripts/check-invariants.sh">EXTENSION</span>`
      : `<span class="badge paper-badge" title="Original invariant from the paper §4">PAPER</span>`;
    html += `<details class="ref-card" id="ref-${iid}" open>
      <summary class="ref-head">
        <span class="id">${iid}</span>
        <span class="name">${escapeHtml(inv.name)}</span>
        <div class="grow"></div>
        ${originBadge}
      </summary>
      <div class="ref-body">
        <p>${escapeHtml(inv.description)}</p>
        <div class="kv">
          <div class="k">Violation criterion</div><div class="v plain">${escapeHtml(inv.violation)}</div>
          <div class="k">Evaluated by scenarios</div><div class="v plain">${usedBy || "—"}</div>
        </div>
      </div>
    </details>`;
  }

  html += `<h3 id="scenarios">Scenarios</h3>`;
  for (const [sid, sc] of Object.entries(CATALOG)) {
    const hasData = !!DATA.scenarios[sid];
    const dataLink = hasData
      ? ` &nbsp; <a href="#/scenario/${sid}" style="font-size:11px" onclick="event.stopPropagation()">view results →</a>`
      : ` &nbsp; <span class="badge na" style="font-size:10px">no data</span>`;
    const invLinks = sc.invariants.map(i => `<a href="#/reference/${i}" onclick="event.stopPropagation()">${i}</a>`).join(", ");
    const recapLabel = hasData ? "Observed" : "Hypothesised";
    const recapClass = hasData ? "recap observed" : "recap hypothesised";
    html += `<details class="ref-card" id="ref-${sid}" open>
      <summary class="ref-head">

        ${dataLink}
      </summary>
      <div class="ref-body">
        <p><b>${escapeHtml(sc.summary)}</b></p>
        <p>${escapeHtml(sc.description)}</p>
        ${sc.recap ? `<div class="${recapClass}"><span class="recap-label">${recapLabel}</span> ${escapeHtml(sc.recap)}</div>` : ""}
        <div class="kv">
          <div class="k">Fault type</div><div class="v">${escapeHtml(sc.fault)}</div>

  main.innerHTML = html;

    if (target) {
      if (target.tagName === "DETAILS") target.open = true;
      target.scrollIntoView({ behavior: "auto", block: "start" });
    }
  }
}

// ── Findings: total recap of observed behaviour ─────────────────────────────
// Generated from the May 20 2026 sweep, 12/14 scenarios, 82 invariant verdicts.
// Cross-references invariants and scenarios so links into the Reference and

function renderFindings() {
  const main = document.getElementById("main");
  const I = id => `<a href="#/reference/${id}">${id}</a>`;
  const S = id => `<a href="#/reference/${id}">${id.toUpperCase()}</a>`;
  const sdata = id => `<a href="#/scenario/${id}">${id.toUpperCase()}</a>`;
  let html = `
    <h2>Findings — observed behaviour, May 20 sweep</h2>

      <code>Ready=Unknown</code>, and probed the service from a vantage point
      with no route to it. The I2, I5 and I6 columns of that sweep are

    </div>

    <h3 id="finding-sweep">What we measured against</h3>
    <p>Substrate: 3 dedicated etcd members, 3 control-plane nodes behind a keepalived VIP, 3 workers running <code>nginx-stateless</code> (3 replicas) and <code>postgres-stateful</code> (1 replica), all on a single /24 with Calico CNI. Observer is a macOS laptop running ansible-playbook against the cluster over SSH.</p>
    <p>Sweep coverage — 12 of 14 paper scenarios with full snapshot sets and invariant reports:</p>
    <table class="findings-coverage">
      <thead><tr><th>Scenario</th><th>Description</th><th>Snapshots</th></tr></thead>
      <tbody>
        <tr><td>${sdata("s1")}</td><td>symmetric control-plane partition</td><td>7</td></tr>
        <tr><td>${sdata("s2")}</td><td>asymmetric worker isolation</td><td>8</td></tr>
        <tr><td>${sdata("s3")}</td><td>etcd write-latency degradation</td><td>7</td></tr>
        <tr><td>${sdata("s4")}</td><td>clock skew on cp1</td><td>6</td></tr>
        <tr><td>${sdata("s8")}</td><td>partition + storage lag (composed)</td><td>7</td></tr>
        <tr><td>${sdata("s11")}</td><td>kubelet partition / pod lifecycle</td><td>7</td></tr>
        <tr><td>${sdata("s12")}</td><td>leader election storm</td><td>7</td></tr>
        <tr><td>${sdata("s14")}</td><td>stale informer cache</td><td>5</td></tr>
        <tr><td>${sdata("s15")}</td><td>graceful termination race</td><td>4</td></tr>
        <tr><td>${sdata("s17")}</td><td>etcd compaction + watch history gap</td><td>6</td></tr>
        <tr><td>${sdata("s18")}</td><td>node pressure eviction race</td><td>7</td></tr>
        <tr><td>${sdata("s19")}</td><td>split etcd quorum</td><td>5</td></tr>
      </tbody>
    </table>
    <p class="muted">${S("s5")} (all-CP API blackhole) and ${S("s6")} (5-iteration repeat) were excluded for runtime/burst-budget reasons.</p>

    <h3 id="finding-invariants">Per-invariant findings</h3>

    <div class="finding-inv" id="finding-I1">
      <div class="finding-inv-head"><span class="id">${I("I1")}</span><span class="name">Exclusive authority</span><span class="badge ok">PRESERVED · 12/12</span></div>
      <p><b>What we measured.</b> Every snapshot in every scenario had exactly one <code>controller-manager</code> and <code>scheduler</code> <code>holderIdentity</code>; no duplicate StatefulSet pod identities ever appeared on two nodes at once. Strongest data point: ${sdata("s12")} (election storm) — flap-induced re-elections at sub-second cadence produced 0 ms measurable overlap within the 500 ms polling resolution. ${sdata("s18")} (eviction race) also held — kubelet's eviction and the scheduler's replacement coordinate via the eviction status update, contradicting the "two control loops race observer-blind" hypothesis. ${sdata("s4")} (clock skew) held too: locally-evaluated <code>leaseDurationSeconds</code> did not produce dual-authority windows.</p>

      <p><b>Production translation — three concrete shapes:</b></p>
      <ol>
        <li><b>One-way network change on a worker.</b> kubelet still heartbeats (the other direction works). Control plane keeps the pod in <code>Endpoints</code>. <code>curl</code> hits it and times out. This is ${sdata("s2")}; the 8-of-8 violation rate says it happens in <em>every</em> fault-window snapshot, not as a rare race.</li>
        <li><b>Rolling deployment.</b> New pod added to <code>Endpoints</code> before readiness, OR old pod stays in <code>Endpoints</code> after SIGTERM. Both are ${sdata("s15")}. Default <code>terminationGracePeriodSeconds: 30</code> is longer than endpoint propagation; the gap is observable.</li>
        <li><b>etcd slow.</b> During ${sdata("s3")} (800 ms ± 200 ms write latency), <code>EndpointSlice</code> updates lagged actual workload state for the entire fault window.</li>
      </ol>
      <p><b>What this means for your services.</b> Do not trust <code>Endpoints</code>/<code>EndpointSlice</code> as a synonym for "this backend will answer now." Use a client-side load balancer with circuit-breaking (Envoy, gRPC pick-first with health) or add <code>lifecycle.preStop.exec.command: ["sleep","10"]</code> to give the endpoints controller time to remove the pod before the container stops serving.</p>
    </div>

    <div class="finding-inv" id="finding-I3">
      <div class="finding-inv-head"><span class="id">${I("I3")}</span><span class="name">Failure declaration consistency</span><span class="badge ok">PRESERVED · 12/12</span></div>
      <p><b>What we measured.</b> When the API said a node was <code>NotReady</code>, the node's own crictl view agreed: pods were stopped or stopping. The framework's I3 check (<code>NotReady-in-API AND CONTAINER_RUNNING-locally</code>) never fired.</p>
      <p><b>This is partly a framework limitation, not a positive result.</b> ${sdata("s11")} was designed to expose I3 — partition the kubelet from the API server with workloads running. PRESERVED because the kubelet's own readiness propagation stops the pods (via the runtime) before crictl can record divergent state. To force a measurable I3 violation you'd need a workload that survives the kubelet's shutdown signal, or a longer fault window past the runtime's container-stop grace.</p>
      <p><b>Production translation.</b> A node reported <code>NotReady</code> by <code>kubectl get nodes</code> really is stopping its workloads — you do not have a node lying about its containers. But eviction takes minutes; if you hand work to nodes by name, the work in flight on a NotReady node may still complete and write to your database. Idempotency at the workload layer matters; <code>NotReady</code> is not "the workload is gone."</p>
    </div>

    <div class="finding-inv" id="finding-I4">
      <div class="finding-inv-head"><span class="id">${I("I4")}</span><span class="name">Recovery coherence</span><span class="badge warn">INSUFFICIENT_DATA · 12/12</span></div>
      <p><b>What we measured.</b> Nothing. I4 is cross-run by construction — it asks whether independent repetitions of the same fault converge to the same post-fault state — so single-run scenarios correctly return INSUFFICIENT_DATA. Only ${S("s6")} (5-iteration repeat) could evaluate it, and ${S("s6")} was excluded from this sweep.</p>
      <p><b>Outstanding work.</b> Running ${S("s6")} will populate <code>aggregate_report.json</code>'s <code>recovery_variance_s6</code> block. Until then, recovery determinism is hypothesis, not measurement.</p>
    </div>

    <div class="finding-inv" id="finding-I5">
      <div class="finding-inv-head"><span class="id">${I("I5")}</span><span class="name">Observation-action consistency</span><span class="badge err">VIOLATED · 11/12</span></div>
      <p><b>What we measured.</b> In 11 scenarios the etcd revision advanced by &gt;500 between consecutive snapshots without a matching change in pod state or lease holder — the framework's signature for "controllers reconciling against state the cluster cannot commit against." Violation rate was 7 of 7 fault-window snapshots in ${sdata("s2")}, ${sdata("s3")}, ${sdata("s11")}, ${sdata("s12")}, ${sdata("s18")}; 8 of 8 in ${sdata("s2")}; 6 of 6 in ${sdata("s17")}. ${sdata("s1")} was the only scenario where I5 was relatively quiet (only 4 violations).</p>
      <p><b>Production translation — the "Kubernetes is loud during outages" symptom:</b></p>
      <ol>
        <li>The etcd revision keeps climbing — every controller retries (kube-controller-manager, scheduler, your custom operator).</li>
        <li>The cluster's <em>actual</em> state does not change — the workload is partitioned/slow, nothing moves.</li>
        <li>Your monitoring on apiserver request rate spikes 10–100× on the affected resource while nothing operational improves.</li>
      </ol>
      <p>This is what "kubectl is slow during the outage" really is — not a broken apiserver but a 100×-loaded one, against the same objects. ${sdata("s3")} measured this directly: 7 of 7 violations for the full fault window. Mitigation for custom controllers: backoff with jitter and circuit-break on repeated retry.</p>
    </div>

    <div class="finding-inv" id="finding-I6">
      <div class="finding-inv-head"><span class="id">${I("I6")}</span><span class="name">Watch progress monotonicity</span><span class="badge err">VIOLATED · 12/12 · <em>extension</em></span></div>
      <p><b>What we measured.</b> In every scenario the observed etcd revision <em>decreased</em> between at least one pair of consecutive snapshots — 3 times in S1/S2/S3/S4/S8/S11, 2 in S12/S18/S19, once in S14/S15/S17. The paper's original ${I("I5")} catches forward revision delta (reconciliation amplification). I6 catches the inverse — backward movement — which signals a watch reset, a stale read from a minority etcd member, or a relist after compaction.</p>
      <p><b>This is the most paper-relevant finding the original I1–I5 frame did not capture.</b> Across 12 scenarios with 12 different fault mechanisms, every single one produced at least one snapshot where the cluster's observed revision regressed. Mechanism varies (apiserver caches at different revisions in S3/S14; relist after partition in S1/S17; minority-etcd stale read in S19) but the observable is the same: <em>watch revisions are not monotonic from any single observer's perspective</em>.</p>
      <p><b>Production translation — "informer caches reporting different things on different controllers" during incidents:</b></p>
      <ol>
        <li>Two controllers — say <code>kube-controller-manager</code> on cp2 and <code>cert-manager</code> on a worker — both watch the same Deployment.</li>
        <li>A network blip resets one watch and forces a relist. For ~100 ms to a few seconds, the two controllers have different views (3 replicas vs 5). Each takes actions consistent with its view.</li>
        <li><code>kubectl get deployment</code> from your laptop returns yet a third value because your request hits a third apiserver with a cache at yet another revision.</li>
      </ol>
      <p>Observable in production via <code>apiserver_watch_events_sizes</code> drift between apiserver instances. Mitigation: design controllers to be idempotent across watch resets (recommended), or leader-elect cluster-scoped controllers to observe via one apiserver.</p>
    </div>

    <div class="finding-inv" id="finding-I9">
      <div class="finding-inv-head"><span class="id">${I("I9")}</span><span class="name">Quorum continuity</span><span class="badge ok">PRESERVED · 12/12 · <em>extension</em></span></div>
      <p><b>What we measured.</b> Across every snapshot of every scenario, all 3 etcd members responded to <code>endpoint status</code>. Substrate kept majority throughout, even during ${sdata("s19")} (which <em>splits</em> etcd into majority/minority — the majority side stayed available).</p>
      <p><b>This is the silent positive result that makes everything else meaningful.</b> Without I9, the paper's argument would be ambiguous: when I1 holds, is it because Kubernetes' exclusivity guarantee works, or because etcd lost quorum and stopped accepting writes? With I9 in hand, every other verdict in this sweep is an <em>observable-layer</em> failure, not a substrate failure. The cluster's authoritative state was always coherent; what's incoherent is each observer's view of it.</p>
      <p><b>Production translation.</b> etcd is stable in practice. Famous "etcd lost quorum" outages are real but rare; they need catastrophic events (datacenter loss, disk full, OOM-killed etcd). Day-to-day faults — pod evictions, node reboots, network blips — keep quorum intact. <strong>Monitor etcd quorum (<code>etcd_server_has_leader</code>, <code>etcd_server_is_leader</code>, <code>etcd_network_peer_round_trip_time_seconds</code>) as a primary alert; treat I2/I5/I6 violations as expected during transient faults, not as emergencies.</strong></p>
    </div>

    <div class="finding-inv" id="finding-I10">
      <div class="finding-inv-head"><span class="id">${I("I10")}</span><span class="name">Reconciliation termination</span><span class="badge ok">PRESERVED · 9/12 · <em>extension</em></span></div>
      <p><b>What we measured.</b> In 9 scenarios, between the first and last post-fault snapshots, no <em>new</em> <code>(involvedObject.name, reason)</code> Warning pairs appeared — the cluster stopped emitting fresh complaints about the affected workload within the observation window. ${sdata("s15")} was the lone violation: warnings about the terminating pod's endpoint membership kept appearing throughout the 60 s tail, never settling. ${sdata("s17")} and ${sdata("s19")} tails were too short to evaluate cleanly (INSUFFICIENT_DATA).</p>
      <p><b>Production translation.</b> Cluster faults usually self-resolve. The cluster grumbles for a while (counts of <code>BackOff</code>, <code>Unhealthy</code>, <code>FailedScheduling</code> climb), then the same set of complaints stops coming. "Warning events stopped appearing about object X" is a reasonable proxy for "the cluster has accepted the new state."</p>
      <p><b>${sdata("s15")} is the cautionary case.</b> Default-graceful termination never quite settles within a 60 s observation window. Production analogue: you delete a pod, and for ~30–60 seconds after the pod is gone you still see endpoint-controller warnings about it. Mitigation: longer <code>preStop</code> hooks, shorter <code>terminationGracePeriodSeconds</code>, or accept that termination is observably noisy and tune alerts accordingly.</p>
    </div>

    <h3 id="finding-synthesis">Cross-scenario synthesis</h3>
    <p>Sorting invariants by violation rate produces a clean ranking that maps directly to a single paper-level claim:</p>
    <table class="findings-synth">
      <thead><tr><th>Invariant</th><th>Layer</th><th>Violated</th><th>Verdict</th></tr></thead>
      <tbody>
        <tr><td>${I("I1")} authority</td><td>structural</td><td>0/12</td><td>Kubernetes' exclusivity guarantee is real</td></tr>
        <tr><td>${I("I3")} failure declaration</td><td>structural</td><td>0/12</td><td>Declaration-vs-reality agreement holds</td></tr>
        <tr><td>${I("I9")} quorum</td><td>substrate</td><td>0/12</td><td>etcd consensus is stable</td></tr>
        <tr><td>${I("I10")} termination</td><td>observer</td><td>1/12</td><td>Reconciliation usually converges</td></tr>
        <tr><td>${I("I4")} recovery coherence</td><td>cross-run</td><td>INSUF</td><td>Not yet measured</td></tr>
        <tr><td>${I("I2")} reachability publication</td><td>observer</td><td>11/12</td><td><strong>Reachability is observer-relative</strong></td></tr>
        <tr><td>${I("I5")} observation-action</td><td>observer</td><td>11/12</td><td><strong>Controllers act on stale views</strong></td></tr>
        <tr><td>${I("I6")} watch monotonicity</td><td>observer</td><td>12/12</td><td><strong>Cluster state is non-monotonic per observer</strong></td></tr>
      </tbody>
    </table>
    <p><b>The paper's central claim is empirically airtight:</b> the structural and substrate invariants (I1, I3, I9) hold robustly, while the observer-relative invariants (I2, I5, I6) fail under every interesting fault. The cluster's authoritative state is coherent; what's incoherent is each observer's view of it.</p>

    <h3 id="finding-production">A typical production incident through this frame</h3>
    <div class="incident">
      <div class="incident-event"><strong>17:32</strong> — an L4 load balancer in front of <code>payments-api</code> Service starts logging 504s at ~3% rate. Customer reports come in. Latency p99 is unchanged. PagerDuty fires.</div>
      <p><strong>What our measurements say is happening:</strong></p>
      <ol>
        <li><b>The 504 rate is real.</b> ${I("I2")} is violated somewhere — almost certainly a rolling deployment, a node draining, or an unhealthy pod that hasn't yet been removed from the endpoint subset. ${sdata("s15")} says this is the cluster's <em>default</em> behaviour, not a malfunction.</li>
        <li><b>Dashboards disagree.</b> Grafana panels pulled from different apiserver instances — or cached views like <code>kubectl</code> vs the Watch API — show different <code>Endpoints</code> membership. ${I("I6")} says this is expected: watch progress is non-monotonic across observers.</li>
        <li><b>Your custom operator is retrying.</b> <code>apiserver_request_total{verb="patch",resource="services"}</code> spikes 10× on the affected Service. ${I("I5")} says this is the framework: the operator reconciles against publication state; publication state is briefly wrong; the operator keeps retrying. Retries do not move the cluster — they are amplification.</li>
        <li><b>etcd is <em>fine</em>.</b> <code>etcd_server_has_leader=1</code>, proposals committed climbing normally, peer RTT normal. ${I("I9")} says the substrate is healthy. Do not chase etcd; the problem is in the publication layer.</li>
        <li><b><code>kubectl get nodes</code> is normal.</b> All 6 nodes Ready. ${I("I3")} says: the cluster's view of node health and reality agree. The unhealthy pod is on a healthy node; it's just not yet removed from the endpoint subset.</li>
      </ol>
      <p class="do"><strong>What you actually do:</strong></p>
      <ul class="do-list">
        <li>Don't restart the apiserver or etcd. ${I("I9")} + ${I("I3")} say they're fine.</li>
        <li>Don't restart the operator. ${I("I5")} says it'll just resume amplifying — let the watch settle.</li>
        <li>Wait 60–120 seconds. ${I("I10")} (PRESERVED in 9 of 12) says the cluster will stop emitting fresh warnings within this window.</li>
        <li>Add a <code>preStop: sleep 10</code> to the deployment template before next deploy. ${I("I2")} is observer-relative; you can shrink the unsafe window, not eliminate it.</li>
        <li>Check that your client library has circuit-breaking. If your downstream services have Envoy outlier detection, the L4 504 rate stops translating into application errors at all.</li>
      </ul>
      <p class="dont"><strong>What you should NOT do:</strong></p>
      <ul class="dont-list">
        <li>Bump replicas to 10 — the 3-pod endpoint update is the bottleneck, not capacity.</li>
        <li>Page the cluster team — ${I("I9")} says they have no etcd issue to debug.</li>
        <li>Investigate kube-controller-manager logs — ${I("I5")} says it's doing exactly what it should, just loudly.</li>
      </ul>
    </div>

    <h3 id="finding-caveats">Caveats</h3>
    <ol class="caveats">
      <li><b>${S("s5")} and ${S("s6")} unmeasured.</b> ${I("I4")} has no verdict yet. Multi-controller amplification under simultaneous-blackhole conditions also unmeasured.</li>
      <li><b>${sdata("s11")}'s ${I("I3")}=PRESERVED is a framework limitation, not a positive result.</b> The canonical "API says NotReady, node says Running" demonstration didn't fire because the kubelet stops pods via readiness propagation before crictl can capture divergent state.</li>
      <li><b>${sdata("s8")}'s "composition is sub-linear" finding</b> is at the fault intensity used here. Stronger composition (S3-grade latency + S19-grade quorum split) might produce non-linear effects we didn't see.</li>
      <li><b>Observer reach is limited.</b> Mid-fault snapshots have null cp-side fields because the apiserver VIP is unreachable from the isolated side of a partition. Consistent with the paper's thesis (you cannot observe what you cannot reach) but the dataset has known holes during peak fault.</li>
      <li><b>All measurements are from a 6-node cluster with 3 etcd members.</b> Production clusters with 5+ etcd, regional spread, or different CNI/runtime choices will move quantitative results — but the directional ones (I2/I5/I6 violated; I1/I3/I9 preserved) should be robust.</li>
    </ol>
  `;
  main.innerHTML = html;

  // Scroll to anchor if present (e.g. /#/findings/invariants).
  if (state.anchor) {
    const target = document.getElementById("finding-" + state.anchor);
    if (target) target.scrollIntoView({ behavior: "auto", block: "start" });
  }
}

function refToggleAll(open) {
  for (const d of document.querySelectorAll("main details.ref-card")) {
    d.open = open;
  }
}

function render() {
  renderHeader();
  renderNav();
  if (state.view === "scenario" && state.scenario) renderScenario();
  else if (state.view === "reference") renderReference();
  else if (state.view === "findings") renderFindings();
  else renderOverview();
}

// ── Boot ─────────────────────────────────────────────────────────────────────
if (!DATA) {
  document.getElementById("main").innerHTML = "<p class='empty'>No data embedded. Re-run scripts/build-report.sh.</p>";
} else {
  const initial = parseHash();
  if (initial.view === "scenario" && initial.scenario && !initial.run) {
    initial.run = latestRun(initial.scenario);
  }
  Object.assign(state, initial);
  render();
}
window.navigate = navigate;
</script>
