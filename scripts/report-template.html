       whichever run happened to be last (D42). ${sdata("s12")} and
       ${sdata("s20")} are labelled <code>INEFFECTIVE</code> here on genuine
       splits — ${sdata("s20")} was 3 effective of 5, and ${sdata("s12")} landed
       its fault only in the repetition where the isolated node actually held the
       controller-manager lease. Read those two per-run, not per-batch.
       ${sdata("s18")} is the honest case: ineffective in every repetition.</p>

    <h3 id="finding-invariants">Per-invariant findings</h3>

    <div class="finding-inv" id="finding-I1">
      <div class="finding-inv-head"><span class="id">${I("I1")}</span><span class="name">Exclusive authority</span>${bar("I1")}</div>
      <p><b>What we measured.</b> Exactly one <code>controller-manager</code> and
         <code>scheduler</code> <code>holderIdentity</code> in every snapshot of
         every scenario but one. The exception is decisive:
         ${list(ST.I1.viol)} violates I1 in <b>5 of 5 repetitions</b>
         (<code>violation_frequency: 1</code>) — asymmetric worker isolation
         produces unfenced concurrent writes, with two distinct writer UIDs
         alternating over ~600 records against the same object. This is not a
         race won occasionally; it reproduces every time.</p>
      <p><b>Why this matters.</b> The earlier single-run sweep reported I1
         PRESERVED everywhere and concluded that "the Lease API's
         <code>holderIdentity</code> is an honest exclusivity signal". That
         conclusion was an artifact of not repeating the experiment. Leader
         election is not the only authority path: a partitioned writer that never
         loses its lease is still fenced by nothing.</p>
      <p><b>Caveat.</b> I1 is structural — it says no two simultaneous holders.
         It says nothing about whether the holder is acting on a stale view; that
         is ${I("I5")}. And in ${sdata("s22")}/${sdata("s26")} its PRESERVED is
         detector blinding, not a check (D40).</p>
    </div>

    <div class="finding-inv" id="finding-I2">
      <div class="finding-inv-head"><span class="id">${I("I2")}</span><span class="name">Reachability publication</span>${bar("I2")}</div>
      <p><b>What we measured.</b> The <code>Endpoints</code> object kept
         publishing pod IPs while probes could not reach them, in
         ${ST.I2.viol.length} of ${ST.I2.total} scenarios: ${list(ST.I2.viol)}.
         This is the most frequently violated invariant in the sweep and the
         empirical core of the observer-relativity claim.</p>
      <p><b>Duration is the interesting variable, and it spans two orders of
         magnitude.</b> Measured outage windows: ${sdata("s20")} 7–12 s,
         ${sdata("s5")} 27–30 s, ${sdata("s1")} 48 s, ${sdata("s3")} 50 s,
         ${sdata("s4")} 55–93 s, ${sdata("s17")} 57–82 s, ${sdata("s2")}
         111–117 s, ${sdata("s6")} 160–176 s, ${sdata("s19")} 186 s,
         ${sdata("s11")} 240–247 s, ${sdata("s8")} 255–261 s. The tight
         within-scenario spread (${sdata("s11")}: 240, 240, 242, 244, 247 s)
         against the wide across-scenario spread says the duration is a property
         of the fault class, not of chance — which is what makes it quotable.</p>
      <p><b>Production translation.</b> Do not treat
         <code>Endpoints</code>/<code>EndpointSlice</code> as a synonym for "this
         backend will answer now". Use client-side load balancing with
         circuit-breaking (Envoy outlier detection, gRPC health), and add a
         <code>preStop</code> sleep so the endpoints controller can remove the pod
         before the container stops serving. You can shrink the unsafe window;
         these numbers say you cannot close it.</p>
    </div>

    <div class="finding-inv" id="finding-I3">
      <div class="finding-inv-head"><span class="id">${I("I3")}</span><span class="name">Failure declaration consistency</span>${bar("I3")}</div>
      <p><b>What we measured.</b> The API declared a node failed or uncertain
         while that node's own crictl view showed containers still running, in
         ${ST.I3.viol.length} of ${ST.I3.total} scenarios: ${list(ST.I3.viol)}.</p>
      <p><b>This reverses the earlier result, and the reversal is the point.</b>
         The single-run sweep reported I3 PRESERVED in 12 of 12 and explained it
         away as a framework limitation. The explanation was wrong: the detector
         could not represent <code>Ready=Unknown</code> (D2/D3), so the most
         common declaration state in a partition was invisible to it. With that
         fixed, I3 is violated about as often as I2 — the canonical "API says
         NotReady, node says Running" divergence is not rare, it was unmeasurable.</p>
      <p><b>Production translation.</b> A node reported <code>NotReady</code> is
         <em>not</em> a node whose workloads have stopped. Work in flight can
         still complete and still write to your database, for minutes. Idempotency
         at the workload layer is the mitigation; <code>NotReady</code> is not
         "the workload is gone".</p>
    </div>

    <div class="finding-inv" id="finding-I4">
      <div class="finding-inv-head"><span class="id">${I("I4")}</span><span class="name">Recovery coherence</span>${bar("I4")}</div>
      <p><b>What we measured.</b> With N=5 repetitions this invariant is finally
         evaluable, and it mostly holds: recovery converges to one final cluster
         state in ${ST.I4.pres.length} of ${ST.I4.total} scenarios. It does not in
         ${list(ST.I4.viol)}; ${list(ST.I4.insuf)} has too few repetitions to say.</p>
      <p><b>Read this verdict only from the heatmap.</b> The fingerprint compares
         the Ready node set, the running workload set by replica count, and the
         healthy etcd member count — deliberately not pod placement, which is
         scheduler non-determinism rather than a recovery failure. The per-run I4
         field in each <code>invariant_report.json</code> predates that fix and is
         stale (D39).</p>
    </div>

    <div class="finding-inv" id="finding-I5">
      <div class="finding-inv-head"><span class="id">${I("I5")}</span><span class="name">Observation-action consistency</span>${bar("I5")}</div>
      <p><b>What we measured.</b> Disagreement between the three API servers about
         the same object, in only ${ST.I5.viol.length} of ${ST.I5.total}
         scenarios: ${list(ST.I5.viol)}.</p>
      <p><b>A large downward correction.</b> The earlier sweep reported I5
         violated in 11 of 12 and built a "reconciliation amplification" narrative
         on it. That signal was an etcd-revision delta threshold crossed by
         ordinary cluster activity, not by disagreement. Measured as actual
         inter-observer disagreement, it is uncommon.</p>
      <p><b>The detector has a known blind spot,</b> and it matters for the
         paper's own thesis: I5 fires only when two observers both return
         populated, differing answers. An observer that cannot answer at all does
         not count as disagreement. ${sdata("s28")} shows real cross-API-server
         divergence during its re-seed window that I5 does not flag, and
         ${sdata("s19")} carries a per-snapshot <code>.disagreement</code> matrix
         showing two live API servers on opposite sides of a split returning
         different values — evidence for the strongest claim in the paper, which
         no current invariant reads.</p>
    </div>

    <div class="finding-inv" id="finding-I6">
      <div class="finding-inv-head"><span class="id">${I("I6")}</span><span class="name">Watch progress monotonicity</span>${bar("I6")}</div>
      <p><b>What we measured: nothing regressed.</b> The observed etcd revision is
         monotonic in all ${ST.I6.pres.length} scenarios where this invariant
         applies; it is <code>NOT_APPLICABLE</code> in the other ${ST.I6.na.length},
         whose fault classes cannot move a logical revision counter backwards.</p>
      <p><b>This retracts the previous headline finding.</b> The earlier sweep
         called I6 "the most paper-relevant finding the original I1–I5 frame did
         not capture", reporting a revision regression in all 12 scenarios. It was
         an artifact: snapshots were ordered by filename, so
         <code>snapshot_t_plus_120</code> sorted before <code>snapshot_t_plus_30</code>
         and revisions appeared to run backwards (D1). Ordered by timestamp, the
         effect vanishes. etcd's revision counter is monotonic, as its design
         requires.</p>
      <p><b>What survives.</b> The <em>question</em> I6 asks is still the right
         one — but the observable is a client-visible watch gap, not a decreasing
         revision. ${sdata("s28")} measures that directly: replaying an identical
         continuation token yields no gap immediately after compaction and a gap
         ~150–200 s later, on all three API servers in all five runs.</p>
    </div>

    <div class="finding-inv" id="finding-I9">
      <div class="finding-inv-head"><span class="id">${I("I9")}</span><span class="name">Quorum continuity</span>${bar("I9")}</div>
      <p><b>What we measured.</b> The 5-member etcd cluster held quorum in
         ${ST.I9.pres.length} of the ${ST.I9.total - ST.I9.na.length} scenarios
         where quorum can be exercised at all (${ST.I9.na.length} are
         <code>NOT_APPLICABLE</code>). The single violation is ${list(ST.I9.viol)},
         which splits etcd deliberately — and even there the majority side stayed
         available.</p>
      <p><b>This is the silent positive result that makes everything else
         meaningful.</b> Without it the argument would be ambiguous: when I1
         holds, is that Kubernetes' exclusivity guarantee working, or etcd having
         stopped accepting writes? With I9 in hand, every other verdict is an
         <em>observable-layer</em> failure, not a substrate failure. The
         authoritative state stayed coherent; the views of it did not.</p>
    </div>

    <div class="finding-inv" id="finding-I10">
      <div class="finding-inv-head"><span class="id">${I("I10")}</span><span class="name">Reconciliation termination</span>${bar("I10")}</div>
      <p><b>What we measured.</b> Fresh Warning events kept appearing after the
         fault was lifted in ${ST.I10.viol.length} of ${ST.I10.total} scenarios:
         ${list(ST.I10.viol)}. ${ST.I10.insuf.length} are
         <code>INSUFFICIENT_DATA</code> (${list(ST.I10.insuf)}).</p>
      <p><b>Two measurement limits, both load-bearing.</b> The event counts
         saturate at exactly 50 because the snapshot task caps the event list at
         <code>.items[-50:]</code> — every "50 new warning pairs" is a censored
         lower bound and must not be compared across runs (D45). And the
         <code>INSUFFICIENT_DATA</code> cells are largely a naming mismatch: the
         check requires <code>post_*</code> snapshot labels, which
         ${sdata("s26")} does not use (D47). Neither is evidence about the
         cluster.</p>
      <p><b>Production translation.</b> Cluster faults usually self-resolve, and
         "warning events about object X stopped arriving" is a reasonable proxy
         for "the cluster has accepted the new state" — but note it failed to
         settle within the observation window in a third of scenarios here.</p>
    </div>

    <h3 id="finding-synthesis">Cross-scenario synthesis</h3>
    <p>Sorted by violation rate, computed from the heatmap:</p>
    <table class="findings-synth">
      <thead><tr><th>Invariant</th><th>Layer</th><th>Violated</th><th>Reading</th></tr></thead>
      <tbody>
        ${[["I2","observer","Reachability is observer-relative"],
           ["I3","observer","Declaration diverges from local reality"],
           ["I10","observer","Reconciliation often fails to settle in-window"],
           ["I4","cross-run","Recovery is usually, not always, deterministic"],
           ["I5","observer","Inter-observer disagreement is real but uncommon"],
           ["I1","structural","Exclusivity holds except when unfenced"],
           ["I9","substrate","etcd consensus is stable"],
           ["I6","observer","Revision monotonicity holds"]]
          .map(([id, layer, verdict]) => {
            const st = ST[id];
            const strong = st.viol.length >= st.total / 3;
            return `<tr><td>${I(id)}</td><td>${layer}</td>` +
                   `<td>${st.viol.length}/${st.total}</td>` +
                   `<td>${strong ? "<strong>" + verdict + "</strong>" : verdict}</td></tr>`;
          }).join("")}
      </tbody>
    </table>
    <p><b>The central claim survives the corrections, in a narrower and better
       form.</b> The substrate invariant (${I("I9")}) and the structural ones
       (${I("I1")}, ${I("I6")}) hold almost everywhere, while the
       publication-layer invariants (${I("I2")}, ${I("I3")}) fail in roughly half
       of all scenarios. The cluster's authoritative state stays coherent; what
       diverges is what each observer is told about it. Note that two of the
       three claims the earlier sweep rested on (${I("I5")}, ${I("I6")}) did not
       survive measurement fixes — the conclusion held, but not on the evidence
       originally cited for it.</p>

    <h3 id="finding-production">A typical production incident through this frame</h3>
    <div class="incident">
      <div class="incident-event"><strong>17:32</strong> — an L4 load balancer in front of <code>payments-api</code> starts logging 504s at ~3%. Customer reports come in. Latency p99 is unchanged. PagerDuty fires.</div>
      <p><strong>What these measurements say is happening:</strong></p>
      <ol>
        <li><b>The 504 rate is real.</b> ${I("I2")} is violated somewhere — a
            rolling deployment, a node draining, or a pod not yet removed from the
            endpoint subset. Violated in ${ST.I2.viol.length} of ${ST.I2.total}
            scenarios here, with windows from 7 s to 261 s depending on the fault
            class.</li>
        <li><b>Check whether a node went <code>NotReady</code>.</b> If so,
            ${I("I3")} says its containers may still be running and still writing.
            Violated in ${ST.I3.viol.length} of ${ST.I3.total} scenarios — the
            node's own view and the API's disagree far more often than the
            "cluster declares failure" mental model suggests.</li>
        <li><b>etcd is almost certainly fine.</b> ${I("I9")} was violated in only
            ${ST.I9.viol.length} scenario, and only one that splits etcd on
            purpose. Do not chase etcd; the problem is in the publication layer.</li>
        <li><b>Dashboards disagreeing across apiservers is possible but not the
            default.</b> ${I("I5")} fired in only ${ST.I5.viol.length} of
            ${ST.I5.total} scenarios. Earlier guidance here claimed this was
            near-universal; that was a measurement artifact. Do not reach for it
            as the first explanation.</li>
        <li><b>Expect noise after recovery.</b> ${I("I10")} failed to settle
            in-window in ${ST.I10.viol.length} of ${ST.I10.total} scenarios, so
            warnings continuing for a minute or two after the fault clears is
            normal, not a second incident.</li>
      </ol>
      <p class="do"><strong>What you actually do:</strong></p>
      <ul class="do-list">
        <li>Don't restart the apiserver or etcd — ${I("I9")} says the substrate is healthy.</li>
        <li>Wait 60–120 s for warnings to stop arriving, then re-evaluate.</li>
        <li>Add <code>preStop: sleep 10</code> before the next deploy. ${I("I2")}
            is observer-relative; you shrink the unsafe window, you don't close it.</li>
        <li>Make the workload idempotent. ${I("I3")} says a <code>NotReady</code>
            node's work can still land in your database.</li>
        <li>Check your clients circuit-break. With Envoy outlier detection the L4
            504s stop becoming application errors.</li>
      </ul>
      <p class="dont"><strong>What you should NOT do:</strong></p>
      <ul class="dont-list">
        <li>Bump replicas — endpoint propagation is the bottleneck, not capacity.</li>
        <li>Page the cluster team about etcd — ${I("I9")} says there is nothing there to debug.</li>
        <li>Assume a <code>NotReady</code> node has stopped doing work.</li>
      </ul>
    </div>

    <h3 id="finding-caveats">Caveats</h3>
    <ol class="caveats">
      <li><b>Some PRESERVED verdicts are blind, not negative.</b> In
          ${sdata("s22")} and ${sdata("s26")}, ${I("I1")} and ${I("I3")} read an
          evidence channel the fault itself silences — 30 snapshot-cells that
          should be <code>INSUFFICIENT_DATA</code> (D40). Recorded, not yet fixed.</li>
      <li><b>Four scenarios' purpose-built evidence files are empty in all five
          runs.</b> ${sdata("s3")}'s <code>revision_drift.json</code> is invalid
          JSON, ${sdata("s14")}'s <code>rv_drift.json</code> never records the
          controller's last-acted revision, and ${sdata("s19")}'s direct
          cp1-vs-cp2 comparison — the measurement that scenario exists to produce
          — is null everywhere, from a missing <code>pipefail</code> and a broken
          <code>date +%s%3N</code> (D44).</li>
      <li><b>Two runs report success after losing SSH mid-flight.</b>
          ${sdata("s24")} run 1 and ${sdata("s25")} run 4 record
          <code>status: ok</code> having collected no evidence; their effective N
          is 4, and nothing in the metadata says so (D46).</li>
      <li><b>${I("I10")} counts are censored at 50</b> by the snapshot event cap,
          so they are lower bounds and not comparable across runs (D45).</li>
      <li><b>Observer reach is limited.</b> Mid-fault snapshots carry null
          control-plane fields when the API VIP is unreachable from the isolated
          side. This is consistent with the thesis — you cannot observe what you
          cannot reach — but it means the dataset has known holes at peak fault,
          and those holes are not randomly distributed.</li>
      <li><b>One cluster, one topology, N=5.</b> 6 Kubernetes nodes, 5 etcd
          members, single /24, Calico, containerd. Quantitative results will move
          with topology; the directional ones should be robust. No fault
          magnitude was swept — each scenario tests one intensity, so nothing
          here supports a dose-response claim.</li>
    </ol>
  `;
  main.innerHTML = html;

  // Scroll to anchor if present (e.g. /#/findings/invariants).
  if (state.anchor) {
    const target = document.getElementById("finding-" + state.anchor);
    if (target) target.scrollIntoView({ behavior: "auto", block: "start" });
  }
}

function refToggleAll(open) {
  for (const d of document.querySelectorAll("main details.ref-card")) {
    d.open = open;
  }
}

function render() {
  renderHeader();
  renderNav();
  if (state.view === "scenario" && state.scenario) renderScenario();
  else if (state.view === "reference") renderReference();
  else if (state.view === "findings") renderFindings();
  else renderOverview();
}

// ── Boot ─────────────────────────────────────────────────────────────────────
if (!DATA) {
  document.getElementById("main").innerHTML = "<p class='empty'>No data embedded. Re-run scripts/build-report.sh.</p>";
} else {
  const initial = parseHash();
  if (initial.view === "scenario" && initial.scenario && !initial.run) {
    initial.run = latestRun(initial.scenario);
  }
  Object.assign(state, initial);
  render();
}
window.navigate = navigate;
</script>
