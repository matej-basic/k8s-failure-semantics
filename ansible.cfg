# Ansible configuration for the k8s-failure-semantics lab.

[defaults]
inventory = inventory/hosts.ini

# Playbooks live in playbooks/ but the roles live in roles/ at the repo root,
# so Ansible's default playbook-relative lookup (playbooks/roles/) misses them.
roles_path = roles

# The lab VMs are destroyed and recreated constantly (full destroy + recreate),
# so their SSH host keys change on every rebuild. Disable host-key checking and
# do not persist the keys — otherwise non-interactive runs, including the
# Terraform local-exec that bootstraps the cluster, hang until they time out.
host_key_checking = False
interpreter_python = /usr/bin/python3

[ssh_connection]
# IdentitiesOnly=yes
#   Use only the inventory key, so a loaded SSH agent doesn't exhaust the
#   server's MaxAuthTries and cause spurious auth failures.
#
# ControlMaster=auto + ControlPersist=300s
#   Reuse a single TCP+SSH session per (user, host, port) across tasks.
#   The metrics-collect role fires 5–6 sequential `delegate_to: cp1`
#   kubectl shell tasks per snapshot; without multiplexing, those open
#   five separate connections in <5s and trip cp1's sshd MaxStartups,
#   which surfaces as "Permission denied (publickey)" mid-scenario.
#   ControlPersist=300s keeps the master alive across the 30s/60s/120s
#   pauses between snapshots so the connection is re-used for the whole
#   scenario.
#
# ServerAliveInterval=30 / ServerAliveCountMax=10
#   Sends keepalives every 30s; tolerates 5 minutes of network silence
#   before the mux master gives up. This was the failure mode that
#   caused this project to disable ControlMaster originally
#   ("mux_client_request_session: read from master failed: Broken pipe"
#   during long-running tasks like `kubeadm init` and `kubectl wait`).
#   With keepalives + 300s persist the mux stays alive across long
#   tasks; the original failure mode does not recur.
#
# ControlPath under /tmp keeps the socket name short (Unix domain socket
# paths are limited to 108 bytes on Linux, 104 on macOS; ~/.ansible/cp/
# can exceed that for long home dirs).
ssh_args = -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=300s -o ControlPath=/tmp/.ansible-cp-%r@%h:%p -o ServerAliveInterval=30 -o ServerAliveCountMax=10
