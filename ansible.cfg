# Ansible configuration for the k8s-failure-semantics lab.

[defaults]
inventory = inventory/hosts.ini

# Playbooks live in playbooks/ but the roles live in roles/ at the repo root,
# so Ansible's default playbook-relative lookup (playbooks/roles/) misses them.
roles_path = roles

# The lab VMs are destroyed and recreated constantly (full destroy + recreate),
# so their SSH host keys change on every rebuild. Disable host-key checking and
# do not persist the keys — otherwise non-interactive runs, including the
# Terraform local-exec that bootstraps the cluster, hang until they time out.
host_key_checking = False
interpreter_python = /usr/bin/python3

[ssh_connection]
# IdentitiesOnly=yes: use only the inventory key, so a loaded SSH agent
# doesn't exhaust the server's MaxAuthTries and cause spurious auth failures.
# ControlMaster/ControlPersist removed: shared sockets occasionally drop with
# "mux_client_request_session: read from master failed: Broken pipe" during
# long-running tasks (kubectl wait, kubeadm init). Fresh connections are
# slower but reliable.
ssh_args = -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
