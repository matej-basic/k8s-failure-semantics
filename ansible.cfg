# Ansible configuration for the k8s-failure-semantics lab.

[defaults]
inventory = inventory/hosts.ini

# Playbooks live in playbooks/ but the roles live in roles/ at the repo root,
# so Ansible's default playbook-relative lookup (playbooks/roles/) misses them.
roles_path = roles

# The lab VMs are destroyed and recreated constantly (full destroy + recreate),
# so their SSH host keys change on every rebuild. Disable host-key checking and
# do not persist the keys — otherwise non-interactive runs, including the
# Terraform local-exec that bootstraps the cluster, hang until they time out.
host_key_checking = False
interpreter_python = /usr/bin/python3

[ssh_connection]
# IdentitiesOnly=yes
#   Use only the inventory key, so a loaded SSH agent doesn't exhaust the
#   server's MaxAuthTries and cause spurious auth failures.
#
# ControlMaster is deliberately OFF. It was tried (commit 3b5a507) to
# collapse the metrics-collect connection bursts into one multiplexed
# session, but on freshly-cloned VMs the mux clients race to create the
# control socket and the loser fails preauth with
# "Permission denied (publickey,password)". That repeatedly aborted the
# cluster bootstrap on cp1 (the kubeadm-init node, the most-delegated-to
# host). The connection-burst problem ControlMaster was meant to solve is
# instead handled at the server: roles/common raises sshd MaxStartups to
# 60:30:200, comfortably above any burst the playbooks generate. Fresh
# connections per task are slower but reliable — and reliability is what
# a one-shot `terraform apply` bootstrap needs.
#
# ServerAliveInterval keeps long-running tasks (kubeadm init, kubectl
# wait) from being dropped by an idle-timeout mid-run.
ssh_args = -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10
