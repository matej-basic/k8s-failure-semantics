- name: Generate combined results report
  hosts: "{{ groups['observer'][0] }}"
  gather_facts: no
  tags: always
  tasks:
    - name: Run cross-scenario analysis
      script: ../scripts/aggregate-results.sh {{ results_base }}
      register: aggregate_report

    - name: Save aggregate report
      copy:
        dest: "{{ results_base }}/aggregate_report.json"
        content: "{{ aggregate_report.stdout }}"

    - name: Print summary
      debug:
        msg: "All scenarios complete. Results in {{ results_base }}"
