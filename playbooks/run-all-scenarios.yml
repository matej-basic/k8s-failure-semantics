---
# playbooks/run-all-scenarios.yml
# Runs all scenarios in sequence with pre-flight health checks between each.
# Pass --tags "s1,s3,s11" to run a subset.

- name: Pre-run cluster health check
  hosts: "{{ groups['control_plane'][0] }}"
  gather_facts: no
  tags: always
  tasks:
    - name: All nodes must be Ready before any scenario starts
      shell: |
        NOT_READY=$(kubectl get nodes --no-headers | grep -v " Ready" | wc -l)
        echo $NOT_READY
      register: not_ready
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      failed_when: not_ready.stdout | int > 0

    - name: etcd must be healthy
      shell: |
        ETCDCTL_API=3 etcdctl \
          --endpoints={{ etcd_endpoints }} \
          --cacert={{ etcd_cert_dir }}/ca.crt \
          --cert={{ etcd_cert_dir }}/server.crt \
          --key={{ etcd_cert_dir }}/server.key \
          endpoint health --write-out=table
      delegate_to: "{{ groups['etcd'][0] }}"

- name: S1 — Symmetric control-plane partition
  import_playbook: ../scenarios/s1/playbook.yml
  tags: s1

- name: Post-S1 health check
  import_playbook: _health-check.yml
  tags: s1

- name: S2 — Asymmetric worker isolation
  import_playbook: ../scenarios/s2/playbook.yml
  tags: s2

- name: Post-S2 health check
  import_playbook: _health-check.yml
