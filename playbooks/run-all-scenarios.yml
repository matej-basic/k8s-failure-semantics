# ── Gray-failure scenarios (S20-S28) ─────────────────────────────────────────
# Added from REVIEW.md section 3. The existing library covers clean crash-stop
# and timing failures; these sample the region where the node stays Ready and
# nothing works, which is where production clusters actually fail.
#
# S22 and S27 each have a second variant that is NOT run here. The variant is
# selected by a play var the scenario defines itself, so it cannot be overridden
# from an import_playbook; run those passes explicitly instead:
#     ansible-playbook ... scenarios/s22/playbook.yml -e s22_variant=kubelet
#     ansible-playbook ... scenarios/s27/playbook.yml -e s27_variant=substrate
# Both write to their scenario's results dir, so run them with a distinct run_id
# if you want to keep both passes from one sweep.

