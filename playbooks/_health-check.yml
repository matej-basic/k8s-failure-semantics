---
# playbooks/_health-check.yml
# Run between scenarios to verify the cluster has recovered cleanly.
# Fails hard if any node is NotReady or etcd has lost a member.

- name: Reset failed/unreachable host state before next scenario
  # Ansible flags a host as `unreachable` the first time a task fails on it
  # (most commonly here: a `delegate_to: cp1` task hitting cp1's sshd burst
  # limit during a fault window). That marker is **sticky across plays** —
  # the host is silently excluded from every subsequent play in the same
  # `ansible-playbook` invocation. During run-all-scenarios.yml that
  # produced an empty S3 onward: zero tasks run, the per-scenario invariant
  # script then crashes because the results dir was never created. Reset
  # the per-host error state here before the next scenario starts. localhost
  # is always reachable so this play is guaranteed to run.
  hosts: localhost
  gather_facts: no
  tasks:
    - meta: clear_host_errors

- name: Inter-scenario health check
  hosts: "{{ groups['control_plane'][0] }}"
  gather_facts: no
  tasks:
    - name: Wait up to 5 minutes for all nodes to be Ready
      shell: |
        kubectl get nodes --no-headers | grep -v " Ready" | wc -l
      register: not_ready
      retries: 30
      delay: 10
      until: not_ready.stdout | int == 0
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Verify all expected nodes are present
      shell: |
        kubectl get nodes --no-headers | wc -l
      register: node_count
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      failed_when: node_count.stdout | int < 6

    - name: Verify controller-manager lease is held
      shell: |
        HOLDER=$(kubectl get lease kube-controller-manager -n kube-system \
          -o jsonpath='{.spec.holderIdentity}')
        test -n "$HOLDER"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      retries: 12
      delay: 10
      register: cm_lease_check
      until: cm_lease_check.rc == 0

    - name: Verify test deployments are healthy
      # Some scenarios (partition / pressure) leave the workload mid-recovery.
      # Bumped from 3×60s to 10×60s so we don't bail on a slow but normal
      # post-fault settle window — observed nginx-stateless taking >3 min to
      # come back after an S1-style cp1 partition that destabilised the
      # scheduler view.
      shell: |
        kubectl rollout status deployment/nginx-stateless --timeout=60s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      retries: 10
      delay: 10
      register: rollout_check
      until: rollout_check.rc == 0

- name: Inter-scenario teardown sweep — clear any residual faults on every host
  # include_role does not accept delegate_to, so run the teardown role as its
  # own play against k8s_cluster:etcd directly instead of trying to fan-out
  # from the control-plane play above.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    fault_type: teardown
    scenario_id: cleanup
  roles:
    - fault-inject

- name: Health check — etcd
  hosts: "{{ groups['etcd'][0] }}"
  gather_facts: no
  tasks:
    - name: Verify all etcd members are healthy
      shell: |
        ETCDCTL_API=3 etcdctl \
          --endpoints={{ etcd_endpoints }} \
          --cacert={{ etcd_cert_dir }}/ca.crt \
          --cert={{ etcd_cert_dir }}/server.crt \
          --key={{ etcd_cert_dir }}/server.key \
          endpoint health --write-out=json \
          | jq 'all(.[]; .health == true)'
      register: etcd_all_healthy
      failed_when: etcd_all_healthy.stdout | trim != 'true'
      retries: 12
      delay: 10
      until: etcd_all_healthy.rc == 0
