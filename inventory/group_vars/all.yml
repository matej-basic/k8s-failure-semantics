---
# group_vars/all.yml
# Variables inherited by every host and play

# ── Shell ─────────────────────────────────────────────────────────────────────
# Use bash (not /bin/sh, which is dash on Ubuntu) for every shell:/script: task.
# Several scenarios use bash-isms — `time (subshell)`, `local`, `${var:0:N}`
# substring, process substitution — that silently break under dash with errors
# like `Syntax error: word unexpected` or `Bad substitution`. Setting this
# globally kills the whole class of bugs without touching the system's
# /bin/sh symlink (system scripts and apt post-installs rely on dash semantics).
ansible_shell_executable: /bin/bash

# ── Scenario metadata ─────────────────────────────────────────────────────────
scenario_id: "unset"
scenario_name: "unset"
run_id: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

# ── Timing ────────────────────────────────────────────────────────────────────
fault_duration: 60          # seconds fault is active
observation_window: 120     # seconds we collect metrics after fault removal
convergence_timeout: 300    # seconds we wait for semantic convergence
poll_interval: 5            # seconds between observer state snapshots

# ── Container tooling ─────────────────────────────────────────────────────────
# crictl (cri-tools) — CRI debug client used by metrics-collect for node-local
# container truth. Compatible across adjacent k8s minors; v1.31 talks to the
# 1.36 containerd CRI v1 socket fine.
crictl_version: v1.31.1

# ── etcd ──────────────────────────────────────────────────────────────────────
etcd_cert_dir: /etc/etcd/pki
etcdctl_env:
  ETCDCTL_API: "3"
  ETCDCTL_ENDPOINTS: "{{ etcd_endpoints }}"
  ETCDCTL_CACERT: "{{ etcd_cert_dir }}/ca.crt"
  ETCDCTL_CERT: "{{ etcd_cert_dir }}/server.crt"
  ETCDCTL_KEY: "{{ etcd_cert_dir }}/server.key"

# ── Toxiproxy ─────────────────────────────────────────────────────────────────
toxiproxy_bin: /usr/local/bin/toxiproxy-server
toxiproxy_cli: /usr/local/bin/toxiproxy-cli
toxiproxy_api_port: 8474
toxiproxy_etcd_listen: "0.0.0.0:{{ toxiproxy_etcd_port }}"
toxiproxy_etcd_upstream: "127.0.0.1:2379"

# ── Results ───────────────────────────────────────────────────────────────────
results_base: /opt/k8s-results
results_dir: "{{ results_base }}/{{ scenario_id }}/{{ run_id }}"

# ── Workloads deployed for testing ────────────────────────────────────────────
stateless_app_name: nginx-stateless
stateless_app_replicas: 3
stateful_app_name: postgres-stateful
stateful_app_namespace: default
