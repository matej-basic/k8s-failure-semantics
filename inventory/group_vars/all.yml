---
# group_vars/all.yml
# Variables inherited by every host and play

# ── Shell ─────────────────────────────────────────────────────────────────────
# Use bash (not /bin/sh, which is dash on Ubuntu) for every shell:/script: task.
# Several scenarios use bash-isms — `time (subshell)`, `local`, `${var:0:N}`
# substring, process substitution — that silently break under dash with errors
# like `Syntax error: word unexpected` or `Bad substitution`. Setting this
# globally kills the whole class of bugs without touching the system's
# /bin/sh symlink (system scripts and apt post-installs rely on dash semantics).
ansible_shell_executable: /bin/bash

# ── Scenario metadata ─────────────────────────────────────────────────────────
scenario_id: "unset"
scenario_name: "unset"
run_id: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

# ── Timing ────────────────────────────────────────────────────────────────────
fault_duration: 60          # seconds fault is active
observation_window: 120     # seconds we collect metrics after fault removal
convergence_timeout: 300    # seconds we wait for semantic convergence
poll_interval: 5            # seconds between observer state snapshots

# ── Continuous trace recorder ─────────────────────────────────────────────────
# REVIEW.md M1: the snapshots above are 30-60 s apart, but the mechanisms the
# paper is about are faster than that — 15 s lease duration, 10 s lease renewal,
# ~40 s node-monitor grace, sub-second endpoint and kube-proxy propagation. A
# 30 s sampler cannot resolve a 15 s lease transition, so divergence onset and
# duration were quantised to the snapshot grid. metrics-collect therefore also
# runs a continuous recorder (metrics_mode: trace-start / trace-stop) that
# writes timestamped JSONL for the whole scenario, so a verdict can be a
# duration ("I1 violated for 143 s, t+62 -> t+205") instead of a boolean.
#
# The recorder is ADDITIVE. Setting trace_enabled: false disables it completely
# and leaves the snapshot path — and therefore every existing scenario — exactly
# as it was.

trace_enabled: true

# Seconds between samples of the Kubernetes stream. 1 Hz is chosen against the
# 10 s lease renewal: it resolves a missed renewal within one renewal period.
# Every kubectl call the recorder makes is bounded at 0.8 x this (client) and
# 0.9 x this (external timeout(1)), so raising this loosens the timeouts with
# it and lowering it below 1 tightens them proportionally.
trace_interval: 1

# Seconds between samples of the etcd stream, which is deliberately slower.
# `etcdctl endpoint status` contacts all five members in one call, and a
# partitioned member burns its dial timeout before the others are reported — a
# sub-second budget shared across five endpoints would report an empty cluster
# during exactly the scenarios (S19, S28) that need it most. REVIEW.md M1 asks
# for a *periodic* etcd revision, not a 1 Hz one.
trace_etcd_interval: 5

# Slack added to fault_duration + observation_window to form the recorder's hard
# deadline. It has to cover the whole scenario, not just the fault window: a
# scenario's pauses, its snapshots (~20 SSH sessions each) and its teardown all
# sit inside the trace. The longest scenario in the suite, S2, spends 480 s in
# pauses and roughly 800 s wall-clock end to end; with S2's own 60 s / 120 s
# timing this default gives it 1080 s. Raise it per-scenario if a scenario grows
# past that — a trace that hits its deadline stops early and says so in its
# footer (exit_reason: deadline_reached), it does not fail the run.
trace_margin: 900

# The hard wall-clock deadline itself, baked into the recorder at launch and
# measured on the monotonic clock. Overridable per scenario.
trace_max_seconds: "{{ (fault_duration | int) + (observation_window | int) + (trace_margin | int) }}"

# Output bounds, enforced by the recorder as it writes so a long or wedged run
# cannot fill a node's disk. 5000 records is ~83 minutes at 1 Hz — far beyond
# any scenario, so in practice the deadline always trips first and the line cap
# is the backstop for a mis-set trace_max_seconds. 32 MiB is the real ceiling:
# a k8s record is ~2-4 KB (6 nodes, ~20 leases, an endpoint set), so a normal
# 10-minute scenario produces roughly 1.5-2.5 MB.
trace_max_lines: 5000
trace_max_bytes: 33554432

# Where recorders live on the cluster nodes before their output is fetched back
# to the observer. /var/tmp rather than /tmp so a tmpfs /tmp cannot charge the
# trace against RAM, and so the file survives for hand-collection if a fetch
# fails.
trace_remote_dir: /var/tmp/k8s-trace

# false: a recorder that survives SIGKILL is reported loudly and written to
# trace_stop.json, but does not fail the play. This is the safe default because
# a scenario's fault-teardown play runs AFTER metrics collection, and a failure
# here that skipped it would leave iptables DROP rules in place and poison every
# scenario after it. Set true for a run where an unstoppable recorder should
# halt everything.
trace_stop_strict: false

# Which host carries which stream.
#   k8s  — cp2 by default, following the metrics_cp_host convention used by the
#          snapshot path: cp1 holds the keepalived VIP and its sshd is bursty
#          under load, and most scenarios partition cp1 anyway.
#   etcd — the first etcd member, because the etcd client certificates in
#          /etc/etcd/pki exist ONLY on etcd nodes.
# A scenario that partitions cp2 should override metrics_cp_host, exactly as it
# already must for the snapshots.
trace_k8s_host: "{{ metrics_cp_host | default(groups['control_plane'][1]) }}"
trace_etcd_host: "{{ groups['etcd'][0] }}"

# One recorder process per entry. `outfile` is the name the stream lands under
# in results_dir on the observer.
trace_streams:
  - stream: k8s
    host: "{{ trace_k8s_host }}"
    interval: "{{ trace_interval }}"
    outfile: trace.jsonl
  - stream: etcd
    host: "{{ trace_etcd_host }}"
    interval: "{{ trace_etcd_interval }}"
    outfile: trace_etcd.jsonl

# ── Container tooling ─────────────────────────────────────────────────────────
# crictl (cri-tools) — CRI debug client used by metrics-collect for node-local
# container truth. Compatible across adjacent k8s minors; v1.31 talks to the
# 1.36 containerd CRI v1 socket fine.
crictl_version: v1.31.1

# ── etcd ──────────────────────────────────────────────────────────────────────
etcd_cert_dir: /etc/etcd/pki
etcdctl_env:
  ETCDCTL_API: "3"
  ETCDCTL_ENDPOINTS: "{{ etcd_endpoints }}"
  ETCDCTL_CACERT: "{{ etcd_cert_dir }}/ca.crt"
  ETCDCTL_CERT: "{{ etcd_cert_dir }}/server.crt"
  ETCDCTL_KEY: "{{ etcd_cert_dir }}/server.key"

# ── Toxiproxy ─────────────────────────────────────────────────────────────────
toxiproxy_bin: /usr/local/bin/toxiproxy-server
toxiproxy_cli: /usr/local/bin/toxiproxy-cli
toxiproxy_api_port: 8474
toxiproxy_etcd_listen: "0.0.0.0:{{ toxiproxy_etcd_port }}"
toxiproxy_etcd_upstream: "127.0.0.1:2379"

# ── Results ───────────────────────────────────────────────────────────────────
results_base: /opt/k8s-results
results_dir: "{{ results_base }}/{{ scenario_id }}/{{ run_id }}"

# ── Workloads deployed for testing ────────────────────────────────────────────
stateless_app_name: nginx-stateless
stateless_app_replicas: 3
stateful_app_name: postgres-stateful
stateful_app_namespace: default

# ── Explicit observer set (REVIEW.md M2) ──────────────────────────────────────
# The paper is titled *Observer-Relative Failures*, but until now almost every
# measurement came from ONE API server (metrics_cp_host, cp2) plus node-local
# crictl: the observer-relativity was asserted, not measured. metrics-collect
# now asks the SAME three questions of EVERY observer at each snapshot and
# derives a pairwise disagreement matrix from the answers
# (roles/metrics-collect/files/disagreement.jq), and the 1 Hz recorder asks the
# three API servers the same three questions every tick so a disagreement can
# be reported as a DURATION rather than as a snapshot-grid boolean
# (scripts/observer-disagreement-duration.sh).
#
# Observers: apiserver:cp1/cp2/cp3 (addressed on their own IPs, never through
# the VIP), etcd:quorum (linearizable etcdctl get on the registry keys),
# kubelet:<node> (:10250), cri:<node> (crictl), informer:in-cluster and
# client:in-cluster-probe.
#
# The three questions, and their canonical answer domains, are documented in
# roles/metrics-collect/files/disagreement.jq. Changing a subject below changes
# what is asked; it does not change the schema.

observer_question_node: worker1
observer_question_pod: "{{ stateful_app_name }}-0"
observer_question_service: "{{ stateless_app_name }}"
observer_question_namespace: "{{ stateful_app_namespace }}"

# Every observer query is bounded twice: a client-side deadline and an external
# timeout(1). Both are far shorter than the snapshot cadence (30-60 s), because
# S22 deliberately SIGSTOPs a kubelet and a frozen kubelet completes the TCP
# handshake in the kernel and then never answers — an unbounded read would
# stall the whole snapshot, and ignore_errors cannot rescue a hang.
observer_view_timeout: 5s    # kubectl --request-timeout for the API-server views
observer_hard_timeout: 8     # s, timeout(1) around each API-server view command
observer_kubelet_timeout: 5  # s, curl --max-time against :10250
observer_etcd_timeout: 5     # s, etcdctl dial/command timeout for the quorum read
observer_informer_timeout: 6 # s, kubectl logs against the informer pod
observer_probe_timeout: 3    # s, curl --max-time for the in-cluster HTTP probe

# The client observer answers "what is the endpoint set of nginx-stateless" from
# the kube-proxy DATAPLANE on the probe host (the KUBE-SVC / KUBE-SEP chains in
# the nat table), not from the API server. That is the set a client's connection
# can actually land on, and it is the one endpoint view in the roster that is
# not an API read. Set false to skip it; the client observer then answers
# not_applicable for that question rather than guessing.
observer_dataplane_endpoints: true

# ── In-cluster informer observer ──────────────────────────────────────────────
# A Job in kube-system that reads nodes / the stateful pod / the service
# endpoints from INSIDE the cluster: a projected ServiceAccount token, through
# the kubernetes.default.svc ClusterIP, so KUBE-PROXY — not the operator —
# decides which API server answers. That is the property that makes it a
# distinct observer, and no other entry in the roster exercises that path: the
# per-API-server views are pinned to one node's address each, and the snapshot's
# bundled read is pinned to metrics_cp_host.
#
# It issues ordinary (linearizable) reads with `kubectl -o jsonpath`, not
# resourceVersion=0 watch-cache reads: the image carries no jq, and parsing
# `get --raw` bodies with sed would be brittle in exactly the failure modes this
# observer exists to survive. Watch-cache lag is already measured directly, per
# API server, by .observers[].probe_rv_cache in the snapshot. Each line records
# the resourceVersion of all three objects, so the informer's own lag against
# the API-server views remains computable.
#
# It prints one JSON line per interval; snapshots read the last line with
# `kubectl logs --tail=1`.
#
# LIFECYCLE — the pod is created ONLY by tasks/trace-start.yml and removed by
# tasks/trace-stop.yml, and it cannot outlive its scenario even if the stop
# never runs:
#   1. reap-on-start deletes any informer left by an earlier run before this
#      one is created (same mechanism the trace recorder uses);
#   2. activeDeadlineSeconds (observer_informer_max_seconds) makes the cluster
#      itself terminate the Job;
#   3. ttlSecondsAfterFinished makes the TTL controller DELETE the Job and its
#      pod afterwards, with no Ansible involvement at all;
#   4. tasks/trace-stop.yml deletes it explicitly.
# Set false to never create it; the informer observer then reports
# state:"unreadable", reason:"informer_absent" in every snapshot, which is
# honest missing data rather than silent agreement.
observer_informer_enabled: true
observer_informer_namespace: kube-system
observer_informer_name: "k8s-obs-informer"
# Already used in-cluster by scenarios/s5 and scenarios/s14, so it is a known
# pullable image on this lab rather than a new dependency.
observer_informer_image: bitnami/kubectl:1.29
# Seconds between the informer's own sampling loops. Deliberately slower than
# the 1 Hz trace: the informer is consulted by snapshots (every 30-60 s), not
# per tick, and each of its three reads is bounded at 0.30 x this so all three
# fit inside one interval even when every one of them times out.
observer_informer_interval: 3
observer_informer_ttl_seconds: 120
observer_informer_max_seconds: "{{ trace_max_seconds }}"
# Seconds a logged informer line may be older than the snapshot before it is
# reported as unreadable(informer_stale) instead of being believed. Generous
# next to the 1 s interval: the informer is meant to be a LAGGING observer and
# its lag is a measurement, but a line minutes old is a dead pod, not a lag.
observer_informer_max_age_ms: 15000
# Seconds trace-start waits for the informer pod to become Ready before giving
# up. Non-fatal either way: an informer that never came up is recorded as
# unreadable, not as agreement.
observer_informer_ready_timeout: 60
# Every Kubernetes object the informer needs is named this way, so the reap in
# trace-start, the delete in trace-stop and the `kubectl logs job/...` in
# snapshot.yml all address the same name without re-deriving it. run_id carries
# an underscore, which is not legal in a DNS-1123 name, hence the replace.
informer_object_name: "{{ observer_informer_name }}-{{ scenario_id }}-{{ run_id | replace('_', '-') | lower }}"

# ── Per-API-server sampling inside the 1 Hz trace ─────────────────────────────
# The M1 recorder samples ONE API server, so its records cannot show two
# observers disagreeing. With this enabled the k8s stream additionally asks each
# API server the three M2 questions every tick and appends an "observers" array
# to each record; every pre-existing field keeps its exact name and meaning, so
# the M1 schema is a subset and old consumers are unaffected.
#
# The queries are issued with curl and client certificates extracted once from
# admin.conf into the recorder's 0700 working directory (removed by its exit
# trap) rather than with kubectl: at 1 Hz, nine concurrent kubectl processes
# would cost several hundred MB of RSS on the recorder's host every second,
# while nine curls cost a few MB. Each is bounded by --max-time at 0.8 x the
# tick and by timeout(1) at 0.9 x the tick, exactly like every other sub-query.
trace_observers_enabled: true

# ── Repetition plan (REVIEW.md M3) ────────────────────────────────────────────
# Every scenario has exactly one run in results/, so no timing measurement has
# a variance and no violation has a frequency. REVIEW.md M3 asks for N >= 5 per
# scenario, median + IQR for every timing measurement, violation frequency
# instead of a boolean, and I4 evaluated for any scenario with N > 1.
#
# The mechanism is scripts/repeat-scenario.sh, which runs a scenario's unit of
# repetition K times and writes each iteration to
#     results/<sN>/<run_id>/run_<K>/
# — the layout S6 has always produced, now available to all 23 scenarios.
#
# THE DEFAULT IS DELIBERATELY 1.
# A single pass of the 23 scenarios already takes several hours; N=5 across the
# suite is a multi-day run against a live lab that is also serving the paper.
# Making 5 the default would mean every `run-all-scenarios.yml` invocation
# silently became a multi-day commitment. So the sweep keeps doing exactly what
# it does today, and repetition is something the operator asks for:
#
#     scripts/repeat-scenario.sh s2 -n 5           # one scenario, N=5
#     scripts/repeat-scenario.sh s1:5 s2:5 s20:3   # per-scenario N
#     scripts/repeat-scenario.sh --plan            # the counts below
#     scripts/repeat-scenario.sh --plan -n 5 --detached   # the M3 target
#
# Precedence for the iteration count, highest first:
#     sN:K on the command line
#   > -n K on the command line
#   > scenario_repeat_counts[sN] below
#   > scenario_repeat_default below
#
# These two vars are read by scripts/repeat-scenario.sh (awk, no YAML parser on
# the macOS controller) and are also available to any playbook that wants them.
# Keep the map flat, two-space indented, one `sN: <int>` per line.

scenario_repeat_default: 1

scenario_repeat_counts:
  # S6 is the repeat-run recovery study; five iterations is the experiment's
  # own design, not a harness default. scenarios/s6/playbook.yml still hard-
  # codes the same five, so the sweep and the harness agree.
  s6: 5
