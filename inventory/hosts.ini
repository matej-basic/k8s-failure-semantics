[control_plane]
cp1 ansible_host=192.168.100.11
cp2 ansible_host=192.168.100.12
cp3 ansible_host=192.168.100.13

[workers]
worker1 ansible_host=192.168.100.21
worker2 ansible_host=192.168.100.22
worker3 ansible_host=192.168.100.23

[etcd]
etcd1 ansible_host=192.168.100.31
etcd2 ansible_host=192.168.100.32
etcd3 ansible_host=192.168.100.33

# Optional 5-node etcd for S19
# etcd4 ansible_host=192.168.100.34
# etcd5 ansible_host=192.168.100.35

[observer]
observer ansible_host=192.168.100.10

[k8s_cluster:children]
control_plane
workers

[all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

# Kubernetes config
k8s_version=1.29.3
pod_network_cidr=10.244.0.0/16
service_cidr=10.96.0.0/12
api_vip=192.168.100.100

# etcd config
etcd_version=3.5.12
etcd_data_dir=/var/lib/etcd
etcd_endpoints=https://192.168.100.31:2379,https://192.168.100.32:2379,https://192.168.100.33:2379

# Toxiproxy config (runs on each etcd host, fronts etcd port)
toxiproxy_etcd_port=22379

# Observation window defaults (seconds) — override per scenario
fault_duration=60
observation_window=120
convergence_timeout=300

# Results output on observer
results_dir=/opt/k8s-results
