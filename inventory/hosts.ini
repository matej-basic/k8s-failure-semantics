[control_plane]
cp1 ansible_host=10.0.0.49
cp2 ansible_host=10.0.0.51
cp3 ansible_host=10.0.0.52

[workers]
worker1 ansible_host=10.0.0.53
worker2 ansible_host=10.0.0.54
worker3 ansible_host=10.0.0.55

[etcd]
etcd1 ansible_host=10.0.0.56
etcd2 ansible_host=10.0.0.57
etcd3 ansible_host=10.0.0.58
etcd4 ansible_host=10.0.0.60
etcd5 ansible_host=10.0.0.61

# No observer VM is provisioned. The observer is the machine running
# Ansible; localhost is used so the kubeconfig-copy play has a target.
[observer]
localhost ansible_connection=local

[k8s_cluster:children]
control_plane
workers

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
ansible_become=true

# Kubernetes config
k8s_version=1.36.1
pod_network_cidr=10.244.0.0/16
service_cidr=10.96.0.0/12
api_vip=10.0.0.59

# etcd config
etcd_version=3.5.30
etcd_data_dir=/var/lib/etcd
etcd_endpoints=https://10.0.0.56:2379,https://10.0.0.57:2379,https://10.0.0.58:2379,https://10.0.0.60:2379,https://10.0.0.61:2379

# Toxiproxy config (runs on each etcd host, fronts etcd port)
toxiproxy_etcd_port=22379

# Observation window defaults (seconds) — override per scenario
fault_duration=60
observation_window=120
convergence_timeout=300

# Results output on observer
results_dir=/opt/k8s-results
