---
# scenarios/s1/playbook.yml
# S1: Symmetric control-plane partition
#
# What it does:
#   Isolates cp1 from cp2 and cp3 (and from the etcd cluster).
#   The isolated node cannot communicate with the rest of the control plane.
#
# What we measure:
#   - Whether a second leader lease holder appears (I1 violation)
#   - How long before the isolated node's API server becomes unreachable
#   - Whether etcd loses quorum or re-elects cleanly
#   - Whether the remaining two nodes form a working majority
#   - Recovery trajectory after partition is lifted

- name: S1 — Start the continuous 1 Hz observer trace
  # REVIEW.md M1/M2/M4 — this play is what makes that measurement chain live.
  # metrics-collect's snapshot path is a 30-60 s grid, but the mechanisms this
  # suite studies (15 s lease duration, 10 s renew, ~40 s node-monitor grace,
  # sub-second endpoint and kube-proxy propagation) are all faster than it. The
  # continuous ~1 Hz recorder is therefore started HERE, before the baseline
  # snapshot, so its JSONL spans the whole fault window and opens with a
  # pre-fault stretch to compare against.
  #
  # It is also the only thing that creates the in-cluster informer observer:
  # without a trace that observer records as informer_absent in every snapshot,
  # and every VIOLATED verdict comes back with duration_s: null.
  #
  # metrics_mode is set in the include's `vars:` and NEVER as a play var — a
  # play-level metrics_mode would leak into every snapshot call in the play and
  # silence it. See the header of roles/metrics-collect/tasks/main.yml.
  #
  # Purely additive: the recorder is detached, bounded by its own monotonic
  # deadline and by timeout(1), and reaped on the next scenario's start.
  # Nothing about this scenario's existing snapshots or fault timing changed.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s1
  tasks:
    - include_role: { name: metrics-collect }
      vars: { metrics_mode: trace-start }

- name: S1 — Pre-flight and baseline snapshot
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s1
    scenario_name: "Symmetric control-plane partition"
    snapshot_label: pre_fault
  tasks:
    - name: Verify cluster is healthy before starting
      shell: kubectl get nodes --no-headers | grep -v " Ready" | wc -l
      register: not_ready_count
      delegate_to: "{{ groups['control_plane'][0] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      failed_when: not_ready_count.stdout | int > 0
      # Tolerate one transient ssh mux drop on cp1 (instead of silently
      # propagating unreachable=1 to every subsequent play).
      ignore_unreachable: yes
      retries: 3
      delay: 5
      until: not_ready_count is succeeded

    - name: Create results directory
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

  roles:
    - role: metrics-collect

- name: S1 — Inject symmetric partition on cp1
  hosts: cp1
  gather_facts: no
  vars:
    scenario_id: s1
    fault_type: network_partition
    target_host: cp1
    # All etcd members, derived from the inventory — with a 5-member etcd
    # cluster a hardcoded etcd1-3 list would leave etcd4/etcd5 reachable
    # (a healthy quorum), so cp1's apiserver would just fail over to them
    # and the partition would have no effect.
    peer_hosts: "{{ ['cp2', 'cp3'] + groups['etcd'] }}"
  roles:
    - role: fault-inject

- name: S1 — Observe during fault window (t+30s)
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s1
    snapshot_label: t_plus_30
  tasks:
    - pause:
        seconds: 30
      run_once: true
  roles:
    - role: metrics-collect

- name: S1 — Observe during fault window (t+60s)
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s1
    snapshot_label: t_plus_60
  tasks:
    - pause:
        seconds: 30
      run_once: true
  roles:
    - role: metrics-collect

- name: S1 — Observe during fault window (t+120s)
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s1
    snapshot_label: t_plus_120
  tasks:
    - pause:
        seconds: 60
      run_once: true
  roles:
    - role: metrics-collect

- name: S1 — Clear sticky unreachable state so teardown can run
  # Ansible marks a host unreachable on its first unreachable task, and that
  # marker is STICKY ACROSS PLAYS: the host is silently dropped from every
  # later play, teardown included. On 2026-08-28 S1 lost cp1 to an ssh hiccup
  # mid-fault, its "Tear down partition" play was skipped for that host, and
  # seven DROP rules survived the run — cp1's API server could not reach etcd,
  # the VIP went down with it, and the sweep halted (REVIEW.md D20).
  # localhost is always reachable, so this play is guaranteed to run and to
  # reset that state before the teardown below.
  hosts: localhost
  gather_facts: no
  tasks:
    - meta: clear_host_errors

- name: S1 — Tear down partition
  hosts: cp1
  gather_facts: no
  vars:
    scenario_id: s1
    fault_type: teardown
  roles:
    - role: fault-inject

- name: S1 — Post-fault snapshots (recovery trajectory)
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s1
  tasks:
    - pause:
        seconds: 30
      run_once: true

    - include_role:
        name: metrics-collect
      vars:
        snapshot_label: post_fault_t30

    - pause:
        seconds: 60
      run_once: true

    - include_role:
        name: metrics-collect
      vars:
        snapshot_label: post_fault_t90

    - pause:
        seconds: 120
      run_once: true

    - include_role:
        name: metrics-collect
      vars:
        snapshot_label: post_fault_t210

- name: S1 — Stop the continuous 1 Hz observer trace
  # Placed AFTER this scenario's fault teardown and after its last post-fault
  # snapshot, and BEFORE the invariant report:
  #   - after teardown, because a failure inside metrics collection that
  #     skipped the teardown would leave the fault (iptables DROP rules, tc
  #     qdiscs, toxics) in place and poison every scenario after this one. A
  #     lost trace is recoverable; a stranded fault is not.
  #   - before the invariant report, because trace-stop is what fetches
  #     trace.jsonl back to the observer and writes disagreement_duration.json,
  #     and check-invariants.sh reads both to put duration_s and
  #     first_violation_ts onto the VIOLATED verdicts.
  #
  # trace-stop is idempotent and every step of it is non-fatal, so calling it
  # against a recorder that already hit its own deadline is a no-op. If this
  # play never runs at all — the run aborted earlier — the recorder still ends
  # on its monotonic deadline, is killed by its timeout(1) wrapper, only ever
  # writes to this scenario's own file name, and is reaped by the next
  # scenario's trace-start.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s1
  tasks:
    - include_role: { name: metrics-collect }
      vars: { metrics_mode: trace-stop }

- name: S1 — Write invariant evaluation report
  hosts: "{{ groups['observer'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s1
  tasks:
    - name: Run invariant checker script
      # See REVIEW.md D9: `script:` copies this file alone to a temp dir,
      # so its sibling scripts/violation-duration.sh is missing and every
      # duration_s comes back null. Run it in place.
      command: "{{ repo_dir }}/scripts/check-invariants.sh {{ results_dir }}"
      register: invariant_report

    - name: Write invariant report
      copy:
        dest: "{{ results_dir }}/invariant_report.txt"
        content: "{{ invariant_report.stdout }}"
