---
# scenarios/s19/playbook.yml
# S19: Split etcd quorum with asymmetric member visibility
#
# What it does:
#   Isolates etcd1 from etcd2 and etcd3 asymmetrically:
#   - etcd1 cannot reach etcd2/etcd3 (loses quorum on its side)
#   - etcd2 and etcd3 maintain quorum with each other
#   - Some API servers may still be pointed at etcd1 (stale reads)
#
# Note: This requires cp1's API server to be configured to prefer etcd1,
#       while cp2 and cp3 prefer etcd2/etcd3. This is done by manipulating
#       the kube-apiserver static pod manifests.
#
# What we measure:
#   - Whether the API server connected to etcd1 continues serving stale reads
#   - Whether writes fail on etcd1's side (correct) but reads succeed (dangerous)
#   - Whether two API servers return different object versions simultaneously (I5)
#   - Whether the control plane produces split-brain write actions
#   - How the system behaves when quorum is restored

- name: S19 — Pre-flight baseline
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s19
    scenario_name: "Split etcd quorum with asymmetric member visibility"
    snapshot_label: pre_fault
  tasks:
    - name: Create results directory
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

    - name: Verify etcd cluster is healthy (all 3 members)
      shell: |
        ETCDCTL_API=3 etcdctl \
          --endpoints={{ etcd_endpoints }} \
          --cacert={{ etcd_cert_dir }}/ca.crt \
          --cert={{ etcd_cert_dir }}/server.crt \
          --key={{ etcd_cert_dir }}/server.key \
          endpoint health --write-out=json
      register: etcd_prefault_health
      delegate_to: "{{ groups['etcd'][0] }}"
      run_once: true

    - name: Save prefault etcd health
      copy:
        dest: "{{ results_dir }}/etcd_health_prefault.json"
        content: "{{ etcd_prefault_health.stdout }}"
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

  roles:
    - role: metrics-collect

- name: S19 — Configure cp1 API server to use etcd1 only (preference)
  hosts: cp1
  gather_facts: no
  vars:
    scenario_id: s19
  tasks:
    - name: Backup kube-apiserver manifest
      copy:
        src: /etc/kubernetes/manifests/kube-apiserver.yaml
        dest: /etc/kubernetes/manifests/kube-apiserver.yaml.bak
        remote_src: yes

    - name: Set cp1 API server to prefer etcd1 endpoint
      shell: |
        # Replace the full etcd endpoint list with etcd1 only
        sed -i "s|--etcd-servers=.*|--etcd-servers=https://{{ hostvars['etcd1']['ansible_host'] }}:2379|g" \
          /etc/kubernetes/manifests/kube-apiserver.yaml

    - name: Wait for cp1 API server to restart
      wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 5
        timeout: 60

- name: S19 — Isolate etcd1 from etcd2 and etcd3
  hosts: etcd1
  gather_facts: no
  vars:
    scenario_id: s19
  tasks:
    - name: Block etcd1 peer communication to etcd2 and etcd3
      iptables:
        chain: OUTPUT
        destination: "{{ item }}"
        destination_port: 2380
        protocol: tcp
        jump: DROP
        comment: "fault-inject-quorum-split-{{ scenario_id }}"
      loop:
        - "{{ hostvars['etcd2']['ansible_host'] }}"
        - "{{ hostvars['etcd3']['ansible_host'] }}"

    - name: Also block client port to force etcd1 off quorum writes
      iptables:
        chain: INPUT
        source: "{{ item }}"
        source_port: 2380
        protocol: tcp
        jump: DROP
        comment: "fault-inject-quorum-split-{{ scenario_id }}"
      loop:
        - "{{ hostvars['etcd2']['ansible_host'] }}"
        - "{{ hostvars['etcd3']['ansible_host'] }}"

    - debug:
        msg: "etcd1 isolated from peers — etcd2+etcd3 retain quorum, etcd1 loses writes"

- name: S19 — Observe split-quorum behavior
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s19
  tasks:
    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: split_t30 }

    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: split_t60 }

    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: split_t120 }

- name: S19 — Compare API server responses across split
  hosts: "{{ groups['observer'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s19
  tasks:
    - name: Query cp1 (backed by isolated etcd1) for node list
      shell: |
        curl -sk \
          --cert /tmp/admin-client.crt --key /tmp/admin-client.key \
          --cacert /tmp/k8s-ca.crt \
          https://{{ hostvars['cp1']['ansible_host'] }}:6443/api/v1/nodes \
          | jq '{source: "cp1_etcd1", resourceVersion: .metadata.resourceVersion,
                 nodeCount: (.items | length)}'
      register: cp1_node_view
      ignore_errors: yes

    - name: Query cp2 (backed by etcd2+etcd3 quorum) for node list
      shell: |
        curl -sk \
          --cert /tmp/admin-client.crt --key /tmp/admin-client.key \
          --cacert /tmp/k8s-ca.crt \
          https://{{ hostvars['cp2']['ansible_host'] }}:6443/api/v1/nodes \
          | jq '{source: "cp2_etcd2_3", resourceVersion: .metadata.resourceVersion,
                 nodeCount: (.items | length)}'
      register: cp2_node_view
      ignore_errors: yes

    - name: Save API divergence measurement
      copy:
        dest: "{{ results_dir }}/api_divergence_during_split.json"
        content: |
          {
            "cp1_view": {{ cp1_node_view.stdout | default('null') }},
            "cp2_view": {{ cp2_node_view.stdout | default('null') }}
          }

- name: S19 — Test write behavior under split quorum
  hosts: "{{ groups['observer'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s19
  tasks:
    - name: Attempt write via cp1 (etcd1 — no quorum — should fail)
      shell: |
        START=$(date +%s%3N)
        RESULT=$(curl -sk -X PATCH \
          --cert /tmp/admin-client.crt --key /tmp/admin-client.key \
          --cacert /tmp/k8s-ca.crt \
          -H "Content-Type: application/merge-patch+json" \
          https://{{ hostvars['cp1']['ansible_host'] }}:6443/api/v1/namespaces/default/configmaps/kube-proxy \
          -d '{"metadata":{"annotations":{"s19-write-test":"cp1"}}}' \
          -w "\n%{http_code}" 2>/dev/null)
        END=$(date +%s%3N)
        echo "{\"via\": \"cp1\", \"http_code\": $(echo $RESULT | tail -1), \"latency_ms\": $((END-START))}"
      register: cp1_write_test
      ignore_errors: yes

    - name: Attempt write via cp2 (etcd2+etcd3 — has quorum — should succeed)
      shell: |
        START=$(date +%s%3N)
        RESULT=$(curl -sk -X PATCH \
          --cert /tmp/admin-client.crt --key /tmp/admin-client.key \
          --cacert /tmp/k8s-ca.crt \
          -H "Content-Type: application/merge-patch+json" \
          https://{{ hostvars['cp2']['ansible_host'] }}:6443/api/v1/namespaces/default/configmaps/kube-proxy \
          -d '{"metadata":{"annotations":{"s19-write-test":"cp2"}}}' \
          -w "\n%{http_code}" 2>/dev/null)
        END=$(date +%s%3N)
        echo "{\"via\": \"cp2\", \"http_code\": $(echo $RESULT | tail -1), \"latency_ms\": $((END-START))}"
      register: cp2_write_test
      ignore_errors: yes

    - name: Save write test results
      copy:
        dest: "{{ results_dir }}/write_tests_during_split.json"
        content: |
          [{{ cp1_write_test.stdout | default('null') }}, {{ cp2_write_test.stdout | default('null') }}]

- name: S19 — Restore etcd quorum
  hosts: etcd1
  gather_facts: no
  vars:
    scenario_id: s19
  tasks:
    - name: Remove isolation rules
      shell: |
        iptables-save | grep -v "fault-inject-quorum-split-{{ scenario_id }}" \
          | iptables-restore

- name: S19 — Restore cp1 API server to full etcd endpoint list
  hosts: cp1
  gather_facts: no
  vars:
    scenario_id: s19
  tasks:
    - name: Restore kube-apiserver manifest from backup
      copy:
        src: /etc/kubernetes/manifests/kube-apiserver.yaml.bak
        dest: /etc/kubernetes/manifests/kube-apiserver.yaml
        remote_src: yes

    - name: Wait for cp1 API server to recover
      wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 5
        timeout: 90

- name: S19 — Post-restoration snapshots
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s19
  tasks:
    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_restore_t30 }

    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_restore_t90 }

- name: S19 — Invariant report
  hosts: "{{ groups['observer'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s19
  tasks:
    - script: ../../scripts/check-invariants.sh {{ results_dir }}
      register: r
    - copy:
        dest: "{{ results_dir }}/invariant_report.txt"
        content: "{{ r.stdout }}"
