---
# scenarios/s6/run-one.yml
# Executes one iteration of the repeat-run study.
# Resets the cluster state, runs S2 fault injection, then captures the
# final recovery state for comparison.

- name: "S6 Run {{ run_number }} — Reset cluster to clean state"
  hosts: k8s_cluster
  gather_facts: no
  tasks:
    - name: Delete and recreate test deployments to reset ownership state
      shell: |
        kubectl delete deployment nginx-stateless --ignore-not-found
        kubectl delete statefulset postgres-stateful --ignore-not-found
        sleep 10
      delegate_to: "{{ groups['control_plane'][0] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Redeploy test workloads
      include_role:
        name: k8s-install
        tasks_from: deploy-workloads.yml
      when: inventory_hostname == groups['control_plane'][0]

    - name: Wait for all pods to be Running
      shell: |
        kubectl wait --for=condition=ready pod -l app=nginx-stateless \
          --timeout=90s 2>/dev/null
      delegate_to: "{{ groups['control_plane'][0] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      retries: 3
      delay: 10
      register: r
      until: r.rc == 0

- name: "S6 Run {{ run_number }} — Start the continuous 1 Hz observer trace"
  # The trace calls go in run-one.yml, not in playbook.yml, because run-one.yml
  # IS S6's unit of repetition. playbook.yml imports it five times and
  # scripts/repeat-scenario.sh drives it K times directly; wrapping the trace
  # around the five imports would produce ONE recorder for the whole study,
  # whose 1 Hz JSONL would span five faults, five resets and roughly 25 minutes
  # of pauses — well past trace_max_seconds — and would be attributed to a
  # single scenario_id. Per-iteration is also what the analysis wants: each
  # iteration already carries its own scenario_id (s6_run<N>), its own
  # results_dir (run_results_dir) and therefore its own trace file name, so the
  # five traces are directly comparable, which is the whole point of S6.
  #
  # Started here, before the pre-fault snapshot of THIS iteration.
  #
  # results_dir is overridden exactly as the snapshot plays below override it,
  # so trace_meta.json / trace.jsonl land in results/s6/<run_id>/run_<N>/ and
  # not in a parallel results/s6_run<N> tree.
  #
  # metrics_mode is set in the include's `vars:` and NEVER as a play var — a
  # play-level metrics_mode would leak into every snapshot call in the play and
  # silence it. See the header of roles/metrics-collect/tasks/main.yml.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: "s6_run{{ run_number }}"
    results_dir: "{{ run_results_dir }}"
  tasks:
    - include_role: { name: metrics-collect }
      vars: { metrics_mode: trace-start }

- name: "S6 Run {{ run_number }} — Pre-fault snapshot"
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: "s6_run{{ run_number }}"
    snapshot_label: pre_fault
    # Override results_dir so the inner plays write into the
    # per-run subdir set by the outer playbook, not into a parallel
    # results/s6_runN tree.
    results_dir: "{{ run_results_dir }}"
  roles:
    - role: metrics-collect

- name: "S6 Run {{ run_number }} — Inject asymmetric worker isolation"
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: "s6_run{{ run_number }}"
    fault_type: network_asymmetric
    target_host: worker1
    direction: outbound
    peer_hosts:
      - cp1
      - cp2
      - cp3
  roles:
    - role: fault-inject

- name: "S6 Run {{ run_number }} — Wait for eviction window"
  hosts: localhost
  gather_facts: no
  tasks:
    - pause:
        seconds: 150   # enough to trigger node-not-ready + pod eviction

- name: "S6 Run {{ run_number }} — Mid-fault snapshot"
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: "s6_run{{ run_number }}"
    snapshot_label: mid_fault
    results_dir: "{{ run_results_dir }}"
  roles:
    - role: metrics-collect

- name: "S6 Run {{ run_number }} — Clear sticky unreachable state before lifting"
  # REVIEW.md D20: an unreachable marker is sticky across plays, so a worker
  # lost to an ssh hiccup during the isolation window would be dropped from the
  # Lift fault play below and stay partitioned — for this iteration AND every
  # one after it, since this file runs five times.
  hosts: localhost
  gather_facts: no
  tasks:
    - meta: clear_host_errors

- name: "S6 Run {{ run_number }} — Lift fault"
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: "s6_run{{ run_number }}"
    fault_type: teardown
  roles:
    - role: fault-inject

- name: "S6 Run {{ run_number }} — Wait for convergence"
  hosts: localhost
  gather_facts: no
  tasks:
    - pause:
        seconds: 120

- name: "S6 Run {{ run_number }} — Post-recovery snapshot"
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: "s6_run{{ run_number }}"
    snapshot_label: post_recovery
    results_dir: "{{ run_results_dir }}"
  roles:
    - role: metrics-collect

- name: "S6 Run {{ run_number }} — Stop the continuous 1 Hz observer trace"
  # After this iteration's fault has been lifted ("Lift fault" above) and after
  # its last snapshot (post_recovery), so the trace spans the whole iteration
  # and a failure in here cannot leave worker1's outbound DROP rules in place.
  #
  # Before the final extraction play rather than after it, so one flaky kubectl
  # on cp1 cannot cost the iteration its trace. If it is skipped anyway, the
  # recorder still ends on its own monotonic deadline, writes only to this
  # ITERATION's file name (scenario_id is s6_run<N>), and is reaped by the next
  # iteration's trace-start.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: "s6_run{{ run_number }}"
    results_dir: "{{ run_results_dir }}"
  tasks:
    - include_role: { name: metrics-collect }
      vars: { metrics_mode: trace-stop }

- name: "S6 Run {{ run_number }} — Extract final state for comparison"
  hosts: "{{ groups['control_plane'][0] }}"
  gather_facts: no
  tasks:
    - name: Capture final pod placement
      shell: |
        kubectl get pods --all-namespaces -o json \
          | jq '[.items[] | {name: .metadata.name, node: .spec.nodeName, phase: .status.phase}]'
      register: final_pod_placement
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Capture final lease holder
      shell: |
        kubectl get lease kube-controller-manager -n kube-system -o json \
          | jq '.spec.holderIdentity'
      register: final_lease_holder
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Write run summary
      copy:
        dest: "{{ run_results_dir }}/run_summary.json"
        content: |
          {
            "run_number": {{ run_number }},
            "final_pod_placement": {{ final_pod_placement.stdout }},
            "final_lease_holder": {{ final_lease_holder.stdout }}
          }
      delegate_to: "{{ groups['observer'][0] }}"
