---
# scenarios/s6/playbook.yml
# S6: Repeat-run recovery study
#
# Runs the inner cycle (run-one.yml) five times in sequence, resetting
# between iterations. Each iteration writes its snapshots and
# run_summary.json into results/s6/<run_id>/run_<N>/. The cross-run
# comparison is done by scripts/aggregate-results.sh.
#
# Why five hard-coded imports?
#   Ansible does not support looping `import_playbook`, and the inner
#   file is a multi-play playbook (each play targets a different host
#   group), so it cannot be converted to `include_tasks`. Five explicit
#   imports is the simplest form that keeps the inner file intact and
#   still gets parsed at playbook-import time. To change the repeat
#   count, edit the imports below.

- name: S6 — Set up repeat-run study
  hosts: "{{ groups['observer'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s6
    scenario_name: "Repeat-run recovery study"
    repeat_count: 5
  tasks:
    - name: Create per-run results directories
      file:
        path: "{{ results_dir }}/run_{{ item }}"
        state: directory
        mode: '0755'
      loop: "{{ range(1, repeat_count | int + 1) | list }}"

    - name: Initialize comparison manifest
      copy:
        dest: "{{ results_dir }}/run_comparison.json"
        content: "[]"

# ── Five iterations of run-one.yml ─────────────────────────────────────────
# `import_playbook` accepts `vars:` (since Ansible 2.11). Each iteration
# pins its own run_number and run_results_dir so the inner plays write to
# results/s6/<run_id>/run_<N>/.

- import_playbook: run-one.yml
  vars:
    run_number: 1
    run_results_dir: "{{ results_base }}/s6/{{ run_id }}/run_1"

- import_playbook: run-one.yml
  vars:
    run_number: 2
    run_results_dir: "{{ results_base }}/s6/{{ run_id }}/run_2"

- import_playbook: run-one.yml
  vars:
    run_number: 3
    run_results_dir: "{{ results_base }}/s6/{{ run_id }}/run_3"

- import_playbook: run-one.yml
  vars:
    run_number: 4
    run_results_dir: "{{ results_base }}/s6/{{ run_id }}/run_4"

- import_playbook: run-one.yml
  vars:
    run_number: 5
    run_results_dir: "{{ results_base }}/s6/{{ run_id }}/run_5"
