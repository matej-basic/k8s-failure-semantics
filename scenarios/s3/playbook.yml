---
# scenarios/s3/playbook.yml
# S3: etcd write-latency degradation
#
# What it does:
#   Injects 800ms ± 200ms latency on all writes through Toxiproxy fronting etcd.
#   Reads remain available. Controllers continue reconciling against stale state.
#
# What we measure:
#   - etcd revision advancement rate (does it slow to a crawl?)
#   - Controller reconciliation lag (object version acted on vs current revision)
#   - Whether stale-state actuation produces semantic inconsistencies (I5)
#   - API server request latency and error rate
#   - Whether the system degrades gracefully or produces contradictory actions
#   - Time before etcd leader election is disrupted by write timeouts

- name: S3 — Start the continuous 1 Hz observer trace
  # REVIEW.md M1/M2/M4 — this play is what makes that measurement chain live.
  # metrics-collect's snapshot path is a 30-60 s grid, but the mechanisms this
  # suite studies (15 s lease duration, 10 s renew, ~40 s node-monitor grace,
  # sub-second endpoint and kube-proxy propagation) are all faster than it. The
  # continuous ~1 Hz recorder is therefore started HERE, before the baseline
  # snapshot, so its JSONL spans the whole fault window and opens with a
  # pre-fault stretch to compare against.
  #
  # It is also the only thing that creates the in-cluster informer observer:
  # without a trace that observer records as informer_absent in every snapshot,
  # and every VIOLATED verdict comes back with duration_s: null.
  #
  # metrics_mode is set in the include's `vars:` and NEVER as a play var — a
  # play-level metrics_mode would leak into every snapshot call in the play and
  # silence it. See the header of roles/metrics-collect/tasks/main.yml.
  #
  # Purely additive: the recorder is detached, bounded by its own monotonic
  # deadline and by timeout(1), and reaped on the next scenario's start.
  # Nothing about this scenario's existing snapshots or fault timing changed.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s3
  tasks:
    - include_role: { name: metrics-collect }
      vars: { metrics_mode: trace-start }

- name: S3 — Pre-flight baseline
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s3
    scenario_name: "etcd write-latency degradation"
    snapshot_label: pre_fault
  tasks:
    - name: Verify cluster healthy
      shell: kubectl get nodes --no-headers | grep -c Ready
      register: ready_count
      delegate_to: "{{ groups['control_plane'][0] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      failed_when: ready_count.stdout | int < 6
      ignore_unreachable: yes
      retries: 3
      delay: 5
      until: ready_count is succeeded

    - name: Record baseline etcd write latency (uninjected)
      # `time` is a bash reserved word, not a command — its output goes to
      # fd 2 of the shell itself, which `2>&1` on the pipeline cannot
      # redirect. Wrapping `time …` in a brace group `{ … ; } 2>&1` makes
      # 2>&1 apply to the group, so the timing output is finally captured
      # and the `grep real` downstream sees it.
      shell: |
        { time ETCDCTL_API=3 etcdctl \
            --endpoints={{ etcd_endpoints }} \
            --cacert={{ etcd_cert_dir }}/ca.crt \
            --cert={{ etcd_cert_dir }}/server.crt \
            --key={{ etcd_cert_dir }}/server.key \
            put /k8s-test/baseline "$(date -u +%s%N)" ; } 2>&1 | grep real
      register: baseline_write_latency
      delegate_to: "{{ groups['etcd'][0] }}"
      run_once: true

    - name: Save baseline latency
      copy:
        dest: "{{ results_dir }}/baseline_write_latency.txt"
        content: "{{ baseline_write_latency.stdout }}"
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

    - name: Create results directory
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

  roles:
    - role: metrics-collect

- name: S3 — Inject etcd write latency via Toxiproxy
  hosts: etcd
  gather_facts: no
  vars:
    scenario_id: s3
    fault_type: etcd_latency
    latency_ms: 800
    latency_jitter_ms: 200
    toxicity: 1.0
  roles:
    - role: fault-inject

- name: S3 — Start continuous write-latency probe in background
  hosts: "{{ groups['etcd'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s3
  tasks:
    - name: Install write-latency probe script
      copy:
        dest: /tmp/write-probe.sh
        mode: '0755'
        content: |
          #!/bin/bash
          OUT="{{ results_dir }}/write_latency_probe.jsonl"
          while true; do
            START=$(date +%s%N)
            ETCDCTL_API=3 etcdctl \
              --endpoints={{ etcd_endpoints }} \
              --cacert={{ etcd_cert_dir }}/ca.crt \
              --cert={{ etcd_cert_dir }}/server.crt \
              --key={{ etcd_cert_dir }}/server.key \
              put /k8s-test/probe "$(date -u +%s%N)" > /dev/null 2>&1
            RC=$?
            END=$(date +%s%N)
            MS=$(( (END - START) / 1000000 ))
            echo "{\"ts\": \"$(date -u +%H:%M:%S)\", \"latency_ms\": $MS, \"rc\": $RC}" >> $OUT
            sleep 2
          done

    - name: Run write-latency probe in background
      shell: nohup /tmp/write-probe.sh > /dev/null 2>&1 &
      async: 0
      poll: 0

- name: S3 — Observer snapshots during fault window
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s3
  tasks:
    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_30 }

    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_60 }

    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_120 }

    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_180 }

- name: S3 — Measure reconciliation lag (resource version drift)
  hosts: "{{ groups['control_plane'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s3
  tasks:
    - name: Compare etcd revision vs controller cache resource version
      shell: |
        ETCD_REV=$(ETCDCTL_API=3 etcdctl \
          --endpoints={{ etcd_endpoints }} \
          --cacert={{ etcd_cert_dir }}/ca.crt \
          --cert={{ etcd_cert_dir }}/server.crt \
          --key={{ etcd_cert_dir }}/server.key \
          endpoint status --write-out=json | jq '.[0].Status.header.revision')
        CM_RV=$(kubectl get pods --all-namespaces -o jsonpath='{.metadata.resourceVersion}')
        echo "{\"etcd_revision\": $ETCD_REV, \"api_resourceVersion\": \"$CM_RV\", \"ts\": \"$(date -u +%H:%M:%S)\"}"
      register: revision_drift
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Save revision drift measurement
      copy:
        dest: "{{ results_dir }}/revision_drift.json"
        content: "{{ revision_drift.stdout }}"
      delegate_to: "{{ groups['observer'][0] }}"

- name: S3 — Clear sticky unreachable state so teardown can run
  # Ansible marks a host unreachable on its first unreachable task, and that
  # marker is STICKY ACROSS PLAYS: the host is silently dropped from every
  # later play, teardown included. On 2026-08-28 S1 lost cp1 to an ssh hiccup
  # mid-fault, its "Tear down partition" play was skipped for that host, and
  # seven DROP rules survived the run — cp1's API server could not reach etcd,
  # the VIP went down with it, and the sweep halted (REVIEW.md D20).
  # localhost is always reachable, so this play is guaranteed to run and to
  # reset that state before the teardown below.
  hosts: localhost
  gather_facts: no
  tasks:
    - meta: clear_host_errors

- name: S3 — Tear down etcd latency
  hosts: etcd:control_plane
  gather_facts: no
  vars:
    scenario_id: s3
    fault_type: teardown
  roles:
    - role: fault-inject

- name: S3 — Stop write-latency probe
  hosts: "{{ groups['etcd'][0] }}"
  gather_facts: no
  tasks:
    # `pkill -f` matches the calling shell's own argv (which contains the
    # literal string "write-probe.sh" as part of the bash -c command line),
    # so the kill terminates the parent shell and Ansible sees rc=-15. The
    # actual probe script is killed regardless. Ignore errors here — this
    # task is best-effort cleanup of a known footgun, matching the same
    # treatment for pkill -f stress-ng / flap-fault.sh in the fault-inject
    # role teardown.
    - shell: pkill -f write-probe.sh 2>/dev/null || true
      ignore_errors: yes

- name: S3 — Post-fault recovery snapshots
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s3
  tasks:
    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_fault_t30 }

    - pause: { seconds: 90 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_fault_t120 }

- name: S3 — Stop the continuous 1 Hz observer trace
  # Placed AFTER this scenario's fault teardown and after its last post-fault
  # snapshot, and BEFORE the invariant report:
  #   - after teardown, because a failure inside metrics collection that
  #     skipped the teardown would leave the fault (iptables DROP rules, tc
  #     qdiscs, toxics) in place and poison every scenario after this one. A
  #     lost trace is recoverable; a stranded fault is not.
  #   - before the invariant report, because trace-stop is what fetches
  #     trace.jsonl back to the observer and writes disagreement_duration.json,
  #     and check-invariants.sh reads both to put duration_s and
  #     first_violation_ts onto the VIOLATED verdicts.
  #
  # trace-stop is idempotent and every step of it is non-fatal, so calling it
  # against a recorder that already hit its own deadline is a no-op. If this
  # play never runs at all — the run aborted earlier — the recorder still ends
  # on its monotonic deadline, is killed by its timeout(1) wrapper, only ever
  # writes to this scenario's own file name, and is reaped by the next
  # scenario's trace-start.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s3
  tasks:
    - include_role: { name: metrics-collect }
      vars: { metrics_mode: trace-stop }

- name: S3 — Invariant report
  hosts: "{{ groups['observer'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s3
  tasks:
    # NOT `script:`. That module copies this one file to a temp dir on the
    # target and runs it from there, so check-invariants.sh's
    # SELF_DIR=$(dirname $0) points at the temp dir and its sibling
    # scripts/violation-duration.sh is not there. Every VIOLATED verdict
    # then came back duration_s: null, reason "violation-duration.sh
    # produced no output" — M4's duration half, dead suite-wide
    # (REVIEW.md D9). Run it in place instead.
    - command: "{{ repo_dir }}/scripts/check-invariants.sh {{ results_dir }}"
      register: r
    - copy:
        dest: "{{ results_dir }}/invariant_report.txt"
        content: "{{ r.stdout }}"
