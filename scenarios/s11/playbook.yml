---
# scenarios/s11/playbook.yml
# S11: Kubelet partition with pod lifecycle divergence
#
# What it does:
#   Blocks worker1's kubelet from reaching the API server only (port 6443).
#   The kubelet continues running all its existing pods. The control plane
#   eventually marks worker1 NotReady and may delete/reschedule pods.
#   The kubelet never receives the deletion signals.
#
# What we measure:
#   - Divergence between pod phase in the API (Terminating/Failed/Gone)
#     and actual container state on the node (running)
#   - Whether the pod is rescheduled and runs in duplicate (I1)
#   - Whether endpoints are cleaned up while pod still serves traffic (I2)
#   - Whether the node-level belief ever reconciles after reconnect (I3)
#   - How long after reconnect before the kubelet receives and acts on deletions

- name: S11 — Start the continuous 1 Hz observer trace
  # REVIEW.md M1/M2/M4 — this play is what makes that measurement chain live.
  # metrics-collect's snapshot path is a 30-60 s grid, but the mechanisms this
  # suite studies (15 s lease duration, 10 s renew, ~40 s node-monitor grace,
  # sub-second endpoint and kube-proxy propagation) are all faster than it. The
  # continuous ~1 Hz recorder is therefore started HERE, before the baseline
  # snapshot, so its JSONL spans the whole fault window and opens with a
  # pre-fault stretch to compare against.
  #
  # It is also the only thing that creates the in-cluster informer observer:
  # without a trace that observer records as informer_absent in every snapshot,
  # and every VIOLATED verdict comes back with duration_s: null.
  #
  # metrics_mode is set in the include's `vars:` and NEVER as a play var — a
  # play-level metrics_mode would leak into every snapshot call in the play and
  # silence it. See the header of roles/metrics-collect/tasks/main.yml.
  #
  # Purely additive: the recorder is detached, bounded by its own monotonic
  # deadline and by timeout(1), and reaped on the next scenario's start.
  # Nothing about this scenario's existing snapshots or fault timing changed.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s11
  tasks:
    - include_role: { name: metrics-collect }
      vars: { metrics_mode: trace-start }

- name: S11 — Pre-flight baseline
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s11
    scenario_name: "Kubelet partition with pod lifecycle divergence"
    snapshot_label: pre_fault
  tasks:
    - name: Create results directory
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

    - name: Record pods running on worker1 before fault
      shell: |
        kubectl get pods --all-namespaces \
          --field-selector spec.nodeName=worker1 -o json \
          | jq '[.items[] | {name: .metadata.name, ns: .metadata.namespace,
                             uid: .metadata.uid, phase: .status.phase}]'
      register: prefault_pods
      delegate_to: "{{ groups['control_plane'][0] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Save pre-fault pod list
      copy:
        dest: "{{ results_dir }}/pods_on_worker1_prefault.json"
        content: "{{ prefault_pods.stdout }}"
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

  roles:
    - role: metrics-collect

- name: S11 — Block kubelet→API port only (not all traffic)
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: s11
  tasks:
    - name: Block worker1 outbound to API server port 6443 only
      # The API VIP must be in this list. worker1's kubelet reaches the API
      # server through keepalived at {{ api_vip }}, not through the individual
      # control-plane addresses, so blocking only cp1/cp2/cp3 leaves the
      # heartbeat path open: in the May 2026 run worker1 stayed Ready=True in
      # all seven snapshots and the scenario measured an undisturbed cluster
      # while still emitting eight invariant verdicts. S2 already carries the
      # same correction as `extra_peer_ips`.
      iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: 6443
        destination: "{{ item }}"
        jump: DROP
        comment: "fault-inject-kubelet-partition-{{ scenario_id }}"
      loop: "{{ (groups['control_plane'] | map('extract', hostvars, 'ansible_host') | list)
                + [api_vip] }}"

    - name: Declare what this fault must observably do
      copy:
        dest: "{{ results_dir }}/scenario_meta.json"
        content: |
          {
            "scenario_id": "{{ scenario_id }}",
            "fault_type": "kubelet_api_partition",
            "efficacy": {
              "target_node": "worker1",
              "require": ["target_node_status_changed"]
            }
          }
      delegate_to: "{{ groups['observer'][0] }}"

    - debug:
        msg: "FAULT INJECTED: kubelet→API blocked on worker1 (port 6443, including the VIP {{ api_vip }})"

- name: S11 — Poll divergence state every 30s
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s11
  tasks:
    # At t+40s the node should be NotReady (past grace period)
    - pause: { seconds: 40 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_40 }

    # At t+70s eviction should begin
    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_70 }

    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_130 }

- name: "S11 — Capture divergence: API view vs node reality"
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: s11
  tasks:
    - name: List actually running containers on worker1 while partitioned
      shell: |
        crictl ps -o json 2>/dev/null \
          | jq '[.containers[] | {
              id: .id,
              name: .metadata.name,
              state: .state,
              pod: .labels."io.kubernetes.pod.name",
              namespace: .labels."io.kubernetes.pod.namespace"
            }]'
      register: node_reality

    - name: Save node-reality snapshot
      copy:
        dest: "{{ results_dir }}/worker1_node_reality_during_partition.json"
        content: "{{ node_reality.stdout }}"
      delegate_to: "{{ groups['observer'][0] }}"

- name: S11 — Compare API view to node reality
  hosts: "{{ groups['control_plane'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s11
  tasks:
    - name: Get API view of worker1 pods
      shell: |
        kubectl get pods --all-namespaces \
          --field-selector spec.nodeName=worker1 -o json \
          | jq '[.items[] | {name: .metadata.name, phase: .status.phase,
                             deletionTimestamp: .metadata.deletionTimestamp}]'
      register: api_pod_view
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Save API pod view
      copy:
        dest: "{{ results_dir }}/worker1_api_view_during_partition.json"
        content: "{{ api_pod_view.stdout }}"
      delegate_to: "{{ groups['observer'][0] }}"

- name: S11 — Lift kubelet partition and measure reconciliation lag
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: s11
  tasks:
    - name: Record time of partition lift
      set_fact:
        partition_lift_ts: "{{ lookup('pipe', 'date -u +%H:%M:%S') }}"

    - name: Remove iptables block
      shell: |
        iptables-save | grep -v "fault-inject-kubelet-partition-{{ scenario_id }}" \
          | iptables-restore

    - name: Save lift timestamp
      copy:
        dest: "{{ results_dir }}/partition_lift_ts.txt"
        content: "{{ partition_lift_ts }}"
      delegate_to: "{{ groups['observer'][0] }}"

- name: S11 — Clear sticky unreachable state so teardown can run
  # Ansible marks a host unreachable on its first unreachable task, and that
  # marker is STICKY ACROSS PLAYS: the host is silently dropped from every
  # later play, teardown included. On 2026-08-28 S1 lost cp1 to an ssh hiccup
  # mid-fault, its "Tear down partition" play was skipped for that host, and
  # seven DROP rules survived the run — cp1's API server could not reach etcd,
  # the VIP went down with it, and the sweep halted (REVIEW.md D20).
  # localhost is always reachable, so this play is guaranteed to run and to
  # reset that state before the teardown below.
  hosts: localhost
  gather_facts: no
  tasks:
    - meta: clear_host_errors

- name: S11 — Capture reconciliation lag after reconnect
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s11
  tasks:
    - pause: { seconds: 15 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_reconnect_t15 }

    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_reconnect_t45 }

    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_reconnect_t105 }

- name: S11 — Stop the continuous 1 Hz observer trace
  # Placed AFTER this scenario's fault teardown and after its last post-fault
  # snapshot, and BEFORE the invariant report:
  #   - after teardown, because a failure inside metrics collection that
  #     skipped the teardown would leave the fault (iptables DROP rules, tc
  #     qdiscs, toxics) in place and poison every scenario after this one. A
  #     lost trace is recoverable; a stranded fault is not.
  #   - before the invariant report, because trace-stop is what fetches
  #     trace.jsonl back to the observer and writes disagreement_duration.json,
  #     and check-invariants.sh reads both to put duration_s and
  #     first_violation_ts onto the VIOLATED verdicts.
  #
  # trace-stop is idempotent and every step of it is non-fatal, so calling it
  # against a recorder that already hit its own deadline is a no-op. If this
  # play never runs at all — the run aborted earlier — the recorder still ends
  # on its monotonic deadline, is killed by its timeout(1) wrapper, only ever
  # writes to this scenario's own file name, and is reaped by the next
  # scenario's trace-start.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s11
  tasks:
    - include_role: { name: metrics-collect }
      vars: { metrics_mode: trace-stop }

- name: S11 — Invariant report
  hosts: "{{ groups['observer'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s11
  tasks:
    # NOT `script:`. That module copies this one file to a temp dir on the
    # target and runs it from there, so check-invariants.sh's
    # SELF_DIR=$(dirname $0) points at the temp dir and its sibling
    # scripts/violation-duration.sh is not there. Every VIOLATED verdict
    # then came back duration_s: null, reason "violation-duration.sh
    # produced no output" — M4's duration half, dead suite-wide
    # (REVIEW.md D9). Run it in place instead.
    - command: "{{ repo_dir }}/scripts/check-invariants.sh {{ results_dir }}"
      register: r
    - copy:
        dest: "{{ results_dir }}/invariant_report.txt"
        content: "{{ r.stdout }}"
