---
# scenarios/s2/playbook.yml
# S2: Asymmetric worker isolation
#
# What it does:
#   worker1 can receive traffic from the control plane, but cannot send
#   traffic back to it. This is the classic "half-open" partition — the
#   kubelet heartbeats time out on the control plane, but worker1 continues
#   receiving (and accepting) pod placements.
#
# What we measure:
#   - Whether the control plane marks worker1 NotReady despite it being alive
#   - Whether pods on worker1 continue running after the node is declared failed
#   - Whether pods are rescheduled to other nodes while originals still run (I1)
#   - Whether endpoints still include worker1's pods after eviction (I2, I3)
#   - Divergence between kubelet local belief and control-plane belief
#
# Control-plane operations run on cp2 (control_plane[1]), not cp1
# (control_plane[0]). cp1 holds the keepalived VIP and is the busiest node;
# its sshd intermittently rejects bursty connections, which derails plays
# that delegate to it. cp2 has the same admin.conf and kubectl.

- name: S2 — Pin postgres-stateful-0 onto worker1
  # I1 (dual ownership) is a StatefulSet-identity property, so the partition
  # target (worker1) must actually host the StatefulSet pod. Cordon the other
  # workers, delete the pod so the StatefulSet reschedules it — with only
  # worker1 schedulable it lands there — then uncordon so the mid-fault
  # replacement can go elsewhere. Runs directly on cp2 (no delegate / no
  # run_once) so a cp1 ssh hiccup cannot abort it.
  hosts: "{{ groups['control_plane'][1] }}"
  gather_facts: no
  vars:
    scenario_id: s2
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Cordon worker2 and worker3 so postgres-stateful-0 can only land on worker1
      shell: kubectl cordon worker2 worker3

    - name: Delete postgres-stateful-0 so the StatefulSet reschedules it onto worker1
      shell: kubectl delete pod postgres-stateful-0 -n default --ignore-not-found --wait=false

    - name: Wait for postgres-stateful-0 to be Running on worker1
      shell: |
        NODE=$(kubectl get pod postgres-stateful-0 -n default -o jsonpath='{.spec.nodeName}' 2>/dev/null)
        PHASE=$(kubectl get pod postgres-stateful-0 -n default -o jsonpath='{.status.phase}' 2>/dev/null)
        echo "node=$NODE phase=$PHASE"
        test "$NODE" = "worker1" -a "$PHASE" = "Running"
      retries: 30
      delay: 6
      register: pg_placement
      until: pg_placement.rc == 0

    - name: Uncordon worker2 and worker3
      shell: kubectl uncordon worker2 worker3

- name: S2 — Pre-flight baseline
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s2
    scenario_name: "Asymmetric worker isolation"
    snapshot_label: pre_fault
  tasks:
    - name: Verify cluster is healthy
      shell: kubectl get nodes --no-headers | grep -v Ready | wc -l
      register: not_ready_count
      delegate_to: "{{ groups['control_plane'][1] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      failed_when: not_ready_count.stdout | int > 0

    - name: Create results directory
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

    - name: Record which pods are running on worker1 before fault
      shell: |
        kubectl get pods --all-namespaces \
          --field-selector spec.nodeName=worker1 -o json \
          | jq '[.items[] | {name: .metadata.name, namespace: .metadata.namespace, phase: .status.phase}]'
      register: worker1_pods_prefault
      delegate_to: "{{ groups['control_plane'][1] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Save pre-fault pod list
      copy:
        dest: "{{ results_dir }}/worker1_pods_prefault.json"
        content: "{{ worker1_pods_prefault.stdout }}"
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

  roles:
    - role: metrics-collect

- name: S2 — Inject outbound block on worker1 (cannot reach control plane)
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: s2
    fault_type: network_asymmetric
    target_host: worker1
    direction: outbound
    peer_hosts:
      - cp1
      - cp2
      - cp3
      - etcd1
      - etcd2
      - etcd3
    # The kubelet reaches the apiserver through the keepalived VIP, not the
    # cp node IPs directly — so the VIP must be blocked too, or worker1
    # keeps heartbeating and never goes NotReady.
    extra_peer_ips:
      - "{{ api_vip }}"
  roles:
    - role: fault-inject

- name: S2 — Poll observer state, force-delete mid-fault, observe dual ownership
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s2
  tasks:
    # t+30 / t+60: partition active, worker1 transitioning to NotReady
    # (node-monitor-grace-period is ~40s; the VIP is now blocked so the
    # heartbeat genuinely stops).
    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_30 }

    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_60 }

    # ── The trigger ─────────────────────────────────────────────────────
    # By t+60 worker1 is NotReady and partitioned — its kubelet cannot be
    # reached to stop the pod. Force-deleting postgres-stateful-0 removes
    # the pod object from the API, so the StatefulSet controller instantly
    # recreates it on a healthy worker (worker2/3, uncordoned in pre-flight)
    # — WHILE the original keeps running on worker1. That is the dual
    # ownership. Kubernetes never creates the second copy on its own:
    # StatefulSet is at-most-one by design, the pod just sits Terminating.
    # The force-delete is the documented operator footgun that breaks it,
    # so without this step I1 cannot be violated.
    - name: Force-delete postgres-stateful-0 (operator cleanup of the stuck pod)
      shell: kubectl delete pod postgres-stateful-0 -n default --force --grace-period=0 --wait=false
      delegate_to: "{{ groups['control_plane'][1] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # t+120 onward: the recreated postgres-stateful-0 is Running on a
    # healthy worker; the original is still Running on partitioned worker1.
    # crictl on both nodes sees the same identity -> I1 VIOLATED.
    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_120 }

    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_180 }

    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_240 }

- name: "S2 — Capture node-local container truth on worker1 during partition"
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: s2
  tasks:
    - name: List actually-running containers on worker1 during partition
      shell: |
        crictl ps -o json | jq '[.containers[] | {name: .metadata.name, state: .state, podName: .labels."io.kubernetes.pod.name"}]'
      register: worker1_actual_containers

    - name: Save worker1 actual container state
      copy:
        dest: "{{ results_dir }}/worker1_actual_containers_during_fault.json"
        content: "{{ worker1_actual_containers.stdout }}"
      delegate_to: "{{ groups['observer'][0] }}"

- name: S2 — Tear down asymmetric block
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: s2
    fault_type: teardown
  roles:
    - role: fault-inject

- name: S2 — Post-fault recovery snapshots
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s2
  tasks:
    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_fault_t30 }

    - pause: { seconds: 90 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_fault_t120 }

    - pause: { seconds: 120 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_fault_t240 }

- name: S2 — Invariant report
  hosts: "{{ groups['observer'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s2
  tasks:
    - script: ../../scripts/check-invariants.sh {{ results_dir }}
      register: invariant_report
    - copy:
        dest: "{{ results_dir }}/invariant_report.txt"
        content: "{{ invariant_report.stdout }}"
    - copy:
        dest: "{{ results_dir }}/invariant_report.json"
        content: "{{ invariant_report.stdout }}"
