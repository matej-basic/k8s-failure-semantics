---
# scenarios/s2/playbook.yml
# S2: Asymmetric worker isolation
#
# What it does:
#   worker1 can receive traffic from the control plane, but cannot send
#   traffic back to it. This is the classic "half-open" partition — the
#   kubelet heartbeats time out on the control plane, but worker1 continues
#   receiving (and accepting) pod placements.
#
# What we measure:
#   - Whether the control plane marks worker1 NotReady despite it being alive
#   - Whether pods on worker1 continue running after the node is declared failed
#   - Whether pods are rescheduled to other nodes while originals still run (I1)
#   - Whether endpoints still include worker1's pods after eviction (I2, I3)
#   - Divergence between kubelet local belief and control-plane belief
#   - Whether the two copies of postgres-stateful-0 write to the SAME volume
#     concurrently, with nothing fencing either of them
#
# Why the last one exists:
#   Dual ownership on its own is a weak result. Two pods with the same name and
#   two private scratch disks is a naming collision, and a reviewer is right to
#   say that is not a correctness violation. The workload therefore mounts an
#   NFS-backed PersistentVolume (roles/nfs-server) instead of an emptyDir. NFS
#   carries no node affinity, so the replacement pod still schedules on a
#   healthy worker — but it now mounts the same bytes the isolated original is
#   still writing. Both copies append identified, timestamped records to one
#   append-only ledger on that volume; this scenario collects the ledger and
#   the overlap between the two writers' intervals as evidence. The result S2
#   reports becomes "two live processes wrote to the same volume with no
#   fencing", which is a correctness violation by any definition.
#
# Control-plane operations run on cp2 (control_plane[1]), not cp1
# (control_plane[0]). cp1 holds the keepalived VIP and is the busiest node;
# its sshd intermittently rejects bursty connections, which derails plays
# that delegate to it. cp2 has the same admin.conf and kubectl.

- name: S2 — Ensure the shared NFS volume exists
  # Applied, not assumed. The fleet is destroyed and recreated constantly, so
  # the export has to be reconstructible by playbook and can never be a
  # hand-made artefact on one VM. roles/nfs-server installs the server on the
  # export host, installs nfs-common on every node that might mount it (the
  # kubelet mounts with the host's mount.nfs, not with anything in the
  # container), and publishes a PersistentVolume with no node affinity. The
  # role is idempotent end to end, so on a cluster that already has it this
  # play is a no-op beyond the package and exportfs checks.
  #
  # The export host is worker3 — chosen, not defaulted. It cannot be worker1,
  # which is the node this scenario partitions. It cannot be any control-plane
  # or etcd host either, because the injection below blocks worker1's outbound
  # traffic to cp1, cp2, cp3, etcd1-5 and the API VIP: an export behind any of
  # those is severed from the isolated copy the instant the fault lands, the
  # ledger records one writer instead of two, and the scenario proves nothing.
  # That leaves worker2 and worker3; worker3 is the only host in the fleet no
  # scenario in the suite network-partitions. Full reasoning lives in
  # roles/nfs-server/defaults/main.yml.
  hosts: k8s_cluster
  gather_facts: no
  vars:
    scenario_id: s2
    nfs_server_host: worker3
  roles:
    - role: nfs-server

- name: S2 — Assert the running workload is the one this scenario measures
  # REVIEW.md D8. This play applies roles/nfs-server, which creates and binds
  # the shared PV/PVC — but the StatefulSet itself is only ever applied by
  # playbooks/setup-cluster.yml, at cluster build time. On a cluster built
  # before the NFS enrichment landed, S2 therefore sets up a shared volume that
  # the running pod does not mount, and measures the old single-container
  # emptyDir workload: no divergence-writer sidecar, an empty ledger, and a
  # verdict drawn from a file nothing could write to.
  #
  # Assert rather than kubectl apply here on purpose. Deploying the workload is
  # setup-cluster.yml's job; a scenario that quietly re-applies manifests
  # mid-suite would make every later scenario's starting state depend on which
  # scenarios ran before it. Naming the mismatch and stopping is both cheaper
  # and more honest than measuring the wrong thing.
  hosts: "{{ groups['control_plane'][1] }}"
  gather_facts: no
  vars:
    scenario_id: s2
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Read the running postgres-stateful pod template
      shell: |
        kubectl get statefulset postgres-stateful -n default -o json \
          | jq -c '{containers:  [.spec.template.spec.containers[].name],
                    pvc_volumes: [.spec.template.spec.volumes[]
                                  | select(.persistentVolumeClaim)
                                  | .persistentVolumeClaim.claimName]}'
      register: s2_running_workload
      changed_when: false

    - name: Fail when the cluster runs an older postgres-stateful than the tree
      vars:
        wl: "{{ s2_running_workload.stdout | from_json }}"
      assert:
        that:
          - "'divergence-writer' in wl.containers"
          - "wl.pvc_volumes | length > 0"
        fail_msg: >-
          The running postgres-stateful does not match
          roles/k8s-install/files/postgres-stateful.yml.
          Running containers={{ wl.containers }}, pvc_volumes={{ wl.pvc_volumes }};
          this scenario needs the divergence-writer sidecar and a
          PVC-backed volume, or its shared-volume evidence is empty and its
          I1 result is a naming collision rather than a correctness violation.
          Re-apply the workload before running S2:
          ansible-playbook -i inventory/hosts.ini playbooks/deploy-workloads.yml
        success_msg: >-
          Running workload matches the tree: containers={{ wl.containers }},
          shared PVC={{ wl.pvc_volumes | join(',') }}.

- name: S2 — Pin postgres-stateful-0 onto worker1
  # I1 (dual ownership) is a StatefulSet-identity property, so the partition
  # target (worker1) must actually host the StatefulSet pod. Cordon the other
  # workers, delete the pod so the StatefulSet reschedules it — with only
  # worker1 schedulable it lands there — then uncordon so the mid-fault
  # replacement can go elsewhere. Runs directly on cp2 (no delegate / no
  # run_once) so a cp1 ssh hiccup cannot abort it.
  hosts: "{{ groups['control_plane'][1] }}"
  gather_facts: no
  vars:
    scenario_id: s2
    # Kept in step with roles/nfs-server/defaults/main.yml. Repeated here
    # rather than inherited because role defaults are not in scope for a play
    # that does not apply the role.
    nfs_server_host: worker3
    nfs_export_path: /srv/nfs/k8s
    nfs_divergence_log: divergence.log
    nfs_owner_file: owner.txt
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Cordon worker2 and worker3 so postgres-stateful-0 can only land on worker1
      shell: kubectl cordon worker2 worker3

    - name: Delete postgres-stateful-0 so the StatefulSet reschedules it onto worker1
      shell: kubectl delete pod postgres-stateful-0 -n default --ignore-not-found --wait=false

    - name: Wait for postgres-stateful-0 to be Running on worker1
      shell: |
        NODE=$(kubectl get pod postgres-stateful-0 -n default -o jsonpath='{.spec.nodeName}' 2>/dev/null)
        PHASE=$(kubectl get pod postgres-stateful-0 -n default -o jsonpath='{.status.phase}' 2>/dev/null)
        echo "node=$NODE phase=$PHASE"
        test "$NODE" = "worker1" -a "$PHASE" = "Running"
      retries: 30
      delay: 6
      register: pg_placement
      until: pg_placement.rc == 0

    - name: Uncordon worker2 and worker3
      shell: kubectl uncordon worker2 worker3

    - name: Reset the divergence ledger on the shared volume
      # Truncated AFTER the pod is pinned, so the ledger opens with exactly one
      # writer. Records written by the pre-pin copy of postgres-stateful-0
      # carry a different pod UID and would otherwise read as a second writer.
      # They would not survive the overlap test — those two intervals are
      # sequential, not concurrent — but scoping the artefact to this run keeps
      # it readable as evidence.
      #
      # Truncating rather than deleting: the sidecars hold the file open in
      # append mode, and a delete would leave both of them writing to an
      # unlinked inode nobody can collect.
      shell: |
        : > {{ nfs_export_path }}/{{ nfs_divergence_log }}
        : > {{ nfs_export_path }}/{{ nfs_owner_file }}
      delegate_to: "{{ nfs_server_host }}"

- name: S2 — Start the continuous 1 Hz observer trace
  # REVIEW.md M1/M2/M4 — this play is what makes that measurement chain live.
  # metrics-collect's snapshot path is a 30-60 s grid, but the mechanisms this
  # suite studies (15 s lease duration, 10 s renew, ~40 s node-monitor grace,
  # sub-second endpoint and kube-proxy propagation) are all faster than it. The
  # continuous ~1 Hz recorder is therefore started HERE, before the baseline
  # snapshot, so its JSONL spans the whole fault window and opens with a
  # pre-fault stretch to compare against.
  #
  # It is also the only thing that creates the in-cluster informer observer:
  # without a trace that observer records as informer_absent in every snapshot,
  # and every VIOLATED verdict comes back with duration_s: null.
  #
  # metrics_mode is set in the include's `vars:` and NEVER as a play var — a
  # play-level metrics_mode would leak into every snapshot call in the play and
  # silence it. See the header of roles/metrics-collect/tasks/main.yml.
  #
  # Purely additive: the recorder is detached, bounded by its own monotonic
  # deadline and by timeout(1), and reaped on the next scenario's start.
  # Nothing about this scenario's existing snapshots or fault timing changed.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s2
  tasks:
    - include_role: { name: metrics-collect }
      vars: { metrics_mode: trace-start }

- name: S2 — Pre-flight baseline
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s2
    scenario_name: "Asymmetric worker isolation"
    snapshot_label: pre_fault
  tasks:
    - name: Verify cluster is healthy
      shell: kubectl get nodes --no-headers | grep -v " Ready" | wc -l
      register: not_ready_count
      delegate_to: "{{ groups['control_plane'][1] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      failed_when: not_ready_count.stdout | int > 0

    - name: Create results directory
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

    - name: Record which pods are running on worker1 before fault
      shell: |
        kubectl get pods --all-namespaces \
          --field-selector spec.nodeName=worker1 -o json \
          | jq '[.items[] | {name: .metadata.name, namespace: .metadata.namespace, phase: .status.phase}]'
      register: worker1_pods_prefault
      delegate_to: "{{ groups['control_plane'][1] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Save pre-fault pod list
      copy:
        dest: "{{ results_dir }}/worker1_pods_prefault.json"
        content: "{{ worker1_pods_prefault.stdout }}"
      delegate_to: "{{ groups['observer'][0] }}"
      run_once: true

  roles:
    - role: metrics-collect

- name: S2 — Inject outbound block on worker1 (cannot reach control plane)
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: s2
    fault_type: network_asymmetric
    target_host: worker1
    direction: outbound
    # cp nodes + every etcd member, derived from the inventory.
    peer_hosts: "{{ ['cp1', 'cp2', 'cp3'] + groups['etcd'] }}"
    # The kubelet reaches the apiserver through the keepalived VIP, not the
    # cp node IPs directly — so the VIP must be blocked too, or worker1
    # keeps heartbeating and never goes NotReady.
    extra_peer_ips:
      - "{{ api_vip }}"
    # What this fault must observably do for the run to count as a measurement.
    # The default for network_asymmetric is target_node_status_changed alone;
    # S2 now asserts more than "worker1 went NotReady", so it declares more.
    #
    # placement_changed is the added one. The enriched claim is that a SECOND
    # copy of postgres-stateful-0 ran on a healthy node while the original kept
    # running on the partitioned one, and wrote to the same volume. If the set
    # of running containers per node never changed against the baseline, the
    # replacement never started — and then the divergence ledger contains one
    # writer, the concurrent window is empty, and every invariant verdict in
    # the run describes an undisturbed cluster. Declaring it here is what makes
    # check-invariants.sh label such a run FAULT_INEFFECTIVE instead of quietly
    # contributing a PRESERVED I1 to the aggregate.
    #
    # Both signal names are ones scripts/check-invariants.sh already computes
    # (see fault_efficacy there).
    efficacy_target_node: worker1
    efficacy_require:
      - target_node_status_changed
      - placement_changed
  roles:
    - role: fault-inject

- name: S2 — Poll observer state, force-delete mid-fault, observe dual ownership
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s2
  tasks:
    # t+30 / t+60: partition active, worker1 transitioning to NotReady
    # (node-monitor-grace-period is ~40s; the VIP is now blocked so the
    # heartbeat genuinely stops).
    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_30 }

    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_60 }

    # ── The trigger ─────────────────────────────────────────────────────
    # By t+60 worker1 is NotReady and partitioned — its kubelet cannot be
    # reached to stop the pod. Force-deleting postgres-stateful-0 removes
    # the pod object from the API, so the StatefulSet controller instantly
    # recreates it on a healthy worker (worker2/3, uncordoned in pre-flight)
    # — WHILE the original keeps running on worker1. That is the dual
    # ownership. Kubernetes never creates the second copy on its own:
    # StatefulSet is at-most-one by design, the pod just sits Terminating.
    # The force-delete is the documented operator footgun that breaks it,
    # so without this step I1 cannot be violated.
    - name: Force-delete postgres-stateful-0 (operator cleanup of the stuck pod)
      shell: kubectl delete pod postgres-stateful-0 -n default --force --grace-period=0 --wait=false
      delegate_to: "{{ groups['control_plane'][1] }}"
      run_once: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # t+120 onward: the recreated postgres-stateful-0 is Running on a
    # healthy worker; the original is still Running on partitioned worker1.
    # crictl on both nodes sees the same identity -> I1 VIOLATED.
    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_120 }

    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_180 }

    - pause: { seconds: 60 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: t_plus_240 }

- name: "S2 — Capture node-local container truth on worker1 during partition"
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: s2
  tasks:
    - name: List actually-running containers on worker1 during partition
      shell: |
        crictl ps -o json | jq '[.containers[] | {name: .metadata.name, state: .state, podName: .labels."io.kubernetes.pod.name"}]'
      register: worker1_actual_containers

    - name: Save worker1 actual container state
      copy:
        dest: "{{ results_dir }}/worker1_actual_containers_during_fault.json"
        content: "{{ worker1_actual_containers.stdout }}"
      delegate_to: "{{ groups['observer'][0] }}"

- name: S2 — Collect the divergent-write evidence from the shared volume
  # Runs while the partition is still up, so the ledger is read at the moment
  # of maximum evidentiary value: the original copy of postgres-stateful-0 is
  # still running on isolated worker1 and the replacement is still running on a
  # healthy worker, both appending to one file on one volume.
  #
  # Read from the NFS server's own filesystem rather than from inside a pod.
  # The export directory IS the volume, so this sees exactly the bytes both
  # kubelets wrote, needs no exec into a container the API may not be able to
  # reach, and cannot itself perturb the workload. The observer is a macOS
  # controller and cannot mount NFS, which is the other reason not to try.
  hosts: workers
  gather_facts: no
  vars:
    scenario_id: s2
    # Kept in step with roles/nfs-server/defaults/main.yml.
    nfs_server_host: worker3
    nfs_export_path: /srv/nfs/k8s
    nfs_divergence_log: divergence.log
    nfs_owner_file: owner.txt
  tasks:
    - name: Collect and analyse the shared-volume write ledger
      when: inventory_hostname == nfs_server_host
      # block/always, and every read marked non-fatal, for one reason: the
      # teardown play is the next thing that runs and it must not be skipped.
      # An aborted play here would leave worker1's iptables DROP rules in
      # place and poison every scenario that follows. Evidence collection is
      # allowed to come back empty; it is never allowed to abort the run.
      block:
        - name: Read the append-only ledger both copies wrote to
          shell: cat {{ nfs_export_path }}/{{ nfs_divergence_log }}
          register: s2_ledger
          changed_when: false
          failed_when: false

        - name: Read the last-writer-wins ownership file
          # A single shared object each copy clobbers once a second. With one
          # writer it is stable; with two it names whichever copy wrote most
          # recently — a conflicting write, captured as a value rather than as
          # an interleaving.
          shell: cat {{ nfs_export_path }}/{{ nfs_owner_file }}
          register: s2_owner
          changed_when: false
          failed_when: false

        - name: Summarise the ledger into divergent-write evidence
          # awk splits the ledger into per-writer intervals keyed by pod UID
          # (both copies carry the SAME pod name — that is the finding — so the
          # UID is what separates them), jq assembles the JSON.
          #
          # The observables:
          #   distinct_pod_uids   > 1 with distinct_pod_names == 1: two
          #                       processes claimed one StatefulSet identity
          #   distinct_nodes      > 1: they ran on different nodes
          #   concurrent_window   the intersection of the writers' intervals.
          #                       Non-empty means they were writing to the same
          #                       file at the same time — nothing fenced either
          #   writer_alternations how many times consecutive records switch
          #                       writer: direct interleaving in one file
          #   torn_records        lines that do not parse. O_APPEND is not
          #                       atomic over NFS, so shredded records are
          #                       themselves evidence of unserialised writers
          shell: |
            set -o pipefail
            LEDGER={{ nfs_export_path }}/{{ nfs_divergence_log }}
            awk '
              {
                ts = $1; uid = ""; node = ""; pod = "";
                for (i = 2; i <= NF; i++) {
                  p = index($i, "=");
                  if (p > 0) {
                    k = substr($i, 1, p - 1); v = substr($i, p + 1);
                    if (k == "uid") uid = v;
                    else if (k == "node") node = v;
                    else if (k == "pod") pod = v;
                  }
                }
                total++;
                if (uid == "" || node == "" || pod == "" || ts !~ /^[0-9][0-9][0-9][0-9]-/) {
                  malformed++;
                  next;
                }
                key = uid "|" node "|" pod;
                if (!(key in cnt)) {
                  nw++; wkey[nw] = key;
                  uidof[key] = uid; nodeof[key] = node; podof[key] = pod;
                  first[key] = ts;
                }
                cnt[key]++;
                last[key] = ts;
                if (prev != "" && prev != key) alt++;
                prev = key;
                valid++;
              }
              END {
                for (j = 1; j <= nw; j++) {
                  k = wkey[j];
                  printf "W\t%s\t%s\t%s\t%d\t%s\t%s\n", uidof[k], nodeof[k], podof[k], cnt[k], first[k], last[k];
                }
                printf "T\t%d\t%d\t%d\t%d\n", total + 0, valid + 0, malformed + 0, alt + 0;
              }
            ' "$LEDGER" \
            | jq -R -s --arg ledger "$LEDGER" '
                (split("\n") | map(select(length > 0) | split("\t"))) as $rows
                | ($rows | map(select(.[0] == "W"))
                         | map({ uid: .[1], node: .[2], pod: .[3],
                                 records: (.[4] | tonumber),
                                 first_ts: .[5], last_ts: .[6] })) as $w
                | ($rows | map(select(.[0] == "T")) | .[0]) as $t
                | ($w | map(.first_ts) | max) as $ws
                | ($w | map(.last_ts)  | min) as $we
                | ($w | map(.uid)  | unique | length) as $nuid
                | ($w | map(.node) | unique | length) as $nnode
                | ($w | map(.pod)  | unique | length) as $npod
                | ($nuid > 1 and $nnode > 1 and $npod == 1 and $ws <= $we) as $unfenced
                | (if $t then ($t[2] | tonumber) else 0 end) as $parsed
                # A ledger nobody wrote to is missing data, not a finding. It
                # used to fall through to SINGLE_WRITER, whose note asserts
                # "the run carries no dual-ownership harm" — a substantive
                # negative conclusion drawn from an empty file (REVIEW.md D8).
                | (if $parsed == 0 then "INSUFFICIENT_DATA"
                   elif $unfenced then "UNFENCED_CONCURRENT_WRITES"
                   elif $nuid > 1 then "SEQUENTIAL_WRITERS"
                   else "SINGLE_WRITER" end) as $verdict
                | {
                    ledger: $ledger,
                    total_records:       (if $t then ($t[1] | tonumber) else 0 end),
                    parsed_records:      (if $t then ($t[2] | tonumber) else 0 end),
                    torn_records:        (if $t then ($t[3] | tonumber) else 0 end),
                    writer_alternations: (if $t then ($t[4] | tonumber) else 0 end),
                    distinct_pod_uids:  $nuid,
                    distinct_nodes:     $nnode,
                    distinct_pod_names: $npod,
                    writers: $w,
                    concurrent_window: {
                      start: (if $unfenced then $ws else null end),
                      end:   (if $unfenced then $we else null end),
                      overlapping: $unfenced
                    },
                    verdict: $verdict,
                    note: "INSUFFICIENT_DATA = no parsed record reached the ledger, so this run measured nothing; check that the running StatefulSet carries the divergence-writer sidecar and mounts the shared PVC. UNFENCED_CONCURRENT_WRITES = one StatefulSet identity, two pod UIDs on two nodes, with overlapping write intervals on one shared volume. SEQUENTIAL_WRITERS = more than one writer, but their intervals did not overlap: identity was reused without concurrent harm. SINGLE_WRITER = exactly one copy wrote, so the run carries no dual-ownership harm."
                  }
              '
          register: s2_divergence
          changed_when: false
          failed_when: false

      always:
        - name: Clear per-host error state so teardown runs everywhere
          # See REVIEW.md D20: an unreachable marker is sticky across plays and
          # would silently skip the teardown steps below.
          meta: clear_host_errors
        - name: Save the raw shared-volume ledger
          copy:
            dest: "{{ results_dir }}/nfs_divergence_ledger.txt"
            content: "{{ s2_ledger.stdout | default('') }}\n"
          delegate_to: "{{ groups['observer'][0] }}"

        - name: Save the divergent-write evidence
          copy:
            dest: "{{ results_dir }}/divergent_writes.json"
            # `, true` on every default here: a task that ran but produced
            # nothing registers an EMPTY stdout, not an undefined one, and a
            # plain default() would let the empty string through.
            content: "{{ s2_divergence.stdout | default('{\"verdict\": \"NO_DATA\", \"note\": \"the ledger could not be read from the NFS export\"}', true) }}"
          delegate_to: "{{ groups['observer'][0] }}"

        - name: Save the last-writer-wins ownership file
          copy:
            dest: "{{ results_dir }}/nfs_owner_last_writer.txt"
            content: "{{ s2_owner.stdout | default('') }}\n"
          delegate_to: "{{ groups['observer'][0] }}"

        - name: Report the divergent-write verdict
          debug:
            msg: >-
              S2 divergent writes:
              {{ (s2_divergence.stdout | default('{}', true) | from_json).verdict | default('NO_DATA', true) }}
          # from_json on unparseable output would raise inside always:, which
          # is the one place a failure must never happen — this whole block
          # exists to keep the teardown play reachable.
          ignore_errors: true

- name: S2 — Clear sticky unreachable state so teardown can run
  # Ansible marks a host unreachable on its first unreachable task, and that
  # marker is STICKY ACROSS PLAYS: the host is silently dropped from every
  # later play, teardown included. On 2026-08-28 S1 lost cp1 to an ssh hiccup
  # mid-fault, its "Tear down partition" play was skipped for that host, and
  # seven DROP rules survived the run — cp1's API server could not reach etcd,
  # the VIP went down with it, and the sweep halted (REVIEW.md D20).
  # localhost is always reachable, so this play is guaranteed to run and to
  # reset that state before the teardown below.
  hosts: localhost
  gather_facts: no
  tasks:
    - meta: clear_host_errors

- name: S2 — Tear down asymmetric block
  hosts: worker1
  gather_facts: no
  vars:
    scenario_id: s2
    fault_type: teardown
  roles:
    - role: fault-inject

- name: S2 — Post-fault recovery snapshots
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s2
  tasks:
    - pause: { seconds: 30 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_fault_t30 }

    - pause: { seconds: 90 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_fault_t120 }

    - pause: { seconds: 120 }
      run_once: true
    - include_role: { name: metrics-collect }
      vars: { snapshot_label: post_fault_t240 }

- name: S2 — Stop the continuous 1 Hz observer trace
  # Placed AFTER this scenario's fault teardown and after its last post-fault
  # snapshot, and BEFORE the invariant report:
  #   - after teardown, because a failure inside metrics collection that
  #     skipped the teardown would leave the fault (iptables DROP rules, tc
  #     qdiscs, toxics) in place and poison every scenario after this one. A
  #     lost trace is recoverable; a stranded fault is not.
  #   - before the invariant report, because trace-stop is what fetches
  #     trace.jsonl back to the observer and writes disagreement_duration.json,
  #     and check-invariants.sh reads both to put duration_s and
  #     first_violation_ts onto the VIOLATED verdicts.
  #
  # trace-stop is idempotent and every step of it is non-fatal, so calling it
  # against a recorder that already hit its own deadline is a no-op. If this
  # play never runs at all — the run aborted earlier — the recorder still ends
  # on its monotonic deadline, is killed by its timeout(1) wrapper, only ever
  # writes to this scenario's own file name, and is reaped by the next
  # scenario's trace-start.
  hosts: k8s_cluster:etcd
  gather_facts: no
  vars:
    scenario_id: s2
  tasks:
    - include_role: { name: metrics-collect }
      vars: { metrics_mode: trace-stop }

- name: S2 — Invariant report
  hosts: "{{ groups['observer'][0] }}"
  gather_facts: no
  vars:
    scenario_id: s2
  tasks:
    # NOT `script:`. That module copies this one file to a temp dir on the
    # target and runs it from there, so check-invariants.sh's
    # SELF_DIR=$(dirname $0) points at the temp dir and its sibling
    # scripts/violation-duration.sh is not there. Every VIOLATED verdict
    # then came back duration_s: null, reason "violation-duration.sh
    # produced no output" — M4's duration half, dead suite-wide
    # (REVIEW.md D9). Run it in place instead.
    - command: "{{ repo_dir }}/scripts/check-invariants.sh {{ results_dir }}"
      register: invariant_report
    - copy:
        dest: "{{ results_dir }}/invariant_report.txt"
        content: "{{ invariant_report.stdout }}"
    - copy:
        dest: "{{ results_dir }}/invariant_report.json"
        content: "{{ invariant_report.stdout }}"
