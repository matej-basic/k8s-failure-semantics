---
# roles/fault-inject/tasks/main.yml
# Dispatcher — include the appropriate fault task file

- name: Declare what this fault must observably do
  # The fault-efficacy assertion. A scenario whose injection misses its target
  # still produces a full set of invariant verdicts, and those verdicts
  # describe an undisturbed cluster — S11 (blocked the control-plane IPs but
  # not the API VIP the kubelet uses) and S12 (flapped cp1 against cp2/cp3
  # while leaving cp1 to etcd open) are both of that kind in the May 2026
  # sweep. check-invariants.sh reads this file and marks a run that fails its
  # own assertion FAULT_INEFFECTIVE. Defaults per fault type live in
  # defaults/main.yml; a scenario overrides with efficacy_require and
  # efficacy_target_node.
  copy:
    dest: "{{ results_dir }}/scenario_meta.json"
    content: |
      {
        "scenario_id": {{ scenario_id | to_json }},
        "fault_type": {{ fault_type | to_json }},
        "efficacy": {
          "target_node": {{ (efficacy_target_node | default(target_host | default(''), true)) | to_json }},
          "require": {{ (efficacy_require | default(fault_efficacy_defaults[fault_type] | default([]), true)) | to_json }}
        }
      }
  delegate_to: "{{ groups['observer'][0] }}"
  run_once: true
  when: fault_type != 'teardown'

- name: Inject network partition fault
  include_tasks: network-partition.yml
  when: fault_type == 'network_partition'

- name: Inject asymmetric network fault
  include_tasks: network-asymmetric.yml
  when: fault_type == 'network_asymmetric'

- name: Inject network delay fault
  include_tasks: network-delay.yml
  when: fault_type == 'network_delay'

- name: Inject network flap fault
  include_tasks: network-flap.yml
  when: fault_type == 'network_flap'

- name: Inject etcd latency via Toxiproxy
  include_tasks: etcd-latency.yml
  when: fault_type == 'etcd_latency'

- name: Inject clock skew
  include_tasks: clock-skew.yml
  when: fault_type == 'clock_skew'

- name: Inject memory pressure
  include_tasks: memory-pressure.yml
  when: fault_type == 'memory_pressure'

- name: Trigger etcd compaction
  include_tasks: etcd-compact.yml
  when: fault_type == 'etcd_compact'

- name: Tear down all faults
  include_tasks: teardown.yml
  when: fault_type == 'teardown'
