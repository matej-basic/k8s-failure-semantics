---
# roles/fault-inject/tasks/network-flap.yml
# Intermittently flap connectivity between target_host and peer_hosts
# Used for S12 (leader election storm)
#
# target_host: host whose connectivity will flap
# peer_hosts: hosts to flap connectivity toward
# flap_interval: legacy symmetric toggle interval (default: 10)
# flap_block_seconds: seconds connectivity stays blocked (default: flap_interval)
# flap_open_seconds: seconds connectivity stays open (default: flap_interval)
# flap_count: number of on/off cycles (default: 6)
# extra_peer_ips: raw IPs to flap that are not inventory hosts — the API VIP

- name: Set flap defaults
  # Blocked and open windows are configured separately because they answer
  # different questions: the blocked window has to outlast the lease duration
  # for the holder to lose it, while the open window only has to be long
  # enough for the lease to be reacquired. A symmetric 10s/10s flap against a
  # 15s lease cannot expire anything.
  set_fact:
    flap_interval: "{{ flap_interval | default(10) }}"
    flap_count: "{{ flap_count | default(6) }}"
    flap_block_seconds: "{{ flap_block_seconds | default(flap_interval | default(10)) }}"
    flap_open_seconds: "{{ flap_open_seconds | default(flap_interval | default(10)) }}"

- name: Resolve peer IPs
  set_fact:
    peer_ips: "{{ (peer_hosts | map('extract', hostvars, 'ansible_host') | list)
                  + (extra_peer_ips | default([])) }}"

- name: Install flap script on target host
  copy:
    dest: /tmp/flap-fault.sh
    mode: '0755'
    content: |
      #!/bin/bash
      PEER_IPS="{{ peer_ips | join(' ') }}"
      BLOCK_FOR={{ flap_block_seconds }}
      OPEN_FOR={{ flap_open_seconds }}
      CYCLES={{ flap_count }}
      TAG="fault-inject-flap-{{ scenario_id }}"

      for i in $(seq 1 $CYCLES); do
        echo "[$(date -u +%H:%M:%S)] Flap cycle $i/$CYCLES — BLOCKING"
        for ip in $PEER_IPS; do
          iptables -A OUTPUT -d $ip -j DROP -m comment --comment "$TAG"
          iptables -A INPUT -s $ip -j DROP -m comment --comment "$TAG"
        done
        sleep $BLOCK_FOR
        echo "[$(date -u +%H:%M:%S)] Flap cycle $i/$CYCLES — UNBLOCKING"
        iptables-save | grep -v "$TAG" | iptables-restore
        sleep $OPEN_FOR
      done
      echo "[$(date -u +%H:%M:%S)] Flap sequence complete"
  when: inventory_hostname == target_host

- name: Run flap script in background on target host
  shell: nohup /tmp/flap-fault.sh > /tmp/flap-fault.log 2>&1 &
  async: 0
  poll: 0
  when: inventory_hostname == target_host

- name: Log flap fault started
  debug:
    msg: "FAULT INJECTED: network flap on {{ target_host }} — {{ flap_count }} cycles of {{ flap_block_seconds }}s blocked / {{ flap_open_seconds }}s open toward {{ peer_ips | join(', ') }}"
  when: inventory_hostname == target_host
