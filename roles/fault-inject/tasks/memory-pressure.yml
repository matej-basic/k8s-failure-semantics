---
# roles/fault-inject/tasks/memory-pressure.yml
# Inject memory pressure on a worker node to trigger kubelet eviction
# Used for S18 (node pressure eviction vs controller rescheduling race)
#
# target_host: worker node to pressurise
# memory_bytes: bytes to allocate (default: 90% of available RAM)
# duration_seconds: how long to hold pressure (default: fault_duration)

- name: Set memory pressure defaults
  set_fact:
    duration_seconds: "{{ duration_seconds | default(fault_duration) }}"

- name: Get available memory on target
  # Leave a fixed headroom BELOW kubelet's eviction threshold, not a percentage
  # above it. This took 85% of MemAvailable, which on a 7 GB worker leaves
  # ~1060 MB free — and kubelet's default hard threshold is
  # memory.available<100Mi, so the pressure never got within 10x of triggering
  # anything. S18 ran five times, fired ZERO efficacy signals, and worker3
  # stayed Ready in every snapshot of every run (REVIEW.md D35).
  #
  # memory_pressure_headroom_kb (default 90 MB) sits just under the 100Mi
  # threshold: enough for kubelet to observe MemoryPressure and start evicting,
  # while not so aggressive that the kernel OOM-killer takes sshd or kubelet
  # before kubelet acts. Raise it if a node ever gets OOM-killed outright —
  # that is a broken run, not a finding.
  shell: |
    awk -v hk={{ memory_pressure_headroom_kb | default(92160) }} \
      '/MemAvailable/ { v = $2 - hk; if (v < 0) v = 0; print int(v) "K" }' /proc/meminfo
  register: avail_mem
  when: inventory_hostname == target_host

- name: Run stress-ng memory stressor in background
  shell: |
    nohup stress-ng --vm 1 --vm-bytes {{ avail_mem.stdout }} \
      --vm-method zero-one --timeout {{ duration_seconds }}s \
      > /tmp/stress-ng.log 2>&1 &
    echo $! > /tmp/stress-ng.pid
  when: inventory_hostname == target_host

- name: Log memory pressure injected
  debug:
    msg: "FAULT INJECTED: memory pressure ({{ avail_mem.stdout }}, leaving {{ memory_pressure_headroom_kb | default(92160) }}K under kubelet's eviction threshold) on {{ target_host }} for {{ duration_seconds }}s"
  when: inventory_hostname == target_host
