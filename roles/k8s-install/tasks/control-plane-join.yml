---
# roles/k8s-install/tasks/control-plane-join.yml
# Joins cp2 and cp3 as additional control plane nodes

- name: Read join command
  set_fact:
    join_cmd: "{{ lookup('file', '/tmp/worker-join.sh') }}"
    cert_key: "{{ lookup('file', '/tmp/cert-key.txt') | trim }}"

- name: Ensure etcd PKI directory exists on this control plane node
  file:
    path: /etc/kubernetes/pki/etcd
    state: directory
    mode: '0755'

- name: Distribute etcd CA cert to this control plane node
  copy:
    src: "/tmp/etcd-pki/ca.crt"
    dest: /etc/kubernetes/pki/etcd/ca.crt
    mode: '0644'

- name: Join as control plane node
  shell: |
    {{ join_cmd }} \
      --control-plane \
      --certificate-key {{ cert_key }} \
      --apiserver-advertise-address {{ ansible_host }}
  args:
    creates: /etc/kubernetes/admin.conf

- name: Set up kubeconfig for root on this node
  shell: |
    mkdir -p $HOME/.kube
    cp /etc/kubernetes/admin.conf $HOME/.kube/config
  args:
    creates: /root/.kube/config
