---
# roles/k8s-install/tasks/deploy-workloads.yml
# Deploys the standard stateless and stateful workloads used by all scenarios.
#
# The manifests live as plain YAML in this role's files/ directory
# (nginx-stateless.yml, postgres-stateful.yml) — edit them there. They are
# applied with `kubectl apply -f -`, fed from the controller via stdin, so
# no copy of the manifest is left on the node.

- name: Apply the stateless nginx workload
  shell: kubectl apply -f -
  args:
    stdin: "{{ lookup('file', 'nginx-stateless.yml') }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Apply the stateful PostgreSQL workload
  shell: kubectl apply -f -
  args:
    stdin: "{{ lookup('file', 'postgres-stateful.yml') }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Wait for stateless deployment to be ready
  shell: |
    kubectl rollout status deployment/nginx-stateless --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  retries: 3
  delay: 10
  register: result
  until: result.rc == 0
