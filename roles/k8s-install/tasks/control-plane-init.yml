---
# roles/k8s-install/tasks/control-plane-init.yml
# Initialises the first control plane node

- name: Ensure etcd PKI directory exists on the control plane
  file:
    path: /etc/kubernetes/pki/etcd
    state: directory
    mode: '0755'
  tags: k8s-init

- name: Copy etcd CA and apiserver etcd-client cert to control plane
  copy:
    src: "/tmp/etcd-pki/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    # External etcd: kubeadm needs the CA plus a client cert/key. The etcd
    # server cert doubles as the apiserver etcd-client cert — it carries no
    # EKU restriction, so it is also valid for clientAuth.
    - { src: ca.crt, dest: /etc/kubernetes/pki/etcd/ca.crt, mode: '0644' }
    - { src: server.crt, dest: /etc/kubernetes/pki/apiserver-etcd-client.crt, mode: '0644' }
    - { src: server.key, dest: /etc/kubernetes/pki/apiserver-etcd-client.key, mode: '0600' }
  tags: k8s-init

- name: Write kubeadm init config
  template:
    src: kubeadm-init.yml.j2
    dest: /tmp/kubeadm-init.yml
  tags: k8s-init

- name: Run kubeadm init
  command: kubeadm init --config /tmp/kubeadm-init.yml --upload-certs
  register: kubeadm_init_output
  args:
    creates: /etc/kubernetes/admin.conf
  tags: k8s-init

- name: Set up kubeconfig for root
  shell: |
    mkdir -p $HOME/.kube
    cp /etc/kubernetes/admin.conf $HOME/.kube/config
    chown root:root $HOME/.kube/config
  args:
    creates: /root/.kube/config

- name: Install Calico CNI
  shell: |
    kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Save join command and certificate key for other nodes
  shell: |
    kubeadm token create --print-join-command > /tmp/worker-join.sh
    # --config is required so kubeadm knows this is external-etcd mode and
    # uploads the secret with external-etcd-* keys instead of stacked-etcd
    # ones. Without it, the cp-join download-certs phase fails.
    kubeadm init phase upload-certs --upload-certs \
        --config /tmp/kubeadm-init.yml 2>/dev/null \
      | tail -1 > /tmp/cert-key.txt
  changed_when: true

- name: Fetch join command to observer
  fetch:
    src: /tmp/worker-join.sh
    dest: /tmp/worker-join.sh
    flat: yes

- name: Fetch cert key to observer
  fetch:
    src: /tmp/cert-key.txt
    dest: /tmp/cert-key.txt
    flat: yes

- name: Fetch admin kubeconfig to observer
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: /tmp/admin.conf
    flat: yes

- name: Deploy test workloads
  include_tasks: deploy-workloads.yml
