---
# roles/metrics-collect/tasks/main.yml
# Dispatcher. This role has two measurement paths and they are deliberately
# different instruments:
#
#   metrics_mode: snapshot     (DEFAULT — tasks/snapshot.yml)
#       One heavyweight cross-section of every observer in the system: etcd
#       members, the bundled control-plane read, per-API-server views, per-node
#       kubelet + crictl truth, and an in-cluster service probe. Costs ~20 SSH
#       sessions and tens of seconds, so scenarios take a handful of them at
#       chosen moments. This is the ORIGINAL behaviour of the role and it is
#       unchanged: a caller that does not set metrics_mode gets exactly what it
#       got before, including the snapshot_index counter.
#
#   metrics_mode: trace-start / trace-stop   (tasks/trace-*.yml)
#       A continuous ~1 Hz recorder that runs detached for the whole scenario
#       and writes JSONL. Added for REVIEW.md M1: the mechanisms under study
#       (15 s lease duration, 10 s renew, ~40 s node-monitor grace, sub-second
#       endpoint and kube-proxy propagation) are all faster than the snapshot
#       grid, so divergence onset and duration were quantised to 30-60 s. The
#       trace resolves them; the snapshots remain the deep cross-sections.
#
# The two are complementary, not alternatives — a scenario runs the trace
# AROUND its snapshots:
#
#     - include_role: { name: metrics-collect }
#       vars: { metrics_mode: trace-start }
#     ... fault, pauses, snapshot calls as before ...
#     - include_role: { name: metrics-collect }
#       vars: { metrics_mode: trace-stop }
#
# Set metrics_mode in the include's `vars:`, NOT in play vars: a play-level
# metrics_mode would leak into every snapshot call in that play and silence it.

- name: Collect one heavyweight observer snapshot
  include_tasks: snapshot.yml
  when: (metrics_mode | default('snapshot')) == 'snapshot'

- name: Start the continuous high-resolution recorder
  include_tasks: trace-start.yml
  when: (metrics_mode | default('snapshot')) == 'trace-start'

- name: Stop the continuous high-resolution recorder and collect its output
  include_tasks: trace-stop.yml
  when: (metrics_mode | default('snapshot')) == 'trace-stop'

- name: Reject an unknown metrics_mode rather than silently collecting nothing
  # A typo in metrics_mode would otherwise make the role a no-op, and a
  # scenario would complete with no snapshots and no trace and no complaint.
  fail:
    msg: >-
      metrics-collect: unknown metrics_mode
      '{{ metrics_mode | default('snapshot') }}'
      (expected one of: snapshot, trace-start, trace-stop)
  when: (metrics_mode | default('snapshot')) not in ['snapshot', 'trace-start', 'trace-stop']
  run_once: true
