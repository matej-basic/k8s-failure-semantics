---
# roles/metrics-collect/tasks/snapshot.yml
# Collects a single observer state snapshot.
# Call repeatedly (via loop + pause) to build a time-indexed trace.
#
# snapshot_label: string label for this snapshot (e.g. 'pre_fault', 't+30', 'post_convergence')
# results_dir: where to write output files

- name: Ensure results directory exists
  file:
    path: "{{ results_dir }}"
    state: directory
    mode: '0755'
  delegate_to: "{{ groups['observer'][0] }}"
  run_once: true

- name: Collect snapshot timestamp
  set_fact:
    snapshot_ts: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
  run_once: true

- name: Advance the per-run snapshot counter
  # Snapshots must be evaluated in the order they were taken. Filename order
  # cannot deliver that (t_plus_120 sorts before t_plus_30, post_fault_*
  # before pre_fault), and label parsing would have to know every scenario's
  # naming scheme. The counter is written into each snapshot so
  # check-invariants.sh has an explicit order that depends on neither
  # filenames nor any cluster node's clock. `run_once` propagates the fact to
  # every host in the play, so it keeps counting across the repeated
  # include_role calls within a scenario.
  set_fact:
    snapshot_index: "{{ (snapshot_index | default(0) | int) + 1 }}"
  run_once: true

# ── etcd observer ────────────────────────────────────────────────────────────

- name: Collect etcd member health and leader status
  shell: |
    ETCDCTL_API=3 etcdctl \
      --endpoints={{ etcd_endpoints }} \
      --cacert={{ etcd_cert_dir }}/ca.crt \
      --cert={{ etcd_cert_dir }}/server.crt \
      --key={{ etcd_cert_dir }}/server.key \
      endpoint status --write-out=json 2>/dev/null
  register: etcd_status
  delegate_to: "{{ groups['etcd'][0] }}"
  run_once: true
  ignore_errors: yes

- name: Collect etcd current revision
  shell: |
    ETCDCTL_API=3 etcdctl \
      --endpoints={{ etcd_endpoints }} \
      --cacert={{ etcd_cert_dir }}/ca.crt \
      --cert={{ etcd_cert_dir }}/server.crt \
      --key={{ etcd_cert_dir }}/server.key \
      endpoint status --write-out=json 2>/dev/null \
      | jq '[.[].Status.header.revision] | max'
  register: etcd_revision
  delegate_to: "{{ groups['etcd'][0] }}"
  run_once: true
  ignore_errors: yes

# ── Kubernetes API observer ──────────────────────────────────────────────────
# All six control-plane queries (nodes, pods, endpoints, both leases, events)
# are bundled into ONE shell call. This used to be six separate `delegate_to`
# tasks firing 5-6 fresh SSH sessions in a few seconds, which tripped sshd's
# MaxStartups during fault windows and surfaced as "Permission denied
# (publickey)" mid-scenario. One bundled call = one SSH session per snapshot
# regardless of ControlMaster state. Each sub-query falls back to `null`
# independently so a kubectl failure in one block does not nullify the others.
#
# Why cp2 by default (not cp1)? Scenarios that partition cp1 (S1, S4, S12,
# S17 — most of them) leave cp1's kubectl unable to reach any apiserver:
#   - cp1's local apiserver has lost etcd (etcd nodes are on the far side
#     of the partition), so it returns errors;
#   - the VIP has failed over to cp2 or cp3 but cp1 cannot route there.
# A scenario that needs to query from a different host (e.g. one that
# partitions cp2 specifically) can override `metrics_cp_host` in its vars.

- name: Collect all control-plane state in one bundled kubectl call
  shell: |
    set -u
    export KUBECONFIG=/etc/kubernetes/admin.conf
    run_or_null() {
      local out
      if out=$("$@" 2>/dev/null); then
        printf '%s' "${out:-null}"
      else
        printf 'null'
      fi
    }
    NC=$(run_or_null kubectl get nodes -o json \
         | jq '[.items[] | {
             name: .metadata.name,
             conditions: [.status.conditions[] | select(.type=="Ready") | {
               type: .type,
               status: .status,
               lastTransition: .lastTransitionTime,
               reason: .reason,
               message: .message
             }],
             taints: .spec.taints,
             unschedulable: .spec.unschedulable
           }]' 2>/dev/null || echo null)
    PS=$(run_or_null kubectl get pods -n {{ stateful_app_namespace }} -o json \
         | jq '[.items[] | {
             name: .metadata.name,
             node: .spec.nodeName,
             phase: .status.phase,
             conditions: .status.conditions,
             containerStatuses: [.status.containerStatuses[]? | {
               name: .name,
               ready: .ready,
               restartCount: .restartCount,
               state: .state
             }]
           }]' 2>/dev/null || echo null)
    ES=$(run_or_null kubectl get endpoints -n {{ stateful_app_namespace }} \
                     {{ stateless_app_name }} {{ stateful_app_name }} -o json \
         | jq '[.items[] | {
             service: .metadata.name,
             subsets: .subsets,
             notReadyAddresses: [.subsets[]?.notReadyAddresses[]?.ip // empty]
           }]' 2>/dev/null || echo null)
    CM=$(run_or_null kubectl get lease kube-controller-manager -n kube-system -o json \
         | jq '{
             holder: .spec.holderIdentity,
             acquireTime: .spec.acquireTime,
             renewTime: .spec.renewTime,
             leaseDuration: .spec.leaseDurationSeconds
           }' 2>/dev/null || echo null)
    SL=$(run_or_null kubectl get lease kube-scheduler -n kube-system -o json \
         | jq '{
             holder: .spec.holderIdentity,
             acquireTime: .spec.acquireTime,
             renewTime: .spec.renewTime,
             leaseDuration: .spec.leaseDurationSeconds
           }' 2>/dev/null || echo null)
    EV=$(run_or_null kubectl get events --all-namespaces --field-selector type=Warning \
                     --sort-by=.lastTimestamp -o json \
         | jq '[.items[-50:] | .[] | {
             namespace: .metadata.namespace,
             name: .metadata.name,
             reason: .reason,
             message: .message,
             involvedObject: .involvedObject,
             count: .count,
             lastTimestamp: .lastTimestamp
           }]' 2>/dev/null || echo null)
    jq -cn \
      --argjson nc "${NC:-null}" \
      --argjson ps "${PS:-null}" \
      --argjson es "${ES:-null}" \
      --argjson cm "${CM:-null}" \
      --argjson sl "${SL:-null}" \
      --argjson ev "${EV:-null}" \
      '{
        node_conditions: $nc,
        pod_states: $ps,
        endpoint_states: $es,
        controller_manager_lease: $cm,
        scheduler_lease: $sl,
        warning_events: $ev
      }'
  register: cp_state
  delegate_to: "{{ metrics_cp_host | default(groups['control_plane'][1]) }}"
  run_once: true
  ignore_unreachable: yes
  ignore_errors: yes

# cp_state.stdout is already a JSON object with the exact field names the
# snapshot expects (node_conditions, pod_states, endpoint_states,
# controller_manager_lease, scheduler_lease, warning_events), so the
# snapshot-assembly task below splices it in directly as the control_plane
# object — no per-field shims needed.

# ── Per-API-server observer views ─────────────────────────────────────────────
# The suite's subject is observers that disagree, but every measurement above
# is taken from ONE API server (metrics_cp_host, cp2 by default). This task
# asks each API server the same questions at the same instant, addressing it
# by its own IP rather than through the keepalived VIP — the VIP would hand
# every query to whichever node currently holds it, which is precisely the
# ambiguity we are trying to measure.
#
#   probe_rv_quorum — resourceVersion of a collection read straight through to
#                     etcd (linearizable);
#   probe_rv_cache  — the same collection with resourceVersion=0, which the
#                     API server answers from its watch cache;
#   node_ready      — that API server's answer for every node's Ready status.
#
# The gap between the two revisions is this API server's watch-cache lag; the
# gap between one server's node_ready map and another's is observer-relative
# disagreement with no interpretation layer in between. I5 is evaluated from
# these. A server that cannot answer records ok:false and is skipped rather
# than counted as agreement.
#
# The kubeadm API server certificate carries the node's own address in its
# SANs, so --server against ansible_host validates with the same admin.conf CA.

- name: Collect the per-API-server view of the cluster
  shell: |
    set -u
    export KUBECONFIG=/etc/kubernetes/admin.conf
    SERVER="https://{{ ansible_host }}:6443"
    TIMEOUT="{{ observer_view_timeout | default('5s') }}"
    HARD="{{ observer_hard_timeout | default(8) }}"
    NODE='{{ observer_question_node }}'
    POD='{{ observer_question_pod }}'
    SVC='{{ observer_question_service }}'
    NS='{{ observer_question_namespace }}'

    # Two nested bounds on every read, both far shorter than the 30-60 s
    # snapshot cadence: kubectl's own --request-timeout, and timeout(1) around
    # the whole process for the case where the client hangs before it arms its
    # own deadline (TCP connect to a blackholed VIP, a SIGSTOPped peer).
    kq() { timeout -k 1 "$HARD" kubectl --server="$SERVER" \
             --request-timeout="$TIMEOUT" "$@" 2>/dev/null; }

    rv_quorum=$(kq get --raw '/api/v1/namespaces/kube-system/configmaps?limit=1' \
      | jq -r '.metadata.resourceVersion // empty' 2>/dev/null || echo "")
    rv_cache=$(kq get --raw '/api/v1/namespaces/kube-system/configmaps?limit=1&resourceVersion=0' \
      | jq -r '.metadata.resourceVersion // empty' 2>/dev/null || echo "")

    # LIST reads, not single-object gets, on purpose. `kubectl get pod X` exits
    # 1 both when the object is absent and when the connection failed, and the
    # stderr that separates them is discarded — so a partition would be recorded
    # as "the pod is gone", which is the exact masquerade this whole block
    # exists to prevent. A list that PARSES is positive evidence: the object is
    # either in it or genuinely absent. A list that does not parse is a failed
    # read and is recorded as one.
    nodes_json=$(kq get nodes -o json || echo "")
    pods_json=$(kq get pods -n "$NS" -o json || echo "")
    eps_json=$(kq get endpoints -n "$NS" -o json || echo "")

    ok_json() { printf '%s' "$1" | jq -e '(.items | type) == "array"' >/dev/null 2>&1; }

    node_ready=""
    if ok_json "$nodes_json"; then
      node_ready=$(printf '%s' "$nodes_json" | jq -c '[.items[] | {
            key: .metadata.name,
            value: ([.status.conditions[] | select(.type == "Ready") | .status][0] // "Missing")
          }] | from_entries' 2>/dev/null || echo "")
    fi

    # ── The three M2 questions, in the canonical answer domains documented in
    #    roles/metrics-collect/files/disagreement.jq ────────────────────────────
    UNREAD='{"state":"unreadable","answer":null,"reason":"%s"}'

    if [ -n "$node_ready" ]; then
      a_node=$(printf '%s' "$node_ready" | jq -c --arg n "$NODE" \
        'if has($n) then {state:"answered",answer:.[$n],reason:null}
         else {state:"answered",answer:"Absent",reason:null} end' 2>/dev/null \
        || printf "$UNREAD" node_list_unparseable)
    else
      a_node=$(printf "$UNREAD" node_list_read_failed)
    fi

    if ok_json "$pods_json"; then
      a_pod=$(printf '%s' "$pods_json" | jq -c --arg p "$POD" \
        '([.items[] | select(.metadata.name == $p)][0]) as $x
         | if $x == null then {state:"answered",answer:"<absent>",reason:null}
           else {state:"answered",answer:(($x.spec.nodeName // "<unscheduled>")),reason:null} end' \
        2>/dev/null || printf "$UNREAD" pod_list_unparseable)
    else
      a_pod=$(printf "$UNREAD" pod_list_read_failed)
    fi

    if ok_json "$eps_json"; then
      a_eps=$(printf '%s' "$eps_json" | jq -c --arg s "$SVC" \
        '([.items[] | select(.metadata.name == $s)][0]) as $x
         | if $x == null then {state:"answered",answer:"<absent>",reason:null}
           else ([$x.subsets[]?.addresses[]?.ip] | unique | sort) as $ips
                | {state:"answered",
                   answer:(if ($ips|length) == 0 then "<empty>" else ($ips|join(",")) end),
                   reason:null} end' \
        2>/dev/null || printf "$UNREAD" endpoints_list_unparseable)
    else
      a_eps=$(printf "$UNREAD" endpoints_list_read_failed)
    fi

    # Server attribution, reusing S21's idea: every serving certificate in this
    # cluster carries the VIP and all three control-plane IPs in its SANs, so an
    # IP SAN cannot say which server answered. The SHA-256 fingerprint can.
    FP=$(echo | timeout 5 openssl s_client -connect "{{ ansible_host }}:6443" 2>/dev/null \
         | openssl x509 -noout -fingerprint -sha256 2>/dev/null | sed 's/.*=//')

    jq -cn \
      --arg host "{{ inventory_hostname }}" \
      --arg server "$SERVER" \
      --arg q "${rv_quorum:-}" \
      --arg c "${rv_cache:-}" \
      --arg fp "${FP:-}" \
      --argjson nr "${node_ready:-null}" \
      --argjson a1 "$a_node" \
      --argjson a2 "$a_pod" \
      --argjson a3 "$a_eps" \
      '{
         host: $host,
         server: $server,
         ok: (($q | length) > 0),
         probe_rv_quorum: (if ($q | length) > 0 then $q else null end),
         probe_rv_cache:  (if ($c | length) > 0 then $c else null end),
         node_ready: $nr,
         cert_fingerprint: (if ($fp | length) > 0 then $fp else null end),
         answers: { node_ready: $a1,
                    stateful_pod_node: $a2,
                    stateless_endpoint_set: $a3 }
       }'
  register: apiserver_view
  when: inventory_hostname in groups['control_plane']
  ignore_errors: yes
  ignore_unreachable: yes

# ── etcd quorum observer ──────────────────────────────────────────────────────
# The one observer in the roster that is not an API server and not node-local:
# a LINEARIZABLE (`--consistency=l`) read of the registry keys straight out of
# etcd. During S19 the API servers are pinned to opposite sides of a quorum
# split; this read is the only answer in the snapshot that the split cannot
# serve stale, because a minority member cannot complete it at all — it times
# out, and a timeout is recorded as `unreadable`, never as agreement.
#
# It runs on an etcd member because /etc/etcd/pki exists ONLY there.
#
# ── Decoding, and its explicit limits ─────────────────────────────────────────
# Kubernetes stores objects in etcd as PROTOBUF, and this lab has no protobuf
# decoder on the nodes (no `auger`). What is extracted is therefore the
# printable-token stream of the value (`tr -c '[:print:]'`), and only the
# facts that can be read off it UNAMBIGUOUSLY are turned into answers:
#
#   node_ready         a NodeCondition encodes type then status as two adjacent
#                      length-prefixed strings, so the token after the token
#                      "Ready" IS its status. Accepted only when exactly one
#                      "Ready" token exists and the following token is one of
#                      True/False/Unknown. Anything else -> unreadable.
#   stateful_pod_node  the node name appears verbatim in the PodSpec. Accepted
#                      only when exactly ONE known node name appears in the
#                      value. Zero matches is UNREADABLE, not "<unscheduled>":
#                      absence of evidence must not be reported as an answer.
#   endpoint set       NOT ANSWERED. `addresses` and `notReadyAddresses` differ
#                      only by their protobuf field tag, which the printable
#                      filter destroys, so the ready set cannot be separated
#                      from the not-ready set. That is a structural limit of
#                      this decoder, not a failed read, so it is reported as
#                      not_applicable — and the raw address tokens are kept
#                      alongside for any future decoder.

- name: Collect the etcd quorum view of the same three questions
  shell: |
    set -u
    export LC_ALL=C
    T={{ observer_etcd_timeout | default(5) }}
    NODE='{{ observer_question_node }}'
    POD='{{ observer_question_pod }}'
    SVC='{{ observer_question_service }}'
    NS='{{ observer_question_namespace }}'
    ALL_NODES='{{ (groups["control_plane"] + groups["workers"]) | join(" ") }}'

    eget() {
      ETCDCTL_API=3 timeout -k 1 $((T + 2)) etcdctl \
        --endpoints={{ etcd_endpoints }} \
        --cacert={{ etcd_cert_dir }}/ca.crt \
        --cert={{ etcd_cert_dir }}/server.crt \
        --key={{ etcd_cert_dir }}/server.key \
        --dial-timeout="${T}s" --command-timeout="${T}s" \
        --consistency=l \
        get "$1" -w json 2>/dev/null
    }
    kcount() { printf '%s' "$1" | jq -r '.count // 0' 2>/dev/null || echo 0; }
    toks()   { printf '%s' "$1" | jq -r '.kvs[0].value // empty' 2>/dev/null \
                 | base64 -d 2>/dev/null | tr -c '[:print:]' '\n' | grep -v '^$'; }
    unread() { printf '{"state":"unreadable","answer":null,"reason":"%s"}' "$1"; }
    answer() { printf '{"state":"answered","answer":"%s","reason":null}' "$1"; }

    NJ=$(eget "/registry/minions/$NODE")
    PJ=$(eget "/registry/pods/$NS/$POD")
    EJ=$(eget "/registry/services/endpoints/$NS/$SVC")

    HREV=$(printf '%s' "$NJ" | jq -r '.header.revision // empty' 2>/dev/null || echo "")
    [ -n "$HREV" ] || HREV=$(printf '%s' "$PJ" | jq -r '.header.revision // empty' 2>/dev/null || echo "")

    # Q1 — is the subject node Ready
    if [ -z "$NJ" ]; then
      a_node=$(unread etcd_read_failed)
    elif [ "$(kcount "$NJ")" = "0" ]; then
      a_node=$(answer Absent)
    else
      NT=$(toks "$NJ")
      nready=$(printf '%s\n' "$NT" | grep -c '^Ready$' || true)
      st=$(printf '%s\n' "$NT" | awk 'p == "Ready" { print; exit } { p = $0 }')
      case "${nready}:${st}" in
        1:True|1:False|1:Unknown) a_node=$(answer "$st") ;;
        *)                        a_node=$(unread etcd_node_ready_decode_ambiguous) ;;
      esac
    fi

    # Q2 — where is the stateful pod
    if [ -z "$PJ" ]; then
      a_pod=$(unread etcd_read_failed)
    elif [ "$(kcount "$PJ")" = "0" ]; then
      a_pod=$(answer '<absent>')
    else
      PT=$(toks "$PJ")
      # Substring, not whole-token, match. A protobuf field tag byte that
      # happens to be printable ASCII (the nodeName tag is 0x52, the letter R,
      # and the tag of whatever field follows it may be printable too) is glued
      # onto the adjacent string by the printable-run filter, so worker2 can
      # surface as worker2b. The "exactly one distinct node name" guard below
      # is what keeps this honest: two matches, or none, are unreadable.
      hits=""
      for n in $ALL_NODES; do
        if printf '%s\n' "$PT" | grep -qF -- "$n"; then hits="$hits $n"; fi
      done
      set -- $hits
      if [ "$#" = "1" ]; then a_pod=$(answer "$1")
      elif [ "$#" = "0" ]; then a_pod=$(unread etcd_pod_node_not_decodable)
      else a_pod=$(unread etcd_pod_node_ambiguous); fi
    fi

    # Q3 — structurally not answerable from this decoder; see the header.
    if [ -z "$EJ" ]; then
      a_eps=$(unread etcd_read_failed)
      raw_ips='[]'
    elif [ "$(kcount "$EJ")" = "0" ]; then
      a_eps=$(answer '<absent>')
      raw_ips='[]'
    else
      a_eps='{"state":"not_applicable","answer":null,"reason":"etcd_protobuf_ready_vs_notready_not_separable"}'
      # -o, not an anchored match, for the same tag-byte-glue reason as above.
      raw_ips=$(toks "$EJ" \
        | grep -oE '[0-9]{1,3}(\.[0-9]{1,3}){3}' \
        | sort -u | jq -R . | jq -sc . 2>/dev/null || echo '[]')
    fi

    jq -cn \
      --arg ep '{{ etcd_endpoints }}' \
      --arg rev "${HREV:-}" \
      --argjson a1 "$a_node" \
      --argjson a2 "$a_pod" \
      --argjson a3 "$a_eps" \
      --argjson raw "${raw_ips:-[]}" \
      '{ ok: (($rev | length) > 0),
         endpoints: $ep,
         consistency: "linearizable",
         header_revision: (if ($rev | length) > 0 then $rev else null end),
         raw_endpoint_address_tokens: $raw,
         answers: { node_ready: $a1,
                    stateful_pod_node: $a2,
                    stateless_endpoint_set: $a3 } }'
  register: etcd_quorum_view
  delegate_to: "{{ groups['etcd'][0] }}"
  run_once: true
  ignore_errors: yes
  ignore_unreachable: yes

# ── Per-node kubelet observer ─────────────────────────────────────────────────
# These two tasks talk to each cluster host directly. During a partition the
# fault target may briefly drop its ssh mux ("Broken pipe") which Ansible
# normally turns into a global `unreachable=1` marker that excludes the host
# from every subsequent play in the run — silently breaking the scenario's
# own teardown play. `ignore_unreachable: yes` keeps the per-snapshot failure
# local, leaving the host eligible for the teardown.

- name: Collect kubelet node status from each node
  # Extended for REVIEW.md M2: this is now the `kubelet:<node>` observer, not
  # just a resource sample. It answers the same three questions as every other
  # observer, from the kubelet's OWN port, without going through any API server.
  #
  # Credentials. /etc/kubernetes/pki/apiserver-kubelet-client.* is the identity
  # the API server itself uses against :10250 and is accepted by every kubelet,
  # but it exists only on control-plane nodes. Workers fall back to the
  # kubelet's own client certificate. If a kubelet's authorizer refuses that
  # identity for /pods the read is recorded as unreadable with the HTTP status
  # in the reason — a 403 is missing data, and it is never allowed to look like
  # an answer.
  #
  # What each question means to a kubelet:
  #   node_ready              only the kubelet ON the subject node is asked;
  #                           every other kubelet answers not_applicable. The
  #                           kubelet has no Node object, so its answer is its
  #                           /healthz self-declaration — "True" when the
  #                           syncloop reports healthy. That is an
  #                           APPROXIMATION of the Ready condition it would
  #                           post (Ready also folds in runtime, network and
  #                           PLEG state), and it is the interesting one: during
  #                           a partition the kubelet still says True while the
  #                           API server says Unknown.
  #   stateful_pod_node       answered ONLY when the pod is present here. A
  #                           node-local observer can witness presence, never
  #                           absence-elsewhere, so "not here" is
  #                           not_applicable rather than an answer about where
  #                           the pod is.
  #   stateless_endpoint_set  not_applicable — a kubelet has no Service view.
  shell: |
    set -u
    T={{ observer_kubelet_timeout | default(5) }}
    NODE='{{ observer_question_node }}'
    POD='{{ observer_question_pod }}'
    NS='{{ observer_question_namespace }}'
    ME='{{ inventory_hostname }}'

    if [ -r /etc/kubernetes/pki/apiserver-kubelet-client.key ]; then
      CERT=/etc/kubernetes/pki/apiserver-kubelet-client.crt
      KEY=/etc/kubernetes/pki/apiserver-kubelet-client.key
      CREDENTIAL=apiserver-kubelet-client
    else
      CERT=/var/lib/kubelet/pki/kubelet-client-current.pem
      KEY=/var/lib/kubelet/pki/kubelet-client-current.pem
      CREDENTIAL=kubelet-client-current
    fi

    W=$(mktemp -d) || W=/tmp
    trap 'rm -rf "$W"' EXIT

    # --max-time is load-bearing: a SIGSTOPped kubelet (S22) still completes
    # the TCP handshake in the kernel and then never answers, so an unbounded
    # curl blocks for the whole freeze. ignore_errors cannot rescue a hang.
    # timeout(1) is the outer bound for the case where curl itself wedges.
    kget() {  # $1 = path, $2 = body file; echoes the HTTP status (000 = no reply)
      timeout -k 1 $((T + 2)) curl -sk --max-time "$T" \
        --cert "$CERT" --key "$KEY" \
        -o "$2" -w '%{http_code}' \
        "https://127.0.0.1:10250$1" 2>/dev/null || printf '000'
    }

    SUM_CODE=$(kget /stats/summary "$W/sum.json")
    HZ_CODE=$(kget /healthz "$W/hz.txt")
    PODS_CODE=$(kget /pods "$W/pods.json")

    SUM=$(jq -c '{node: .node.nodeName, cpu: .node.cpu, memory: .node.memory}' \
            < "$W/sum.json" 2>/dev/null || echo null)
    HZ=$(tr -d '[:space:]' < "$W/hz.txt" 2>/dev/null || echo "")

    unread() { printf '{"state":"unreadable","answer":null,"reason":"%s"}' "$1"; }
    na()     { printf '{"state":"not_applicable","answer":null,"reason":"%s"}' "$1"; }
    answer() { printf '{"state":"answered","answer":"%s","reason":null}' "$1"; }

    if [ "$ME" != "$NODE" ]; then
      a_node=$(na question_targets_another_node)
    elif [ "$HZ_CODE" = "200" ] && [ "$HZ" = "ok" ]; then
      a_node=$(answer True)
    elif [ "$HZ_CODE" = "200" ]; then
      a_node=$(answer False)
    else
      a_node=$(unread "kubelet_healthz_http_${HZ_CODE}")
    fi

    if [ "$PODS_CODE" != "200" ]; then
      a_pod=$(unread "kubelet_pods_http_${PODS_CODE}")
      LOCAL='null'
    elif ! jq -e '(.items | type) == "array"' < "$W/pods.json" >/dev/null 2>&1; then
      a_pod=$(unread kubelet_pods_unparseable)
      LOCAL='null'
    else
      LOCAL=$(jq -c '[.items[] | {name: .metadata.name,
                                  namespace: .metadata.namespace,
                                  node: .spec.nodeName,
                                  phase: .status.phase}]' \
                < "$W/pods.json" 2>/dev/null || echo null)
      if jq -e --arg p "$POD" --arg n "$NS" \
           'any(.items[]?; .metadata.name == $p and .metadata.namespace == $n)' \
           < "$W/pods.json" >/dev/null 2>&1; then
        a_pod=$(answer "$ME")
      else
        a_pod=$(na pod_not_on_this_node)
      fi
    fi

    a_eps=$(na kubelet_has_no_service_view)

    jq -cn \
      --argjson sum "${SUM:-null}" \
      --argjson local "${LOCAL:-null}" \
      --arg cred "$CREDENTIAL" \
      --arg hz "${HZ:-}" \
      --arg hzc "$HZ_CODE" --arg pc "$PODS_CODE" --arg sc "$SUM_CODE" \
      --argjson a1 "$a_node" --argjson a2 "$a_pod" --argjson a3 "$a_eps" \
      '($sum // {}) + {
         credential: $cred,
         healthz: (if ($hz | length) > 0 then $hz else null end),
         http: { summary: $sc, healthz: $hzc, pods: $pc },
         local_pods: $local,
         answers: { node_ready: $a1,
                    stateful_pod_node: $a2,
                    stateless_endpoint_set: $a3 }
       }
       | (if $sum == null then . + {error: "kubelet_unreachable"} else . end)'
  register: kubelet_local_status
  when: inventory_hostname in groups['workers'] or inventory_hostname in groups['control_plane']
  ignore_errors: yes
  ignore_unreachable: yes

- name: Collect running containers from crictl on each node
  # This is the node-local ground truth used by the I1 (dual ownership) and
  # I3 (failure-declaration) checks — what is *actually* running on the node,
  # independent of the API server's view. `set -o pipefail` is essential:
  # without it, if crictl is missing/fails, jq receives empty input, exits 0,
  # the `|| echo '[]'` fallback never fires, and the field silently becomes
  # "" — which is exactly how dual ownership went undetected before.
  # Captures podName / podNamespace / podUid so the I1 check can group a
  # single pod identity across nodes.
  shell: |
    set -o pipefail
    crictl ps -o json 2>/dev/null \
      | jq -c '[.containers[] | {
          id: .id,
          name: .metadata.name,
          state: .state,
          podName: .labels."io.kubernetes.pod.name",
          podNamespace: .labels."io.kubernetes.pod.namespace",
          podUid: .labels."io.kubernetes.pod.uid"
        }]' \
    || echo '[]'
  register: crictl_containers
  when: inventory_hostname in groups['workers'] or inventory_hostname in groups['control_plane']
  ignore_errors: yes
  ignore_unreachable: yes

# ── Client observer ───────────────────────────────────────────────────────────
# This used to run on the observer — the workstation running Ansible — against
# the service ClusterIP. ClusterIP CIDRs are not routable from there, so every
# snapshot of every scenario in the May 2026 sweep recorded httpCode 0,
# including pre_fault, and I2 was reported VIOLATED in 11 of 12 scenarios
# before any fault was injected. S15 documents the same constraint in its own
# header and works around it by running its traffic generator on a
# control-plane node; this does the same, on the host metrics_cp_host already
# designates as reachable for the run.
#
# The distinction the old version could not express: a probe that RAN AND
# FAILED (httpCode 0 from a refused connection, or 5xx) is evidence, while a
# probe that COULD NOT RUN AT ALL is missing data. The latter now emits
# httpCode: null, and check-invariants.sh skips it instead of counting it as a
# violation. probe_source records where the request came from, so a future
# change of vantage point is visible in the data rather than silent.

- name: Probe service reachability from inside the cluster
  # Extended for REVIEW.md M2: this is now the `client:in-cluster-probe`
  # observer. The HTTP code is kept exactly as it was (check-invariants.sh I2
  # reads .external_probe.httpCode), and the probe additionally answers the
  # endpoint-set question from the KUBE-PROXY DATAPLANE on this host rather
  # than from any API server.
  #
  # That is the point of having it in the roster: every other endpoint answer
  # in the snapshot is an API read, so they can only disagree with each other
  # about what the control plane BELIEVES. The nat table is what a client's
  # connection is actually load-balanced across, and S20 exists precisely to
  # produce the case where the two differ — endpoints published and Ready while
  # no client can reach them.
  #
  # Reading it is deliberately conservative:
  #   no KUBE-SVC chains at all      -> unreadable (kube-proxy not in iptables
  #                                     mode, or iptables-save failed). Never
  #                                     "<absent>", which would read as a
  #                                     positive observation that the Service
  #                                     has no backends.
  #   chains exist, none for the svc -> answered "<absent>"
  #   chains for the svc, no DNAT    -> answered "<empty>"
  shell: |
    set -u
    export KUBECONFIG=/etc/kubernetes/admin.conf
    T={{ observer_probe_timeout | default(3) }}
    SVC='{{ observer_question_service }}'
    NS='{{ observer_question_namespace }}'

    unread() { printf '{"state":"unreadable","answer":null,"reason":"%s"}' "$1"; }
    na()     { printf '{"state":"not_applicable","answer":null,"reason":"%s"}' "$1"; }
    answer() { printf '{"state":"answered","answer":"%s","reason":null}' "$1"; }

    SVC_IP=$(timeout -k 1 $((T + 2)) kubectl get svc "$SVC" -n "$NS" \
      -o jsonpath='{.spec.clusterIP}' 2>/dev/null || echo "")

    if [ -z "$SVC_IP" ]; then
      CLUSTER_IP=null
      CODE_JSON=null
      ERRFIELD='"error": "no_clusterIP",'
    else
      CLUSTER_IP="\"$SVC_IP\""
      ERRFIELD=""
      code=$(curl -sk --max-time "$T" "http://$SVC_IP/" -o /dev/null -w '%{http_code}' 2>/dev/null || echo "")
      if [ -z "$code" ]; then
        CODE_JSON=null
      else
        # curl writes 000 on a failed connection; strip the leading zeros so the
        # value is valid JSON (and a real, countable failure rather than null).
        CODE_JSON=$((10#$code))
      fi
    fi

    a_node=$(na client_has_no_node_condition_view)
    a_pod=$(na client_has_no_pod_placement_view)

    if [ '{{ observer_dataplane_endpoints | default(true) | bool | ternary(1, 0) }}' != '1' ]; then
      a_eps=$(na dataplane_endpoint_read_disabled)
      DP='[]'
    else
      NAT=$(timeout -k 1 $((T + 2)) iptables-save -t nat 2>/dev/null || echo "")
      if ! printf '%s' "$NAT" | grep -q 'KUBE-SVC-'; then
        a_eps=$(unread kube_proxy_iptables_unavailable)
        DP='[]'
      elif ! printf '%s' "$NAT" | grep -q -- "$NS/$SVC"; then
        a_eps=$(answer '<absent>')
        DP='[]'
      else
        IPS=$(printf '%s' "$NAT" \
          | awk -v pat="$NS/$SVC" 'index($0, pat) > 0 && index($0, "--to-destination") > 0 {
                for (i = 1; i <= NF; i++)
                  if ($i == "--to-destination") { split($(i + 1), a, ":"); print a[1] }
              }' \
          | sort -u)
        DP=$(printf '%s\n' "$IPS" | grep -v '^$' | jq -R . | jq -sc . 2>/dev/null || echo '[]')
        if [ -z "$IPS" ]; then
          a_eps=$(answer '<empty>')
        else
          a_eps=$(answer "$(printf '%s' "$IPS" | tr '\n' ',' | sed 's/,$//')")
        fi
      fi
    fi

    jq -cn \
      --arg svc "$SVC" \
      --argjson clusterip "$CLUSTER_IP" \
      --argjson code "$CODE_JSON" \
      --argjson dp "${DP:-[]}" \
      --argjson a1 "$a_node" --argjson a2 "$a_pod" --argjson a3 "$a_eps" \
      '{ service: $svc,
         clusterIP: $clusterip,
         httpCode: $code,
         probe_source: "in_cluster",
         dataplane_endpoints: $dp,
         answers: { node_ready: $a1,
                    stateful_pod_node: $a2,
                    stateless_endpoint_set: $a3 } }
       | (if $clusterip == null then . + {error: "no_clusterIP"} else . end)'
  register: service_probe
  delegate_to: "{{ metrics_cp_host | default(groups['control_plane'][1]) }}"
  run_once: true
  ignore_errors: yes
  ignore_unreachable: yes

# ── In-cluster informer observer ──────────────────────────────────────────────
# The informer is a Job created by tasks/trace-start.yml and destroyed by
# tasks/trace-stop.yml; see the lifecycle note in inventory/group_vars/all.yml.
# It is the only observer in the roster that reaches the control plane the way
# an in-cluster controller does — through the kubernetes.default.svc ClusterIP,
# so kube-proxy, not the operator, chooses which API server answers.
#
# Reading it is a plain `kubectl logs --tail=1`, which means a snapshot taken
# while the informer does not exist (any scenario that never starts the trace)
# records state:"unreadable", reason:"informer_absent". That is missing data
# and is scored as missing data; it never becomes agreement.
#
# A line older than observer_informer_max_age_ms is also unreadable: the
# informer is MEANT to lag (that lag is a measurement), but a line minutes old
# is a dead pod, not a lag, and believing it would silently pin an observer to
# a stale answer for the rest of the run.

- name: Collect the in-cluster informer's view
  shell: |
    set -u
    export KUBECONFIG=/etc/kubernetes/admin.conf
    T={{ observer_informer_timeout | default(6) }}
    JOB='{{ informer_object_name }}'
    NSI='{{ observer_informer_namespace }}'
    MAXAGE={{ observer_informer_max_age_ms | default(15000) }}

    LINE=$(timeout -k 1 "$T" kubectl -n "$NSI" logs "job/$JOB" --tail=1 \
             --request-timeout="${T}s" 2>/dev/null | tail -1 || echo "")

    if [ -z "$LINE" ]; then
      printf '{"ok":false,"reason":"informer_absent","source":null,"job":"%s"}' "$JOB"
      exit 0
    fi
    if ! printf '%s' "$LINE" | jq -e 'type == "object" and has("answers")' >/dev/null 2>&1; then
      printf '{"ok":false,"reason":"informer_line_unparseable","source":null,"job":"%s"}' "$JOB"
      exit 0
    fi

    NOW=$(date -u +%s%3N)
    printf '%s' "$LINE" | jq -c \
      --argjson now "$NOW" --argjson maxage "$MAXAGE" --arg job "$JOB" \
      '((.ts_epoch_ms // null) as $t
        | (if $t == null then null else ($now - $t) end)) as $age
       | { ok: (($age != null) and ($age <= $maxage)),
           reason: (if $age == null then "informer_line_untimestamped"
                    elif $age > $maxage then "informer_stale"
                    else null end),
           source: (.source // null),
           job: $job,
           read_mode: (.read_mode // null),
           resource_versions: (.resource_versions // null),
           cache_age_ms: $age,
           answers: .answers }'
  register: informer_view
  delegate_to: "{{ metrics_cp_host | default(groups['control_plane'][1]) }}"
  run_once: true
  when: observer_informer_enabled | default(true) | bool
  ignore_errors: yes
  ignore_unreachable: yes

# ── Write-liveness canary (I11) ───────────────────────────────────────────────
# Every other observation in this snapshot is a READ. A cluster can answer every
# read correctly, report every node Ready and hold quorum, and still accept no
# writes at all — S23 does exactly that: the etcd NOSPACE alarm arms, reads keep
# being served, all six nodes stay Ready, and every write is refused. Nothing in
# I1-I10 can express that, because every one of them asks about consistency and
# none asks about progress.
#
# So: attempt one small write against EACH API server directly by IP, bypassing
# the VIP, and record whether it was accepted. An UPDATE (annotate) rather than
# a CREATE, deliberately — CREATE is what admission webhooks most often scope
# themselves to, and this probe is meant to measure whether the cluster can
# commit at all, not whether one namespace is gated.
#
# The canary is created if missing, so the probe is self-healing across a
# baseline revert. A write that fails because the canary does not exist AND
# cannot be created is still a failed write, which is the correct reading.
#
# read_ok is recorded alongside: "reads work, writes do not" is the signature
# I11 looks for, and a probe where BOTH fail means the API server is simply
# unreachable from here, which is not a liveness violation but a lost observer.
- name: Probe write liveness against each API server
  shell: |
    set -u
    export KUBECONFIG=/etc/kubernetes/admin.conf
    CANARY_NS="default"
    CANARY_NAME="liveness-canary"
    TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    OUT=""

    # Each API server directly by IP, AND the API VIP. The VIP matters: S21
    # splits it so two nodes answer the same address, and a probe that only ever
    # addresses the backends never traverses the faulted component — it cannot
    # come out any way but PRESERVED, which makes it a confirmation rather than
    # a test (REVIEW.md D63).
    for ep in {{ groups['control_plane'] | map('extract', hostvars, 'ansible_host') | list | join(' ') }} {{ api_vip }}; do
      SRV="https://${ep}:6443"

      # Read first: distinguishes "cannot reach this API server" from
      # "this API server will not accept a write".
      if kubectl --server="$SRV" --insecure-skip-tls-verify=false \
           --request-timeout=10s -n "$CANARY_NS" get configmap "$CANARY_NAME" \
           >/dev/null 2>&1; then
        READ_OK=true
      else
        # It may simply not exist yet. A successful list proves the read path.
        if kubectl --server="$SRV" --request-timeout=10s -n "$CANARY_NS" \
             get configmap >/dev/null 2>&1; then READ_OK=true; else READ_OK=false; fi
      fi

      START=$(date +%s%N)
      ERR=$(kubectl --server="$SRV" --request-timeout=15s -n "$CANARY_NS" \
              annotate configmap "$CANARY_NAME" "liveness-probe=$TS" --overwrite 2>&1)
      RC=$?
      if [ "$RC" -ne 0 ] && printf '%s' "$ERR" | grep -qi "not found"; then
        ERR=$(kubectl --server="$SRV" --request-timeout=15s -n "$CANARY_NS" \
                create configmap "$CANARY_NAME" \
                --from-literal=liveness-probe="$TS" 2>&1)
        RC=$?
      fi
      END=$(date +%s%N)
      LAT=$(( (END - START) / 1000000 ))

      if [ "$RC" -eq 0 ]; then WRITE_OK=true; ERR=""; else WRITE_OK=false; fi

      OUT="$OUT$(jq -cn --arg s "$ep" --arg srv "$SRV" --argjson w "$WRITE_OK" \
                       --argjson r "$READ_OK" --argjson l "$LAT" --arg e "$ERR" \
        '{server: $s, endpoint: $srv, write_accepted: $w, read_ok: $r,
          latency_ms: $l, error: (if $e == "" then null else ($e | .[0:400]) end)}'),"
    done

    # A scenario may declare a namespace its fault deliberately gates
    # (liveness_scoped_ns). That write is recorded SEPARATELY and is deliberately
    # NOT part of any_write_accepted: I11 is a claim about cluster-wide write
    # liveness, and folding a scoped refusal into it would make the invariant
    # fire on exactly the case its scope excludes. Recording it is what turns
    # S24 from "the canary was never gated, so of course I11 stayed silent" into
    # "the gated namespace was provably blocked while the cluster still
    # committed" — the difference between confirming the scope claim and testing
    # it (REVIEW.md D63).
    SCOPED_NS="{{ liveness_scoped_ns | default('') }}"
    SCOPED_LABEL="{{ liveness_scoped_label | default('') }}"
    SCOPED="null"
    if [ -n "$SCOPED_NS" ]; then
      S_NAME="scoped-canary-$(date +%s)"
      # The label matters. A scenario may gate its namespace with an
      # objectSelector as well as a namespaceSelector — S24 does both — so an
      # unlabelled object sails through and the probe would report the namespace
      # as writable while it is, for the objects the fault targets, not.
      S_ERR=$(kubectl --request-timeout=15s -n "$SCOPED_NS" \
                create configmap "$S_NAME" \
                --from-literal=liveness-probe="$TS" 2>&1)
      S_RC=$?
      if [ "$S_RC" -eq 0 ] && [ -n "$SCOPED_LABEL" ]; then
        kubectl --request-timeout=10s -n "$SCOPED_NS" delete configmap "$S_NAME" >/dev/null 2>&1
        S_ERR=$(kubectl --request-timeout=15s -n "$SCOPED_NS" create -f - <<YAML 2>&1
apiVersion: v1
kind: ConfigMap
metadata:
  name: $S_NAME
  labels:
    ${SCOPED_LABEL%%=*}: "${SCOPED_LABEL#*=}"
data:
  liveness-probe: "$TS"
YAML
        )
        S_RC=$?
      fi
      if [ "$S_RC" -eq 0 ]; then S_OK=true; S_ERR=""; else S_OK=false; fi
      SCOPED=$(jq -cn --arg ns "$SCOPED_NS" --arg lbl "$SCOPED_LABEL" --argjson ok "$S_OK" --arg e "$S_ERR" \
        '{namespace: $ns, label: (if $lbl == "" then null else $lbl end),
          write_accepted: $ok,
          error: (if $e == "" then null else ($e | .[0:400]) end),
          note: "Recorded only. Not part of any_write_accepted: I11 is a cluster-wide claim, and a scoped refusal is a different property."}')
    fi

    printf '%s' "{\"canary\": \"$CANARY_NS/$CANARY_NAME\", \"probe_source\": \"in_cluster\", \"ts\": \"$TS\", \"scoped\": $SCOPED, \"attempts\": [${OUT%,}]}" \
      | jq -c '. + { any_write_accepted: ([.attempts[] | select(.write_accepted)] | length > 0),
                     any_read_ok:        ([.attempts[] | select(.read_ok)] | length > 0),
                     servers_probed:     (.attempts | length),
                     vip_probed:         ([.attempts[] | select(.server == "{{ api_vip }}")] | length > 0) }'
  register: write_probe
  delegate_to: "{{ metrics_cp_host | default(groups['control_plane'][1]) }}"
  run_once: true
  ignore_errors: yes
  ignore_unreachable: yes

# ── Assemble and write snapshot ───────────────────────────────────────────────

- name: Reset per-node accumulator before assembling this snapshot
  # set_fact facts persist for the whole play, so without this reset
  # node_snapshots accumulates across every metrics-collect call in a
  # scenario — a 3-snapshot play ended up with 18 entries for 6 hosts,
  # each host triplicated. Start each snapshot from an empty list.
  set_fact:
    node_snapshots: []
  delegate_to: "{{ groups['observer'][0] }}"
  run_once: true

- name: Reset per-API-server view accumulator before assembling this snapshot
  # Same reasoning as the node accumulator above: set_fact persists for the
  # whole play, so without the reset the observer list grows by one entry per
  # control-plane node on every snapshot of the scenario.
  set_fact:
    observer_views: []
  delegate_to: "{{ groups['observer'][0] }}"
  run_once: true

- name: Assemble per-API-server observer views
  # A control-plane node whose view task produced nothing — unreachable host,
  # a shell that died mid-write — used to be REJECTED from .observers[] and
  # simply vanish from the snapshot. That shrinks the observer roster exactly
  # when a partition removes an observer, and a smaller roster of observers
  # that all agree reads as consensus. It is the single most dangerous shape
  # this data can take, so a missing view is materialised as an explicit
  # ok:false, answers:null entry instead: the roster is the same size in every
  # snapshot of a run, and the missing observer is visibly missing.
  #
  # ok:false and answers:null are what files/disagreement.jq turns into three
  # `unreadable` answers, which are excluded from every pairwise comparison.
  # check-invariants.sh's I5 already selects `.ok == true`, so it is unaffected.
  set_fact:
    observer_views: "{{ observer_views | default([]) + [
      (hostvars[item]['apiserver_view']['stdout'] | default('') | trim)
      if ((hostvars[item]['apiserver_view']['stdout'] | default('') | trim) | length) > 0
      else ({
        'host': item,
        'server': 'https://' ~ hostvars[item]['ansible_host'] ~ ':6443',
        'ok': false,
        'probe_rv_quorum': none,
        'probe_rv_cache': none,
        'node_ready': none,
        'cert_fingerprint': none,
        'answers': none
      } | to_json)
    ] }}"
  loop: "{{ groups['control_plane'] }}"
  delegate_to: "{{ groups['observer'][0] }}"
  run_once: true

- name: Assemble per-node data (gathered on observer)
  set_fact:
    node_snapshots: "{{ node_snapshots | default([]) + [
      {
        'host': item,
        'kubelet_status': hostvars[item]['kubelet_local_status']['stdout'] | default('unavailable'),
        'containers': hostvars[item]['crictl_containers']['stdout'] | default('[]')
      }
    ] }}"
  loop: "{{ groups['workers'] + groups['control_plane'] }}"
  delegate_to: "{{ groups['observer'][0] }}"
  run_once: true

- name: Write snapshot JSON to results directory
  copy:
    dest: "{{ results_dir }}/snapshot_{{ snapshot_label }}.json"
    content: |
      {
        "scenario_id": "{{ scenario_id }}",
        "run_id": "{{ run_id }}",
        "snapshot_label": "{{ snapshot_label }}",
        "snapshot_index": {{ snapshot_index | default(0) | int }},
        "timestamp": "{{ snapshot_ts }}",
        "etcd": {
          "member_status": {{ etcd_status.stdout | default('null', true) }},
          "current_revision": {{ etcd_revision.stdout | default('null', true) }},
          "expected_members": {{ groups['etcd'] | length }},
          "quorum_read": {{ etcd_quorum_view.stdout | default('null', true) }}
        },
        "control_plane": {{ cp_state.stdout | default('null', true) }},
        "nodes": {{ node_snapshots | to_json }},
        "observers": [ {{ observer_views | default([]) | reject('equalto', '') | join(', ') }} ],
        "external_probe": {{ service_probe.stdout | default('null', true) }},
        "write_probe": {{ write_probe.stdout | default('null', true) }},
        "informer": {{ informer_view.stdout | default('null', true) }}
      }
  delegate_to: "{{ groups['observer'][0] }}"
  run_once: true

# ── Derive the pairwise disagreement matrix ───────────────────────────────────
# REVIEW.md M2's first output. Everything above COLLECTS; this step only
# DERIVES, from the snapshot that was just written, and splices the result back
# into the same file so there is exactly one artefact per snapshot and no
# second source of truth for M4 to reconcile.
#
# Two members are added and nothing is changed or removed:
#   .observer_answers  the flat observer roster with every observer's answer to
#                      every question, each tagged answered / unreadable /
#                      not_applicable;
#   .disagreement      schema "observer-disagreement/v1" — the pairwise matrix,
#                      per-question counts and a per-snapshot summary.
# The full contract, including the canonical answer domains and the rule that
# only answered/answered pairs are ever comparable, is documented at the top of
# files/disagreement.jq.
#
# It runs on the observer (the macOS control machine), which has jq and is the
# only host guaranteed to be reachable — the derivation must not fail because a
# cluster node is partitioned, since a partition is exactly when the matrix is
# worth having. Written to a temp file and moved into place so an interrupted
# run cannot leave a half-written snapshot behind.
#
# It never fails the play: a scenario that produced a snapshot but no matrix is
# strictly better than a scenario that aborted at metrics collection with its
# fault still injected.

- name: Derive the pairwise observer disagreement matrix for this snapshot
  shell: |
    set -u
    SNAP='{{ results_dir }}/snapshot_{{ snapshot_label }}.json'
    TMP="$SNAP.tmp.$$"
    if jq -f '{{ role_path }}/files/disagreement.jq' \
         --arg subject_node '{{ observer_question_node }}' \
         --arg subject_pod '{{ observer_question_pod }}' \
         --arg subject_service '{{ observer_question_service }}' \
         "$SNAP" > "$TMP" 2>/dev/null && [ -s "$TMP" ]; then
      mv "$TMP" "$SNAP"
      echo DERIVED
    else
      rm -f "$TMP"
      echo NOT_DERIVED
      exit 1
    fi
  register: disagreement_derive
  delegate_to: "{{ groups['observer'][0] }}"
  run_once: true
  changed_when: false
  ignore_errors: yes

- name: Report that the disagreement matrix could not be derived
  # Loud, but not fatal — see above. A missing .disagreement in a snapshot is
  # unambiguous to a consumer; a snapshot silently replaced by an empty file
  # would not be.
  debug:
    msg: >-
      metrics-collect: could not derive the disagreement matrix for
      snapshot '{{ snapshot_label }}'. The snapshot itself is intact and still
      carries every observer's raw answers; only .observer_answers and
      .disagreement are missing.
  when: (disagreement_derive.rc | default(1)) != 0
  run_once: true

- name: Append snapshot label to run index
  lineinfile:
    path: "{{ results_dir }}/run_index.txt"
    line: "{{ snapshot_ts }} {{ snapshot_label }}"
    create: yes
  delegate_to: "{{ groups['observer'][0] }}"
